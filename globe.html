/* The trail is drawn as a gradient from cold at the start to the species
   colour at the bird, so how far along the journey is has a colour. */
const TRAIL_COLD = "#1b3a6b";

/* The rest of the deposit, on the same clock: every bird draws the track it
   has flown so far, dimmed and thin, so the flock reads as a flock.

   This began as a short rolling tail on the theory that full histories would
   bury the bird the camera follows. On the stork it did the opposite. A
   solar tag stops reporting overnight, so a companion's track is a run of
   90-minute fixes broken by a seven-hour silence every night; a three-day
   tail cut at every silence was therefore never more than one daylight
   stretch, and usually one point. Measured across the timeline, the median
   companion tail was zero kilometres long -- 58 birds rendering as dots
   beside one long line. Whatever else is true of the flock, it is not that.

   Nor is the fix simply a longer tail: a tail cannot be longer than the
   silence that truncates it. The night has to be crossed. */
/* Which silences may be drawn across, on the same rule the flat map uses.
   A gap up to a day connects whatever the bird was doing -- that is a night
   at roost, and the line across it is short because the bird did not move.
   A longer one connects only if the bird went nowhere across it, so a tag
   that fell quiet over a continent is left as a break rather than a guess. */
const BRIDGE_H = 24;
const STILL_H = 240;
const STILL_KMH = 8;
/* How many points a companion's line is decimated to. Fifty-eight complete
   stork tracks are 43,910 fixes; rebuilding that many vertices ten times a
   second is the thing that would stutter. At this figure forty simultaneous
   companions come to about 3,500 vertices, which measured no slower on a
   software renderer than the short tails it replaces. */
const OTHERS_MAX = 90;
const OTHERS_DIM = "rgba(196,220,252,0.44)";
const OTHERS_FADE = "rgba(30,52,86,0.55)";
const OTHERS_DOT = "rgba(226,240,255,0.9)";
let showOthers = true;

/* Which journeys the page offers, in the order they appear under View.

   Three of them are tracks: a real animal's real fixes. The fourth is not,
   and it is kept honestly separate rather than blended in -- see the eel
   section below and the badge that sits over the globe while it is up. */
const ORDER = ["stork", "godwit", "albatross", "eel"];
const SCHEMATIC = new Set(["eel"]);
const mode = k => (SCHEMATIC.has(k) ? "swarm" : "track");
let MODE = "track";

let TRACKS = null;          /* key -> payload from globe-tracks.json */
let T = null;               /* the active track */
let key = "stork";

let globe = null;
let playing = true;
let simMin = 0;             /* minutes since the journey's first fix */
/* How long a full pass should take, in real seconds, whatever the journey.

   A fixed rate cannot serve these three. Eight journey-hours per second was
   fine when the longest trip was three weeks, but the stork's autumn is 136
   days: at that rate it ran for six and three-quarter minutes, and the first
   twenty-one of those days are a bird standing near its nest. Thirty seconds
   of watching bought twenty-two kilometres of movement, sub-pixel at this
   altitude -- so the view looked broken when it was merely glacial. The rate
   now comes from the journey's own length, and the buttons are multiples of
   it rather than absolute speeds. */
const RUN_SECONDS = 75;
let speedMult = 1;
const baseSpeed = () => (T.min[T.min.length - 1] / 60) / RUN_SECONDS;

/* Camera state, eased toward the bird rather than snapped to it. Longitude is
   carried unwrapped -- the albatross crosses the antimeridian, and easing
   through 180 in wrapped degrees would spin the globe the long way round. */
let camLat = 0, camLng = 0, camAlt = 1.5, camReady = false;
let targetAlt = 1.5, lastSetAlt = -1;

/* Who the camera is holding. FOCAL is the view's own bird; a string id is one
   of the company; null means nobody, and the globe is the viewer's to turn.
   Spinning it by hand hands control over -- tapping a bird takes it back. */
const FOCAL = "\u0000focal";
let followId = FOCAL;
let grabbing = false;      /* a pointer is on the globe right now */

function followTarget(){
  if (!followId || MODE === "swarm") return null;
  if (followId === FOCAL) return at(T, simMin);
  const o = (T.others || []).find(x => x.id === followId);
  return o ? otherAt(o, simMin) : null;
}

function followLabel(){
  if (!followId) return "free";
  return followId === FOCAL ? T.individual : followId;
}

/* The bird closest to a point on the globe, if one is close enough to have
   plausibly been aimed at. */
function nearestBird(lat, lng){
  if (MODE === "swarm") return null;      /* there is no individual to follow */
  const tol = Math.max(1.2, 3.4 * camAlt);      /* degrees, widening as you zoom out */
  let best = null, bestD = Infinity;
  const consider = (id, a, o) => {
    const dLat = a - lat;
    const dLng = (((o - lng) + 540) % 360 - 180) * Math.cos(lat * Math.PI / 180);
    const d = Math.hypot(dLat, dLng);
    if (d < bestD){ bestD = d; best = id; }
  };
  const f = at(T, simMin);
  consider(FOCAL, f.lat, wrapLng(f.lng));
  if (showOthers && T.others){
    for (const o of T.others){
      const h = otherAt(o, simMin);
      if (h) consider(o.id, h.lat, wrapLng(h.lng));
    }
  }
  return bestD <= tol ? best : null;
}

function setFollow(id){
  followId = id;
  if (id) camReady = false;          /* land on it rather than drifting over */
  const b = document.getElementById("refollow");
  if (b) b.setAttribute("aria-pressed", String(!!id));
}

const $ = id => document.getElementById(id);

/* ------------------------------------------------------------------- data */

async function loadTracks(){
  const res = await fetch("data/processed/globe-tracks.json");
  if (!res.ok) throw new Error(`globe-tracks.json: ${res.status}`);
  return (await res.json()).tracks;
}

/* Where the bird was at minute `m`. Between two fixes this interpolates
   linearly in lat and in unwrapped lon, which over a two-hour godwit step is
   a few kilometres from the great circle and invisible at globe scale. */
function at(t, m){
  const mins = t.min, n = mins.length;
  if (m <= mins[0]) return {lat:t.lat[0], lng:t.lon[0], km:t.cum[0], i:0, f:0};
  if (m >= mins[n-1]) return {lat:t.lat[n-1], lng:t.lon[n-1], km:t.cum[n-1], i:n-1, f:0};
  let lo = 0, hi = n - 1;
  while (lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if (mins[mid] <= m) lo = mid; else hi = mid - 1;
  }
  const span = mins[lo+1] - mins[lo];
  const f = span > 0 ? (m - mins[lo]) / span : 0;
  return {
    lat: t.lat[lo] + (t.lat[lo+1] - t.lat[lo]) * f,
    lng: t.lon[lo] + (t.lon[lo+1] - t.lon[lo]) * f,
    km:  t.cum[lo] + (t.cum[lo+1] - t.cum[lo]) * f,
    i: lo, f,
  };
}

/* Ground speed over the fix interval the bird is currently inside: the honest
   number, since between two fixes nothing is known. */
function speedAt(t, m){
  const p = at(t, m), i = p.i;
  if (i >= t.min.length - 1) return 0;
  const dt = (t.min[i+1] - t.min[i]) / 60;
  return dt > 0 ? (t.cum[i+1] - t.cum[i]) / dt : 0;
}

const wrapLng = d => ((d + 180) % 360 + 360) % 360 - 180;

/* Where an egg sits inside the breeding area.

   The cited figure is two corner coordinates, 31 N 50 W and 24 N 70 W, and the
   first version scattered eggs uniformly through the box they describe. That
   drew a rectangle, and a rectangle is a claim: it says the area has straight
   edges and square corners running true north and true east, which no survey
   has ever found. What the surveys describe is a long narrow band lying along
   the subtropical convergence front. So the corners are read as the ends of
   that band's axis, and (jx, jy) -- a point in the unit disc -- places the egg
   in an ellipse around it. */
function spawnAt(jx, jy){
  const s = E.spawnArea;
  return [s.lat + jx * s.major[0] + jy * s.minor[0],
          s.lon + jx * s.major[1] + jy * s.minor[1]];
}

/* Great-circle kilometres, for the bridging test below. */
function kmBetween(la1, lo1, la2, lo2){
  const R = 6371, r = Math.PI / 180;
  const dp = (la2 - la1) * r, dl = (lo2 - lo1) * r;
  const s = Math.sin(dp/2) ** 2
          + Math.cos(la1*r) * Math.cos(la2*r) * Math.sin(dl/2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}

/* Whether the silence between fix j and fix j+1 may be drawn across.
   Precomputed once per track rather than per frame: `seg[i]` is the index of
   the first fix in the unbroken run that fix i belongs to, so walking a
   companion's drawable history back to its start is a lookup, not a scan. */
function prepareOthers(t){
  if (!t.others || t.others[0]._seg) return;
  for (const o of t.others){
    const n = o.min.length, seg = new Int32Array(n);
    seg[0] = 0;
    for (let j = 1; j < n; j++){
      const h = (o.min[j] - o.min[j-1]) / 60;
      const ok = h <= BRIDGE_H
              || (h <= STILL_H
                  && kmBetween(o.lat[j-1], o.lon[j-1], o.lat[j], o.lon[j]) / h
                     < STILL_KMH);
      seg[j] = ok ? seg[j-1] : j;
    }
    o._seg = seg;
  }
}

/* Where a companion was at minute `m`, or null if its tag was not reporting
   near then. Inside a silence too long or too fast to bridge the bird is
   simply not drawn -- better than sliding it along a straight line through a
   gap it never flew. */
function otherAt(o, m){
  const mins = o.min, n = mins.length;
  const tol = T.othersTolMin || (T.othersStepMin || 20) * 3;
  if (m < mins[0] - tol || m > mins[n-1] + tol) return null;
  let lo = 0, hi = n - 1;
  while (lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if (mins[mid] <= m) lo = mid; else hi = mid - 1;
  }
  if (lo === n - 1) return Math.abs(m - mins[lo]) <= tol
    ? {lat:o.lat[lo], lng:o.lon[lo], i:lo} : null;
  if (o._seg[lo+1] !== o._seg[lo]) return null;   /* a silence, not a flight */
  const gap = mins[lo+1] - mins[lo];
  const f = gap > 0 ? (m - mins[lo]) / gap : 0;
  return {
    lat: o.lat[lo] + (o.lat[lo+1] - o.lat[lo]) * f,
    lng: o.lon[lo] + (o.lon[lo+1] - o.lon[lo]) * f,
    i: lo,
  };
}

/* A companion's track so far: back to the start of the run it is currently
   in, decimated, ending exactly under its dot. Breaking at the run's start
   rather than at a fixed age is what keeps this honest -- the line covers
   only what the tag actually reported, and a bird that vanished for a week
   over the Sahara reappears as a new line rather than a chord across it. */
function otherTrail(o, m, here){
  const from = o._seg[here.i];
  const n = here.i - from + 1;
  const stride = Math.max(1, Math.ceil(n / OTHERS_MAX));
  const pts = [];
  for (let j = from; j <= here.i; j += stride) pts.push([o.lat[j], o.lon[j]]);
  pts.push([here.lat, here.lng]);
  return pts;
}

/* ------------------------------------------------------------ trail points

   Rebuilding a 6,000-point line every frame is what would make this stutter,
   so the trail is decimated to at most TRAIL_MAX points and rebuilt on a
   timer rather than per frame. The marker still moves every frame at full
   resolution, which is the part the eye actually tracks. */
const TRAIL_MAX = 900;
const TRAIL_MS = 90;
let lastTrail = -1e9, trailKey = "";

function trailUpTo(t, m){
  const p = at(t, m);
  const n = p.i + 1;
  const stride = Math.max(1, Math.ceil(n / TRAIL_MAX));
  const pts = [];
  for (let j = 0; j <= p.i; j += stride) pts.push([t.lat[j], t.lon[j]]);
  pts.push([p.lat, p.lng]);              /* always end exactly at the bird */
  return pts;
}

/* The followed bird's colour: its colony where the deposit records one, the
   species colour otherwise. */
function focalColour(){
  return T && T.colourBy === "population" && T.population
    ? popColour(T.population) : SPECIES_COLOUR[key];
}

/* A companion's, dimmed. Storks keep their colony colour so the fan reads as
   geography; everyone else is uniform pale, because there is nothing to tell
   apart. The line fades into the dark at its far end, the same trick the
   followed bird's trail uses, so a full history stays a history and the eye
   still lands on where each bird is now. */
function otherColour(o){
  if (T.colourBy !== "population") return OTHERS_DIM;
  const c = popColour(o.pop);
  return `rgba(${parseInt(c.slice(1,3),16)},${parseInt(c.slice(3,5),16)},`
       + `${parseInt(c.slice(5,7),16)},0.5)`;
}

/* One layer carries both, so the followed bird is always drawn last and sits
   over the company rather than under it. It also gets a dark casing beneath
   it -- the cartographer's trick for a route line crossing a busy map. Thirty
   stork tracks converging on the Nile is exactly that: without the casing the
   followed bird disappears into its own flock the moment the flock is worth
   looking at. */
const TRAIL_CASE = "rgba(3,8,16,0.8)";
function pathsAt(m){
  const col = focalColour();
  const paths = [];
  if (showOthers && T.others){
    for (const o of T.others){
      const here = otherAt(o, m);
      if (!here) continue;
      const pts = otherTrail(o, m, here);
      const oc = otherColour(o);
      if (pts.length > 1)
        paths.push({pts, cols:[OTHERS_FADE, oc], w:1.2, id:o.id});
    }
  }
  const trail = trailUpTo(T, m);
  paths.push({pts: trail, cols:[TRAIL_CASE, TRAIL_CASE], w:5.4});
  paths.push({pts: trail, cols:[TRAIL_COLD, col], w:2.4});
  return paths;
}

/* --------------------------------------------------------------- rendering */

/* Seconds for the camera to close most of the gap to the bird. Easing by a
   fixed fraction per frame instead would make the lag depend on the frame
   rate: the same page would hold the bird centred on a fast machine and let it
   trail by hundreds of kilometres on a slow one. */
const CAM_TAU = 0.22;

function paint(force, dt){
  if (MODE === "swarm") return paintSwarm(force, dt);
  const p = at(T, simMin);

  /* Camera: ease toward the bird so a jumpy fix does not jolt the globe.

     Altitude is eased here too rather than handed to globe.gl's own tween,
     because this runs every frame with a zero-length transition and would
     cancel that tween on its first step. Which leaves one thing to be careful
     about: if the viewer pinches or scrolls, the altitude coming back is
     theirs, not ours, so it becomes the new target instead of being fought. */
  const pov = globe.pointOfView();
  if (lastSetAlt >= 0 && Math.abs(pov.altitude - lastSetAlt) > 1e-4){
    targetAlt = pov.altitude;
    camAlt = pov.altitude;
  }
  /* Nobody followed, a hand currently on the globe, or the followed bird not
     reporting just now: the camera is left exactly where the viewer put it.
     Calling pointOfView here is what would fight the drag -- and did: the
     first version snapped back every frame, so by pointer-up the globe had
     not moved at all and a rotate was indistinguishable from a tap. */
  const tgt = grabbing ? null : followTarget();
  if (tgt){
    const k = camReady ? 1 - Math.exp(-Math.max(0, dt || 0) / CAM_TAU) : 1;
    camLat += (tgt.lat - camLat) * k;
    camLng += (tgt.lng - camLng) * k;
    camAlt += (targetAlt - camAlt) * k;
    camReady = true;
    lastSetAlt = camAlt;
    globe.pointOfView({lat: camLat, lng: wrapLng(camLng), altitude: camAlt}, 0);
  } else {
    camLat = pov.lat; camLng = pov.lng; camAlt = pov.altitude;
    lastSetAlt = camAlt;
  }

  const now = performance.now();
  const stamp = key + "|" + T.min.length + "|" + showOthers;
  if (force || stamp !== trailKey || now - lastTrail > TRAIL_MS){
    lastTrail = now; trailKey = stamp;
    globe.pathsData(pathsAt(simMin));
  }

  /* The albatross ends two kilometres from where it started, so a separate
     start and end pin would be one muddled blob on top of the colony. When
     the journey is a round trip, say so with a single marker. */
  const n = T.lat.length - 1;
  const marks = T.returnKm < 50
    ? [{lat:T.lat[0], lng:T.lon[0], c:"#7ee08a", r:0.5, alt:0.012}]
    : [{lat:T.lat[0], lng:T.lon[0], c:"#7ee08a", r:0.45, alt:0.012},
       {lat:T.lat[n], lng:T.lon[n], c:"#ff6b6b", r:0.45, alt:0.012}];
  if (showOthers && T.others){
    for (const o of T.others){
      const here = otherAt(o, simMin);
      if (here) marks.push({lat:here.lat, lng:here.lng,
                            c: T.colourBy === "population"
                               ? popColour(o.pop) : OTHERS_DOT,
                            r:0.22, alt:0.015, id:o.id});
    }
  }
  marks.push({lat:p.lat, lng:p.lng, c:"#ffffff", r:0.42, alt:0.022, id:FOCAL});
  globe.pointsData(marks);

  updateReadout(p);
}

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function updateReadout(p){
  const d = new Date(Date.parse(T.start) + simMin * 60000);
  const day = Math.floor(simMin / 1440) + 1;
  const hh = String(d.getUTCHours()).padStart(2, "0");
  const mm = String(d.getUTCMinutes()).padStart(2, "0");
  $("when").textContent =
    `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}  ${hh}:${mm}`;
  $("dist").textContent = `${Math.round(p.km).toLocaleString("en-GB")} km`;
  $("speed").textContent = `${Math.round(speedAt(T, simMin))} km/h`;
  $("lat").textContent = fmtDeg(p.lat, "NS");
  $("lon").textContent = fmtDeg(wrapLng(p.lng), "EW");
  /* How many of the deposit's other birds were reporting at this instant --
     it drops to nothing for stretches, and that absence is the data. */
  const seen = (showOthers && T.others)
    ? T.others.reduce((n, o) => n + (otherAt(o, simMin) ? 1 : 0), 0) : 0;
  $("nother").textContent = showOthers
    ? `${seen} of ${T.others ? T.others.length : 0}` : "off";
  $("follow").textContent = followLabel();
  /* Without this the stork's four months read as a stalled animation rather
     than a long one. */
  $("day").textContent = `${day} of ${Math.ceil(T.hours / 24)}`;
  const s = $("scrub");
  if (document.activeElement !== s) s.value = String(Math.round(simMin / T.min[T.min.length-1] * 1000));
  $("when").title = `day ${day} of ${Math.ceil(T.hours/24)}`;
}

function fmtDeg(v, axis){
  const h = v >= 0 ? axis[0] : axis[1];
  return `${Math.abs(v).toFixed(2)}° ${h}`;
}

/* =========================================================== the eel view

   Everything above this line draws recorded positions. Nothing below it does,
   and that difference is the reason this section is long.

   There is no eel track to draw. No eel has been followed through a life that
   lasts fifteen years and crosses the Atlantic twice; a pop-up satellite tag
   runs for about a year and is far too big for anything smaller than a
   full-grown silver eel. No eel egg and no spawning adult has ever been
   lifted out of the Sargasso Sea, a century after Schmidt named it as the
   breeding place. The larval drift has never been watched at all.

   So this is a diagram that moves. The corridor follows the real current
   system, the rivers are real rivers, the calendar and the speeds and the
   depths are measured and cited -- but every dot is a particle, not an
   animal, and the page says so in the picker, in the badge, in the read-out
   and in the notes. scripts/build_eels.py keeps the two kinds of number
   apart at the source. */

let E = null;                /* the eel payload */
let eelT = 0;                /* months since the cohort hatched */
let eelDensity = 1;          /* 1 = the 1960s swarm, or the ICES index today */
const EEL_ALT = 0.006;

const STAGE = {
  egg:    {label: "egg",           c: "#8ea8c8"},
  lepto:  {label: "leptocephalus", c: "#7fe3ff"},
  glass:  {label: "glass eel",     c: "#eaf4ff"},
  elver:  {label: "elver",         c: "#ffb454"},
  yellow: {label: "yellow eel",    c: "#ffd166"},
  silver: {label: "silver eel",    c: "#dfe9f7"},
};
const STAGE_ORDER = ["egg", "lepto", "glass", "elver", "yellow", "silver"];
const FATE_COLOUR = ["", "#ff5470", "#ff8a3d", "#6b7a93"];

/* How wide the swarm spreads, in degrees, at each point of the life. Wide in
   mid-ocean because the drift genuinely disperses; tight at an estuary mouth
   because a catchment is a funnel. */
const SPREAD_SEA = 3.4, SPREAD_RIVER = 0.16, SPREAD_BACK = 2.6;

async function loadEels(){
  const res = await fetch("data/processed/eel-migration.json");
  if (!res.ok) throw new Error(`eel-migration.json: ${res.status}`);
  const e = await res.json();
  /* Stitch each region's outbound and homebound polylines once, so walking
     them per frame is a lookup rather than a concatenation. */
  for (const r of e.regions){
    r._out = e.routes[r.trunk].concat(r.approach.slice(1));
    r._home = r.back.concat(e.routes.back.slice(1));
  }
  let acc = 0;
  for (const p of e.phases){ p.t0 = acc; acc += p.seconds; p.t1 = acc; }
  e.totalSeconds = acc;
  e.totalMonths = e.phases[e.phases.length - 1].m1;
  return e;
}

/* Life-months and screen-seconds are not proportional and cannot be: six
   thousand days in a river would be most of the animation if they were. Each
   phase declares its own exchange rate, the read-out states it, and these two
   functions convert between the clocks. */
function eelSecondsOf(months){
  const ph = E.phases;
  if (months <= ph[0].m0) return 0;
  for (const p of ph){
    if (months <= p.m1)
      return p.t0 + (months - p.m0) / (p.m1 - p.m0) * p.seconds;
  }
  return E.totalSeconds;
}
function eelMonthsOf(seconds){
  const ph = E.phases;
  for (const p of ph){
    if (seconds <= p.t1)
      return p.m0 + (seconds - p.t0) / p.seconds * (p.m1 - p.m0);
  }
  return E.totalMonths;
}
function eelPhase(months){
  const ph = E.phases;
  for (const p of ph) if (months <= p.m1) return p;
  return ph[ph.length - 1];
}
/* Months of real time per second of watching, right now. */
function eelRate(months){
  const p = eelPhase(months);
  return (p.m1 - p.m0) / p.seconds;
}

/* Bring a longitude into the same turn as the one the camera is already on,
   so easing across the antimeridian takes the short way round. */
function wrapNear(lng, ref){
  let d = lng - ref;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  return ref + d;
}

function along(path, u){
  const n = path.length;
  const x = Math.min(n - 1, Math.max(0, u * (n - 1)));
  const i = Math.floor(x), f = x - i;
  if (i >= n - 1) return path[n - 1];
  const a = path[i], b = path[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
}

/* Where one particle is at month `t`, and what it is by then.

   Returns null once it is gone for good; for a short window after it is
   removed it returns `end`, so the renderer can show the removal happening
   rather than having dots blink out of existence unaccountably. */
const GONE_FLASH = 0.5;        /* months a removal stays visible */

function eelAt(p, t){
  const [ri, hatch, drift, linger, ascent, growth, descent, ret,
         up, fate, jx, jy, sd] = p;
  const R = E.regions[ri];
  const tA = hatch + drift;              /* reaches the continental shelf */
  const tL = tA + linger;                /* leaves the estuary            */
  const tR = tL + ascent;                /* settles in the catchment      */
  const tE = tR + growth;                /* silvers, and goes             */
  const tM = tE + descent;               /* back at the mouth             */
  const tS = tM + ret;                   /* reaches the breeding area     */

  /* The three ways a drawn eel stops. Where each happens is real -- the
     fishery is in the Biscay and Iberian estuaries, the turbines are on the
     way back down, attrition happens across the growth years. How many is
     not a rate and is never presented as one. */
  let cut = -1, cutStage = "";
  if (fate === 1){ cut = tA + linger * 0.55; cutStage = "glass"; }
  else if (fate === 2){ cut = tE + descent * 0.45; cutStage = "silver"; }
  else if (fate === 3){ cut = tR + growth * (0.2 + 0.55 * sd); cutStage = "yellow"; }

  const gone = cut > 0 && t >= cut;
  const tt = gone ? cut : t;
  let lat, lng, stage;

  if (tt < hatch){
    const s = spawnAt(jx, jy);
    lat = s[0]; lng = s[1];
    stage = "egg";
  } else if (tt < tA){
    const u = (tt - hatch) / drift;
    const q = along(R._out, u);
    const amp = SPREAD_SEA * (0.22 + 0.78 * Math.sin(Math.PI * u));
    lat = q[0] + jx * amp; lng = q[1] + jy * amp * 1.5;
    /* Ease off the spawning scatter onto the corridor rather than snapping. */
    if (u < 0.08){
      const s = spawnAt(jx, jy), f = u / 0.08;
      lat = s[0] + (lat - s[0]) * f; lng = s[1] + (lng - s[1]) * f;
    }
    stage = "lepto";
  } else if (tt < tL){
    const w = 0.55 + 0.45 * Math.sin((tt - tA) / Math.max(0.2, linger) * 6.3 + sd * 6.3);
    lat = R.mouth[0] + jx * 0.42 * w; lng = R.mouth[1] + jy * 0.55 * w;
    stage = "glass";
  } else if (tt < tR){
    const u = (tt - tL) / ascent;
    const q = along(R.river, u * up);
    lat = q[0] + jx * SPREAD_RIVER; lng = q[1] + jy * SPREAD_RIVER * 1.4;
    stage = "elver";
  } else if (tt < tE){
    const q = along(R.river, up);
    const w = Math.sin((tt - tR) * 0.35 + sd * 6.3);
    lat = q[0] + jx * SPREAD_RIVER + w * 0.03;
    lng = q[1] + jy * SPREAD_RIVER * 1.4 + w * 0.04;
    stage = "yellow";
  } else if (tt < tM){
    const u = (tt - tE) / descent;
    const q = along(R.river, up * (1 - u));
    lat = q[0] + jx * SPREAD_RIVER; lng = q[1] + jy * SPREAD_RIVER * 1.4;
    stage = "silver";
  } else if (tt < tS){
    const u = (tt - tM) / ret;
    const q = along(R._home, u);
    const amp = SPREAD_BACK * Math.sin(Math.PI * u);
    lat = q[0] + jx * amp; lng = q[1] + jy * amp * 1.5;
    stage = "silver";
  } else {
    return null;                          /* spawned, and dead: eels do both once */
  }

  if (gone){
    if (t > cut + GONE_FLASH) return null;
    return {lat, lng, stage: cutStage, end: (t - cut) / GONE_FLASH, fate};
  }
  return {lat, lng, stage, end: 0, fate: 0};
}

/* ------------------------------------------------------------ swarm canvas

   The dots are drawn on a 2-D canvas over the globe rather than as globe.gl
   points: nine hundred cylinders would be nine hundred meshes rebuilt every
   frame, and this way the trails, the fading removals and the far-side
   culling are all a few lines of arithmetic. */

let swarmCv = null, swarmCtx = null, swarmDpr = 1;

/* Everything stacked above the control bar is positioned off its real height
   rather than a guess, because it wraps to two rows below 520px and the
   read-out had been sitting under it by 25 pixels on a 390px phone. */
function measureChrome(){
  const h = id => {
    const e = $(id);
    if (!e || getComputedStyle(e).display === "none") return 0;
    return e.getBoundingClientRect().height;
  };
  const ctrl = h("controls"), ro = h("readout");
  const pick = h("birdRow"), stg = h("stages"), chap = h("chapter");
  const s = document.documentElement.style;
  s.setProperty("--ctrl-h", Math.round(ctrl) + "px");
  s.setProperty("--ro-h", Math.round(ro) + "px");
  s.setProperty("--pick-h", Math.round(pick) + "px");
  s.setProperty("--chap-h", Math.round(chap) + "px");
  s.setProperty("--stack", Math.round(ctrl + ro + stg + chap + 54) + "px");
}

function sizeSwarm(){
  const cv = $("swarm");
  swarmDpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * swarmDpr);
  cv.height = Math.round(innerHeight * swarmDpr);
  cv.style.width = innerWidth + "px";
  cv.style.height = innerHeight + "px";
  swarmCv = cv; swarmCtx = cv.getContext("2d");
}

const DEG = Math.PI / 180;

/* A point on the sphere is in view when it lies inside the cap the camera can
   actually see, whose half-angle is acos(R/(R+h)). Without this the swarm
   shows through the planet, which reads as a bug and destroys the illusion of
   a sphere. */
function frontFacing(lat, lng, cam, cosLim){
  const a = lat * DEG, b = lng * DEG, c = cam.lat * DEG, d = cam.lng * DEG;
  return Math.sin(a) * Math.sin(c)
       + Math.cos(a) * Math.cos(c) * Math.cos(b - d) > cosLim;
}

const TRAIL_STEPS = 3;

function drawSwarm(){
  if (!swarmCtx) return;
  const cv = swarmCv, ctx = swarmCtx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.scale(swarmDpr, swarmDpr);

  const cam = globe.pointOfView();
  const cosLim = 1 / (1 + cam.altitude);
  /* Dots shrink as you stand back, so the swarm keeps roughly the same
     visual density whether you are looking at the whole Atlantic or at one
     estuary. */
  const r = Math.max(0.9, Math.min(2.6, 2.35 / (0.55 + cam.altitude)));
  const step = eelRate(eelT) * 0.5;      /* trail spacing, in months */

  const n = Math.max(1, Math.round(E.particles.length * eelDensity));
  let shown = 0, byStage = {};
  ctx.lineCap = "round";

  drawBreedingArea(ctx, cam, cosLim);

  for (let i = 0; i < n; i++){
    const p = E.particles[i];
    const now = eelAt(p, eelT);
    if (!now) continue;
    if (!frontFacing(now.lat, now.lng, cam, cosLim)) continue;
    const s = globe.getScreenCoords(now.lat, now.lng, EEL_ALT);
    if (!s || !isFinite(s.x)) continue;
    shown++;
    byStage[now.stage] = (byStage[now.stage] || 0) + 1;

    if (now.end > 0){
      /* A removal: a short bright flare that fades, in the colour of what
         removed it. */
      const a = 1 - now.end;
      ctx.beginPath();
      ctx.arc(s.x, s.y, r * (1.4 + 2.6 * now.end), 0, 6.2832);
      ctx.fillStyle = FATE_COLOUR[now.fate];
      ctx.globalAlpha = a * 0.55;
      ctx.fill();
      ctx.globalAlpha = 1;
      continue;
    }

    const col = STAGE[now.stage].c;
    /* The trail is recomputed from the clock rather than remembered, so it
       stays correct when the scrubber jumps and when the globe is turned. */
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    let ok = true;
    for (let k = 1; k <= TRAIL_STEPS && ok; k++){
      const b = eelAt(p, eelT - step * k);
      if (!b || b.end > 0 || !frontFacing(b.lat, b.lng, cam, cosLim)){ ok = false; break; }
      const q = globe.getScreenCoords(b.lat, b.lng, EEL_ALT);
      if (!q || !isFinite(q.x)){ ok = false; break; }
      ctx.lineTo(q.x, q.y);
    }
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.34;
    ctx.lineWidth = r * 0.85;
    ctx.stroke();

    ctx.globalAlpha = 0.92;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, 6.2832);
    ctx.fillStyle = col;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  return {shown, byStage};
}

/* The breeding area, drawn as the ellipse it is.

   Worth drawing at all because the eggs alone read as a smudge, and worth
   drawing as an ellipse because the shape is the honest part: the cited
   figure is two corner coordinates, and a rectangle between them would assert
   straight edges and square corners that no survey has found. Dashed, because
   the edge is a sampling boundary rather than a fence -- what is known is
   where the smallest larvae have been caught, not where the eels stop. */
function drawBreedingArea(ctx, cam, cosLim){
  const ph = lastPhaseKey;
  if (ph !== "spawn" && ph !== "drift") return;
  const s = E.spawnArea;
  const pts = [];
  for (let i = 0; i <= 72; i++){
    const t = i / 72 * 6.2832;
    const c = Math.cos(t), q = Math.sin(t);
    const la = s.lat + c * s.major[0] + q * s.minor[0];
    const lo = s.lon + c * s.major[1] + q * s.minor[1];
    if (!frontFacing(la, lo, cam, cosLim)){ pts.push(null); continue; }
    const p = globe.getScreenCoords(la, lo, EEL_ALT);
    pts.push(p && isFinite(p.x) ? p : null);
  }
  ctx.save();
  ctx.setLineDash([5, 6]);
  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(255,209,102,0.5)";
  ctx.beginPath();
  let pen = false;
  for (const p of pts){
    if (!p){ pen = false; continue; }
    if (pen) ctx.lineTo(p.x, p.y); else { ctx.moveTo(p.x, p.y); pen = true; }
  }
  ctx.stroke();
  ctx.restore();
}

/* ---------------------------------------------------------- chapter + key */

let lastPhaseKey = "";

function syncChapter(force){
  const ph = eelPhase(eelT);
  if (!force && ph.key === lastPhaseKey) return;
  lastPhaseKey = ph.key;
  const i = E.phases.indexOf(ph) + 1;
  $("chapter").innerHTML =
    `<button class="hd" aria-expanded="${document.body.dataset.chapter === "open"}"`
    + ` aria-controls="chbody">`
    + `<span class="ph">chapter ${i} of ${E.phases.length}`
    + `<span class="car" aria-hidden="true">&#9662;</span></span>`
    + `<span class="ttl">${ph.title}</span>`
    + `<span class="lead">${ph.lead}</span></button>`
    + `<div class="body" id="chbody">`
    + ph.body.map(t => `<p>${t}</p>`).join("") + `</div>`;
  $("chapter").querySelector(".hd").addEventListener("click", toggleChapter);
  const b = $("chapter").querySelector(".body");
  if (b) b.scrollTop = 0;
  requestAnimationFrame(measureChrome);
  syncCallouts();
}

function toggleChapter(){
  const open = document.body.dataset.chapter !== "open";
  document.body.dataset.chapter = open ? "open" : "shut";
  const hd = $("chapter").querySelector(".hd");
  if (hd) hd.setAttribute("aria-expanded", String(open));
  requestAnimationFrame(measureChrome);
}

function buildStageKey(){
  $("stages").innerHTML = STAGE_ORDER.map(k =>
    `<div data-k="${k}"><i style="color:${STAGE[k].c}"></i>`
    + `<span>${STAGE[k].label}</span><b data-n="${k}">&mdash;</b></div>`).join("");
}

function syncStageKey(byStage){
  for (const k of STAGE_ORDER){
    const row = $("stages").querySelector(`div[data-k="${k}"]`);
    const n = (byStage && byStage[k]) || 0;
    row.dataset.on = String(n > 0);
    row.querySelector("b").textContent = n ? String(n) : "—";
  }
}

/* Place labels, pinned to the sphere and shown only while their chapter is
   running and their place is facing the camera. */
function buildCallouts(){
  $("callouts").innerHTML = E.callouts.map((c, i) =>
    `<div class="co" data-i="${i}"><b>${c.title}</b><span>${c.text}</span></div>`).join("");
}

function syncCallouts(){
  const cam = globe.pointOfView();
  const cosLim = 1 / (1 + cam.altitude);
  const ph = lastPhaseKey;
  const els = $("callouts").children;
  for (let i = 0; i < E.callouts.length; i++){
    const c = E.callouts[i], el = els[i];
    const on = c.phase === ph && frontFacing(c.lat, c.lng, cam, cosLim);
    if (on){
      const s = globe.getScreenCoords(c.lat, c.lng, EEL_ALT);
      if (s && isFinite(s.x)){ el.style.left = s.x + "px"; el.style.top = s.y + "px"; }
    }
    el.dataset.on = String(on);
  }
}

/* ------------------------------------------------------------- eel paint */

/* Where the swarm is, and how much of the globe it covers.

   The first version parked the camera at a viewpoint written into each
   chapter. That is a set of stage directions that have to be kept in step with
   the particles by hand, and they drifted apart the moment the chapter
   boundaries were rederived. The camera now reads the swarm instead: it points
   at the mean of every drawn eel and stands back far enough to hold the whole
   spread.

   The mean is taken over unit vectors, not over latitude and longitude. An
   average of degrees puts the centre of a swarm straddling the antimeridian in
   the middle of Asia; an average of vectors does not, and it also weights the
   poles correctly. */
const CAM_FILL = 0.55;      /* of the visible cap the swarm should occupy */
function swarmView(){
  const n = Math.max(1, Math.round(E.particles.length * eelDensity));
  let x = 0, y = 0, z = 0, m = 0;
  const held = [];
  for (let i = 0; i < n; i++){
    const p = eelAt(E.particles[i], eelT);
    if (!p || p.end > 0) continue;
    const a = p.lat * DEG, b = p.lng * DEG, c = Math.cos(a);
    x += c * Math.cos(b); y += c * Math.sin(b); z += Math.sin(a);
    held.push(p); m++;
  }
  if (!m) return null;
  const r = Math.hypot(x, y, z) || 1e-9;
  x /= r; y /= r; z /= r;
  const lat = Math.asin(z) / DEG, lng = Math.atan2(y, x) / DEG;
  /* How far the swarm reaches from that centre, as an angle. The 90th
     percentile rather than the maximum: one straggler still crossing the
     Atlantic should not pull the camera back off the whole of Europe. */
  const ang = [];
  for (const p of held){
    const a = p.lat * DEG, b = p.lng * DEG;
    ang.push(Math.acos(Math.max(-1, Math.min(1,
      Math.sin(a) * z + Math.cos(a) * (Math.cos(b) * x + Math.sin(b) * y)))));
  }
  ang.sort((u, v) => u - v);
  const spread = ang[Math.min(ang.length - 1, Math.floor(0.9 * ang.length))];
  /* Altitude whose visible cap is the spread divided by how much of the frame
     the swarm should fill. cos(theta) = R/(R+h), so h = 1/cos(theta) - 1. */
  const want = Math.min(1.32, Math.max(0.06, spread / CAM_FILL));
  let alt = 1 / Math.cos(want) - 1;
  /* Never so close that the sphere stops reading as one -- which is the whole
     argument for this page being a globe. */
  /* A tall viewport shows less of the sphere across its width, so stand back
     -- the same correction the bird views make. */
  const aspect = innerHeight / Math.max(1, innerWidth);
  if (aspect > 1) alt *= 1 + 0.45 * Math.min(aspect - 1, 1.4);
  return {lat, lng, alt: Math.max(0.9, Math.min(2.4, alt))};
}

function paintSwarm(force, dt){
  /* The camera is the animation's, not the viewer's: it holds the swarm and
     the viewer cannot turn it away. On the bird views a drag hands the camera
     over because there is a specific animal to hand it to; here there is no
     individual, dragging away from the swarm shows an empty ocean, and half
     the point of the view is watching the corridor sweep past. So the orbit
     controls are switched off in this mode and switched back on when leaving. */
  const v = swarmView();
  if (v){
    const k = camReady ? 1 - Math.exp(-Math.max(0, dt || 0) / CAM_TAU) : 1;
    camLat += (v.lat - camLat) * k;
    camLng += (wrapNear(v.lng, camLng) - camLng) * k;
    camAlt += (v.alt - camAlt) * k;
    camReady = true; lastSetAlt = camAlt;
    globe.pointOfView({lat: camLat, lng: wrapLng(camLng), altitude: camAlt}, 0);
  }

  syncChapter(force);
  const stat = drawSwarm();
  syncStageKey(stat && stat.byStage);
  syncCallouts();
  updateEelReadout(stat);
}

const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun",
                      "Jul","Aug","Sep","Oct","Nov","Dec"];

/* The read-out's rows mean different things in the two modes, so they are
   labelled for the mode rather than left saying "flown" over a number of
   years. */
const LABELS = {
  track: {dist:"flown", speed:"speed", lat:"lat", lon:"lon",
          nother:"others", day:"day", follow:"following"},
  swarm: {dist:"age", speed:"clock", lat:"now", lon:"swarm",
          nother:"drawn", day:"chapter", follow:"kind"},
};
function syncLabels(){
  const L = LABELS[MODE];
  for (const k in L) $("l-" + k).textContent = L[k];
}

function updateEelReadout(stat){
  /* Month zero is the peak of spawning, mid-February, which is the one date
     in this life cycle that larval surveys actually pin down. */
  const m = eelT;
  const monthIdx = Math.floor(((SPAWN_PEAK - 1) + m) % 12);
  const yrs = Math.floor(m / 12), rem = Math.floor(m % 12);
  $("when").textContent = yrs
    ? `year ${yrs + 1}, ${MONTHS_SHORT[monthIdx]}`
    : `${MONTHS_SHORT[monthIdx]}, first year`;
  $("when").title = `${m.toFixed(1)} months after hatching`;
  const rate = eelRate(eelT) * speedMult;
  $("dist").textContent = `${(m / 12).toFixed(1)} yr`;
  $("speed").textContent = rate > 11
    ? `${(rate / 12).toFixed(1)} yr/s` : `${rate.toFixed(1)} mo/s`;
  /* The chapter titles are sentences -- one of them is nine words -- so the
     read-out carries a short tag instead. */
  $("lat").textContent = eelPhase(eelT).tag;
  $("lon").textContent = eelDensity < 1 ? "today" : "1960s";
  $("nother").textContent = stat ? `${stat.shown} of ${E.particles.length}` : "—";
  $("day").textContent = `${E.phases.indexOf(eelPhase(eelT)) + 1} of ${E.phases.length}`;
  $("follow").textContent = "schematic";
  $("dist").title = `${eelT.toFixed(1)} months after hatching`;
  $("speed").title = "how much of the eel's own time one second of watching "
                   + "is worth in this chapter";
  const s = $("scrub");
  if (document.activeElement !== s)
    s.value = String(Math.round(eelSecondsOf(eelT) / E.totalSeconds * 1000));
}

const SPAWN_PEAK = 2;         /* February  [Righton et al. 2016] */

/* ------------------------------------------------------------------ frames */

let last = performance.now();
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (playing){
    if (MODE === "swarm"){
      /* The eel clock runs in life-months and its exchange rate changes with
         the chapter, so it is advanced through the phase map rather than at a
         single rate. */
      eelT = eelMonthsOf(eelSecondsOf(eelT) + dt * speedMult);
      if (eelT >= E.totalMonths){ eelT = E.totalMonths; playing = false; syncPlay(); }
    } else {
      simMin += dt * baseSpeed() * speedMult * 60;
      const end = T.min[T.min.length - 1];
      if (simMin >= end){ simMin = end; playing = false; syncPlay(); }
    }
  }
  paint(false, dt);
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ chrome */

/* The buttons are relative, so say what each one means in seconds for the
   journey currently loaded. */
function syncSpeedTitles(){
  for (const b of document.querySelectorAll("#speeds button")){
    const v = Number(b.dataset.v);
    if (MODE === "swarm"){
      b.title = `the whole ${(E.totalMonths / 12).toFixed(0)}-year life cycle in `
              + `about ${Math.round(E.totalSeconds / v)} seconds`;
    } else {
      const total = T ? T.min[T.min.length - 1] : 0;
      b.title = `the whole ${(total / 1440).toFixed(0)}-day journey in about `
              + `${Math.round(RUN_SECONDS / v)} seconds`;
    }
  }
}

function syncPlay(){
  const b = $("play");
  b.textContent = playing ? "Pause" : "Play";
  b.setAttribute("aria-pressed", String(playing));
}

function setSpecies(k, initial){
  key = k;
  MODE = mode(k);
  camReady = false;
  playing = true;
  for (const b of document.querySelectorAll("#birdRow button"))
    b.setAttribute("aria-pressed", String(b.dataset.key === k));
  document.body.dataset.mode = MODE;
  syncLabels();

  /* The eel camera is the animation's and the viewer cannot turn it away, so
     the orbit controls are switched off rather than merely overridden. Leaving
     them on and snapping the camera back every frame is the shape of a bug
     already fixed once on this page: OrbitControls keeps its own damped state,
     so it spends every frame pulling one way while paint pulls the other. */
  globe.controls().enabled = MODE !== "swarm";
  if (MODE === "swarm"){ setEelView(initial); return; }

  T = TRACKS[k];
  prepareOthers(T);
  simMin = 0;

  globe.pathColor(d => d.cols);
  /* Leaving the eel view: clear its overlay and the bird layers it emptied. */
  if (swarmCtx) swarmCtx.clearRect(0, 0, swarmCv.width, swarmCv.height);
  lastPhaseKey = "";

  $("blurb").innerHTML =
    `<strong>${T.label} <span class="sci">${T.scientific}</span></strong>${T.note}`
    + `<span class="src">${T.fixes.toLocaleString("en-GB")} GPS fixes &middot; `
    + `${Math.round(T.km).toLocaleString("en-GB")} km &middot; `
    + `${(T.hours/24).toFixed(1)} days &middot; one fix every `
    + `${T.medianGapMin < 60 ? T.medianGapMin + " min"
        : (T.medianGapMin/60).toFixed(1) + " h"}`
    + `<br>${T.others ? T.others.length : 0} more birds of the same study were `
    + `aloft in the same days, shown faint on the same clock`
    + (T.colourBy === "population"
        ? `<br>colour is where each bird hatched, west to east` : "")
    + `<br>${T.source}</span>`;

  syncPlay();
  syncSpeedTitles();
  buildNotes();

  /* On a switch the camera flies to the new bird's start rather than cutting,
     so it stays obvious that this is one globe and not two pictures. The flight
     is just the easing above being given a distant target and left to run; on
     first load there is nothing to fly from, so it snaps. */
  targetAlt = altitudeFor(T);
  setFollow(FOCAL);
  if (initial){
    camLat = T.lat[0]; camLng = T.lon[0]; camAlt = targetAlt;
    camReady = false; lastSetAlt = -1;
  }
  measureChrome();
  paint(true, 1e3);
  requestAnimationFrame(measureChrome);
}

/* The eel view's own switch-in. It empties the globe.gl layers the bird views
   fill -- a stale stork trail hanging over the Atlantic would be exactly the
   kind of quiet lie this page exists not to tell. */
function setEelView(initial){
  eelT = 0;
  lastPhaseKey = "";
  globe.pathsData([]);
  globe.pointsData([]);
  sizeSwarm();

  $("blurb").innerHTML =
    `<strong>${E.label} <span class="sci">${E.scientific}</span></strong>`
    + `A schematic of one life: the Sargasso Sea to a European river and back. `
    + `<strong>Nothing here is a tracked animal.</strong> No eel has been `
    + `followed through a life this long, and no egg or spawning adult has `
    + `ever been recovered from the breeding area.`
    + `<span class="src">${E.particles.length.toLocaleString("en-GB")} drawn `
    + `particles &middot; ${E.regions.length} river systems &middot; `
    + `${(E.totalMonths / 12).toFixed(1)} years in `
    + `${Math.round(E.totalSeconds)} seconds`
    + `<br>the corridor follows the real current system; the calendar, speeds `
    + `and depths are measured and cited in the notes`
    + `<br>${E.status} &middot; sources: Righton et al. 2016, Wright et al. `
    + `2022, ICES 2025</span>`;

  $("dnote").innerHTML =
    `The swarm is thinned to <b>${E.recruitNow.elsewhere}%</b> &mdash; where `
    + `ICES's glass eel index stood in 2024 against the 1960&ndash;79 mean for `
    + `its "Elsewhere Europe" series. The North Sea series is at `
    + `<b>${E.recruitNow.north_sea}%</b>. Everything else on this view is `
    + `schematic; this number is not.`;

  syncPlay();
  syncSpeedTitles();
  buildNotes();
  buildStageKey();
  buildCallouts();

  /* Land on the swarm rather than flying to it from wherever the last bird
     was: at minute zero that is the breeding area, and the first frame should
     already be looking at it. */
  setFollow(FOCAL);
  const v = swarmView();
  if (v){ camLat = v.lat; camLng = v.lng; camAlt = v.alt; }
  targetAlt = camAlt;
  camReady = false; lastSetAlt = -1;
  measureChrome();
  paint(true, 1e3);
  requestAnimationFrame(measureChrome);
}

/* How far back to stand. The godwit crosses 62 degrees of latitude and wants
   most of a hemisphere; the albatross works a patch seven degrees tall and
   would be a squiggle at that distance. So the journey's own extent sets the
   altitude, clamped to what still reads as a globe rather than a map. */
function altitudeFor(t){
  const b = t.bounds;
  const dLat = b.lat1 - b.lat0;
  const dLon = (b.lon1 - b.lon0) * Math.cos(Math.PI/180 * (b.lat0 + b.lat1) / 2);
  const deg = Math.max(dLat, dLon * 0.55);
  let alt = Math.max(0.78, Math.min(2.2, deg / 42));
  /* A phone held upright is narrow, and at close range the sphere fills it
     edge to edge and stops looking like a sphere at all -- which is the one
     thing this page is for. Standing further back on a tall viewport keeps the
     limb in frame. */
  const aspect = innerHeight / Math.max(1, innerWidth);
  if (aspect > 1) alt *= 1 + 0.45 * Math.min(aspect - 1, 1.4);
  return alt;
}

function buildNotes(){
  if (MODE === "swarm") return buildEelNotes();
  $("notes").innerHTML = `
    <h2>Data notes</h2>
    <p>Every position on this globe is a real GPS fix with a real timestamp,
    from a published, openly licensed deposit. Between two fixes the marker
    interpolates, which is why the panel names the fix interval: at five
    minutes the line is close to the flight, at two hours it is a straight
    chord across whatever the bird actually did.</p>

    <h3>The three shapes</h3>
    <p class="sub">The marks beside the names are <strong>drawn
    silhouettes, not photographs</strong> &mdash; no photograph of these birds
    could be fetched from where this page is built, and an invented image
    presented as one would be a lie about a real animal. They are drawn from
    above in level flight, which is how the globe shows them, and the three are
    genuinely told apart that way: the albatross is nearly all wing, with a span
    about six times its body; the stork flies neck out and legs trailing past
    the tail on broad wings with slotted tips; the godwit is a wader, swept
    wings and a long straight bill.</p>

    <h3>How fast it runs</h3>
    <p class="sub">The speed buttons are multiples of a full pass in about
    seventy-five seconds, not fixed rates &mdash; these journeys are six days,
    three weeks and four and a half months, and one rate cannot serve all
    three. At a fixed eight hours per second the stork ran for nearly seven
    minutes, of which the first twenty-one days are a bird standing near its
    nest: half a minute of watching bought twenty-two kilometres, too little to
    see at this altitude. The read-out counts the days so a long journey reads
    as long rather than as stuck.</p>

    <h3>Turning it, and following</h3>
    <p>The globe starts holding the bird named under <strong>following</strong>.
    Drag it and the camera lets go &mdash; it is yours to turn from then on.
    <strong>Tap any bird</strong>, the followed one or any of the faint company,
    and the camera takes that one instead; you do not have to hit the dot, the
    nearest bird within a few degrees will do. <strong>Follow</strong> puts the
    camera back on the view's own bird. Pinching to zoom does <em>not</em> let
    go, because wanting a closer look at a bird is not the same as wanting to
    stop watching it.</p>

    <h3>The storks</h3>
    <p>Fifty-nine juveniles ringed at the nest across eight tagging sites, on
    their first autumn migration. The followed bird is the one that got
    furthest: from western Russia to Sudan, ending 6,596&nbsp;km from where it
    started. <strong>Colour is where each bird hatched</strong>, running warm in
    the west to cool in the east &mdash; there is deliberately no key for it,
    because eight swatches would cost more of the globe than the answer is
    worth, and the fan reads as geography without being labelled.</p>
    <p class="sub">This track is thinned to one fix every thirty minutes: the
    deposit records every five, which is 29,395 fixes across four months and far
    more detail than a line on a globe can show. The kilometres in the read-out
    are measured along the drawn track, so they leave out the thermal circling
    that thinning removes &mdash; 14,835&nbsp;km here against 17,598 at full
    resolution. The other two birds are drawn at their full recorded cadence.</p>

    <h3>Two birds this is <em>not</em></h3>
    <p>The brief for this page asked for the bar-tailed godwit <code>4BBRW</code>,
    which flew Alaska to New Zealand nonstop, and for a wandering albatross.
    Neither is open data, and rather than fake them this page shows the nearest
    real thing.</p>
    <p><strong>Bar-tailed godwit.</strong> The one deposit in the Movebank
    archive, <code>doi:10.5441/001/1.327</code>, is geolocator work: 18 birds and
    <strong>103 fixes in total</strong>, a median of six per bird, with explicit
    <code>lat-lower</code>/<code>lat-upper</code> error columns because that is
    what geolocators give. An eleven-day flight would be two or three points,
    each uncertain by a hundred kilometres. It cannot be animated honestly.</p>
    <p><strong>Wandering albatross.</strong> No deposit at all. Procellariiform
    tracking lives in BirdLife International's Seabird Tracking Database, which
    releases data per request and per data owner, not by open download.</p>

    <h3>What is shown instead</h3>
    <p><strong>Hudsonian godwit</strong> (<em>Limosa haemastica</em>) &mdash; the
    same phenomenon in a species whose data is public: a shorebird crossing open
    ocean without stopping. The journey here runs from off the coast of Chile to
    the Texas Gulf coast, 7,931&nbsp;km in 5.9 days, averaging 56&nbsp;km/h the
    whole way.</p>
    <p><strong>Grey-headed albatross</strong> (<em>Thalassarche chrysostoma</em>)
    &mdash; one complete foraging trip from Campbell Island, New Zealand: out
    across the antimeridian into the South Pacific and back, 12,285&nbsp;km over
    21.9 days, ending <strong>2&nbsp;km from where it began</strong>. A flat map
    tears that journey in half at the date line; a globe does not, which is the
    argument for this page existing.</p>

    <h3>The faint ones</h3>
    <p><strong>Flock</strong> adds the rest of the deposit &mdash; every other
    bird that was reporting while the followed one was in the air. They run on
    the <em>same clock</em>, not a shared start: these birds did not set off
    together, and lining them up at minute zero would invent a formation that
    never existed. So they appear and vanish as their tags reported, and the
    read-out counts how many are being heard at that instant.</p>
    <p>The godwit deposit has three others aloft in those six days, and you can
    watch all four work up the Pacific in the same week. The albatross deposit
    has nineteen, seven of them audible at a typical moment. The stork deposit
    has fifty-eight, of which thirty-eight are typically reporting and
    fifty-four at the busiest hour of the autumn.</p>
    <p class="sub">Each of them draws the track it has flown so far, thinner
    and dimmer than the followed bird and sampled coarser, fading into the dark
    at its far end so the line reads as a past rather than competing with the
    animal the camera is holding.</p>
    <p class="sub">Where a companion's tag fell silent, the line is drawn
    across the gap only if the gap can be crossed honestly: up to a day
    whatever the bird was doing &mdash; that is a night at roost, and the line
    across it is short because the bird did not move &mdash; and beyond a day
    only if the bird was in the same place at both ends. A tag that went quiet
    over a continent leaves a break, and the bird reappears as a new line
    rather than a chord across country it may never have crossed. Companions
    were drawn as short rolling tails until this was measured: a stork's solar
    tag reports every ninety minutes by day and nothing at all overnight, so a
    tail cut at every silence was never longer than one daylight stretch, and
    the median companion line across the whole timeline was
    <strong>zero kilometres</strong> &mdash; fifty-eight birds rendering as
    dots beside one long trail.</p>

    <h3>What was thrown away</h3>
    <p>173 of the 3,548 godwit GPS rows &mdash; 4.9% &mdash; carry impossible
    coordinates, latitude &minus;213 among them. They are almost all
    <em>unflagged</em>: <code>manually-marked-outlier</code> is empty for 171 of
    them and the tag calls 158 of them good 3D fixes, so they have to be caught
    on the coordinate range rather than on the quality flag.</p>
    <p>Inside the valid range, a forward pass drops any fix that could only be
    reached faster than the bird can fly &mdash; 120&nbsp;km/h for the godwit,
    150 for the albatross &mdash; anchored on the last <em>accepted</em> fix so
    one bad position does not disqualify the good one after it.</p>
    <p>Distance is only ever summed inside a continuous run of fixes. A four-day
    silence spans thousands of kilometres at a perfectly plausible average
    speed, and counting it would have inflated one bird's total to
    458,000&nbsp;km.</p>

    <h3>The globe</h3>
    <p class="sub">Rendered with globe.gl (MIT), which bundles three.js. The
    surface is NASA's Blue Marble Next Generation, a cloud-free MODIS composite,
    with a global elevation map as a bump layer. Both are carried in this
    repository rather than fetched from a CDN, so the page works on a host that
    allows no outbound requests.</p>

    <h3>Sources</h3>
    <p class="sub">Senner, N. R., Stager, M., Verhoeven, M. A., et al.
    <em>Compensation for wind drift prevails for a shorebird on a long-distance,
    transoceanic flight.</em> Data: <code>doi:10.5441/001/1.t81488n5</code>,
    Movebank Data Repository, CC0.</p>
    <p class="sub">Torres, L. G., Orben, R. A., Tolkova, I., Thompson, D. R.
    <em>Classification of animal movement behavior through residence in space
    and time.</em> Data: <code>doi:10.5441/001/1.694p666h</code>, Movebank Data
    Repository, CC0.</p>`;
}

/* The eel view's notes carry a heavier load than the others'. On the bird
   views the honest disclosure is "this is a GPS fix and here is the deposit";
   here it is the far longer list of what is drawn without being known. */
function buildEelNotes(){
  const m = E.measured;
  $("notes").innerHTML = `
    <h2>Data notes &mdash; the eel</h2>
    <p><strong>This view is a schematic. Nothing on it is a tracked
    animal.</strong> The other three views on this page draw recorded GPS
    fixes and interpolate between them. This one draws
    ${E.particles.length.toLocaleString("en-GB")} particles moving along a
    hand-drawn corridor, and it has to, because the recording does not
    exist.</p>

    <h3>Why there is no eel track</h3>
    <p class="sub">A European eel's life runs about fifteen years and crosses
    the Atlantic twice. A pop-up satellite tag lasts around a year and is far
    too large for anything smaller than a full-grown silver eel, so no eel has
    ever been followed from hatching to spawning, and nothing smaller than an
    adult has been followed at all.</p>
    <p class="sub">A hundred years after Johannes Schmidt named the Sargasso
    Sea as the breeding place, <strong>no egg and no spawning adult has ever
    been recovered from it</strong>. The spawning area is inferred from where
    the smallest larvae are caught. The larval drift has never been observed;
    it is reconstructed from larval surveys, growth rings in ear-stones, and
    particle-tracking models, and those three disagree by more than a year.</p>

    <h3>What is measured, and what is drawn</h3>
    <p class="sub"><strong>Measured</strong> &mdash; and stated in the chapter
    text, with sources below: the presumed breeding area
    (24&ndash;31&deg;N, 50&ndash;70&deg;W, the corners between which the
    smallest larvae are caught); the spawning season, beginning in December
    and peaking in February; the glass eel arrival calendar, October off
    Iberia to spring in the Baltic; silver eel escapement, peaking between
    10&nbsp;August and 20&nbsp;December across twenty catchments; oceanic
    swimming speeds of ${m.speedKmd[0]} to ${m.speedKmd[1]} km a day; the
    daily vertical migration between ${m.depthM[0]} and ${m.depthM[1]} m
    through ${m.tempC[0]} to ${m.tempC[1]}&nbsp;&deg;C; the convergence of
    tracked routes on the Azores; the growth phase of
    ${(m.growthMonths[0]/12).toFixed(0)} to
    ${(m.growthMonths[1]/12).toFixed(0)} years; the fishery quota, the
    seizures, and the recruitment collapse.</p>
    <p class="sub"><strong>Drawn</strong> &mdash; and not an estimate of
    anything: the corridor's exact path, which follows the real current system
    but comes from no current product; how the particles are shared out
    between the ${E.regions.length} river systems, for which ICES publishes no
    geographic split; and how many dots are removed by the fishery, by
    barriers and by attrition. Those removals are placed where those things
    actually happen. <strong>Their number is not a mortality rate and no such
    rate should be read off this page.</strong></p>

    <h3>The one number this view does claim</h3>
    <p class="sub">The <em>Today</em> button thins the swarm to
    <strong>${E.recruitNow.elsewhere}%</strong>, which is where ICES's glass
    eel recruitment index stood in 2024 against the geometric mean of
    1960&ndash;79 for its "Elsewhere Europe" series. The "North Sea" series
    stands at <strong>${E.recruitNow.north_sea}%</strong>. Recruitment fell
    until about 2011 and has not recovered since. The species is Critically
    Endangered, has been on CITES Appendix II since March 2009, and the EU has
    run a zero export quota since December 2010.</p>

    <h3>Two shapes that would have been claims</h3>
    <p class="sub">The breeding area is cited as two corner coordinates, and
    the first version of this view scattered the eggs uniformly through the
    rectangle they describe. A rectangle asserts straight edges and square
    corners running true north and true east, and no survey has found any such
    thing: what the larval surveys describe is a long narrow band along the
    subtropical convergence front. The corners are now read as the ends of
    that band's axis and the eggs fill an ellipse around it, drawn dashed
    because the edge is a sampling boundary and not a fence.</p>
    <p class="sub">The coastal legs are the other one. Joining the ocean
    corridor to each river mouth with a straight line put the eels over land
    &mdash; a straight line from the Azores Current to the Rh&ocirc;ne crosses
    Spain and the Pyrenees, and measured against a land mask
    <strong>32 of the 40 coastal legs ran overland, the worst of them for
    1,100&nbsp;km</strong>. Glass eels arrive by sea. Those legs are now
    shortest sea paths computed over a real elevation mask by
    <code>scripts/route_eels.py</code>: round Iberia into Biscay, through
    Gibraltar for the Mediterranean, through the Channel or round Scotland for
    the North Sea and the Baltic. The worst overland run left anywhere is one
    20&nbsp;km sample step where a line grazes a headland. The measured
    detours stay: Baltic and North Sea eels are still sent north into the
    Norwegian Sea on the way back, because that is what the tags recorded and
    a shortest path would have used the Channel.</p>

    <h3>The drift, and the argument about it</h3>
    <p class="sub">The animation cannot avoid taking a side on how long the
    larval drift lasts, because the drift length and the arrival calendar are
    one number seen twice. Spawning peaks in February; glass eels reach
    Portugal in October and the Baltic the following spring. Those only fit
    together at roughly twenty months for the first arrivals and twenty-six
    for the last &mdash; the long reading. Ear-stone growth rings suggest under
    a year, but that requires eels to spawn all year round, which the larval
    surveys do not show. The drift durations drawn here run
    ${m.driftDrawn[0]} to ${m.driftDrawn[1]} months.</p>

    <h3>The clock, and the camera</h3>
    <p class="sub">One rate cannot show a fifteen-year life. Each chapter
    declares its own, and the read-out states it: the estuary chapters run at
    a tenth of a month per second, the growth years at more than eight. The
    read-out's <em>age</em> row is the eel's real age throughout.</p>
    <p class="sub">The camera here is the animation's, not yours: it points at
    the mean position of every drawn eel and stands back far enough to hold
    the spread, so it follows the migration on its own and cannot be turned
    away. The mean is over unit vectors rather than over degrees, and the
    standoff comes from the 90th percentile of the spread rather than the
    maximum, so one straggler mid-Atlantic does not pull the view back off
    Europe. The three bird views still hand you their camera on a drag.</p>

    <h3>Sources</h3>
    ${E.sources.map(s => `<p class="sub">${s.text}`
        + (s.doi ? ` <code>doi:${s.doi}</code>` : "") + `</p>`).join("")}
    <p class="sub">Generated by <code>scripts/build_eels.py</code> from a fixed
    seed (${E.seed}), so the same commit always produces the same animation.
    That script's header keeps the measured constants and the drawn geometry in
    separate blocks, each annotated.</p>`;
}

function wire(){
  const row = $("birdRow");
  for (const k of ORDER){
    const t = SCHEMATIC.has(k) ? E : TRACKS[k];
    const b = document.createElement("button");
    b.dataset.key = k;
    /* The scientific name moved to the blurb: with a silhouette beside it the
       button had no room, and "Thalassarche chrysostoma" was being cut off. */
    b.title = SCHEMATIC.has(k)
      ? `${t.label} (${t.scientific}) — a schematic, not tracked animals`
      : `${t.label} (${t.scientific})`;
    b.innerHTML = `<span class="sil">${SILHOUETTE[k] || ""}</span>`
      + `<span class="nm">${t.label}`
      + (SCHEMATIC.has(k) ? `<em class="sch">schematic</em>` : "")
      + `</span>`;
    b.setAttribute("aria-pressed", String(k === key));
    b.addEventListener("click", () => setSpecies(k, false));
    row.appendChild(b);
  }

  const sp = $("speeds");
  for (const v of [0.5, 1, 2, 6]){
    const b = document.createElement("button");
    b.textContent = (v === 0.5 ? "\u00bd" : String(v)) + "\u00d7";
    b.dataset.v = String(v);
    b.setAttribute("aria-pressed", String(v === speedMult));
    b.addEventListener("click", () => {
      speedMult = v;
      for (const o of sp.querySelectorAll("button"))
        o.setAttribute("aria-pressed", String(Number(o.dataset.v) === speedMult));
      syncSpeedTitles();
    });
    sp.appendChild(b);
  }
  syncSpeedTitles();

  $("play").addEventListener("click", () => {
    if (MODE === "swarm"){
      if (!playing && eelT >= E.totalMonths) eelT = 0;
    } else {
      const end = T.min[T.min.length - 1];
      if (!playing && simMin >= end) simMin = 0;
    }
    playing = !playing; syncPlay();
  });
  $("density").addEventListener("click", e => {
    /* The one quantitative claim this view makes, and it is measured: ICES's
       glass eel index stands at 7.2% of the 1960-79 mean for the "Elsewhere
       Europe" series. Thinning the swarm to that fraction is the honest way
       to draw a number that big. */
    const now = eelDensity === 1;
    eelDensity = now ? E.recruitNow.elsewhere / 100 : 1;
    e.currentTarget.setAttribute("aria-pressed", String(now));
    e.currentTarget.textContent = now ? "Today" : "1960s";
    e.currentTarget.title = now
      ? `today's glass eel recruitment: ${E.recruitNow.elsewhere}% of the `
        + `1960-79 mean (ICES, "Elsewhere Europe" index)`
      : "draw the swarm at today's glass eel recruitment instead";
    document.body.dataset.density = now ? "now" : "then";
    requestAnimationFrame(measureChrome);
    paint(true, 1e3);
  });
  $("refollow").addEventListener("click", () => {
    setFollow(followId ? null : FOCAL);
    paint(true, 1e3);
  });
  $("others").addEventListener("click", e => {
    showOthers = !showOthers;
    e.currentTarget.setAttribute("aria-pressed", String(showOthers));
    paint(true, 1e3);
  });
  $("replay").addEventListener("click", () => {
    simMin = 0; eelT = 0; camReady = false; playing = true; syncPlay();
    paint(true, 1e3);
  });
  $("scrub").addEventListener("input", e => {
    playing = false; syncPlay();
    const f = Number(e.target.value) / 1000;
    if (MODE === "swarm") eelT = eelMonthsOf(f * E.totalSeconds);
    else simMin = f * T.min[T.min.length - 1];
    paint(true, 1e3);
  });

  const nb = $("notesbtn"), nt = $("notes");
  nb.addEventListener("click", () => {
    const open = nt.dataset.open !== "true";
    nt.dataset.open = String(open);
    nb.setAttribute("aria-expanded", String(open));
  });

  addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === " "){ e.preventDefault(); $("play").click(); }
    if (e.key === "f" || e.key === "F") $("others").click();
    if (e.key === "1") setSpecies("godwit", false);
    if (e.key === "2") setSpecies("albatross", false);
    if (e.key === "3") setSpecies("eel", false);
    if ((e.key === "c" || e.key === "C") && MODE === "swarm") toggleChapter();
  });

  addEventListener("resize", () => {
    globe.width(innerWidth).height(innerHeight);
    measureChrome();
    /* Rotating a phone changes how far back the globe has to sit. */
    /* The eel camera recomputes its own standoff every frame, including the
       tall-viewport correction, so a resize needs nothing but the canvas. */
    if (MODE === "swarm") sizeSwarm();
    else targetAlt = altitudeFor(T);
  });
}

/* -------------------------------------------------------------------- boot */

(async function boot(){
  try {
    const [tracks, eels] = await Promise.all([loadTracks(), loadEels()]);
    TRACKS = tracks;
    E = eels;

    globe = Globe()
      .globeImageUrl("vendor/earth-blue-marble.jpg")
      .bumpImageUrl("vendor/earth-topology.png")
      .backgroundColor("#04070d")
      .showAtmosphere(true)
      .atmosphereColor("#5b9fe0")
      .atmosphereAltitude(0.17)
      .width(innerWidth)
      .height(innerHeight)
      .pathPoints(d => d.pts)
      .pathPointLat(p => p[0])
      .pathPointLng(p => p[1])
      .pathPointAlt(0.006)
      .pathStroke(d => d.w)
      .pathTransitionDuration(0)      /* it is redrawn constantly; do not tween */
      /* The followed bird's trail is dense enough that its straight chords
         would show; the companions are decimated far below the point where a
         great-circle arc and a chord differ by a visible pixel, so they skip
         the subdivision and cost half as much geometry. */
      .pathResolution(d => d.id ? 1 : 2)
      .pointLat(d => d.lat).pointLng(d => d.lng)
      .pointColor(d => d.c).pointRadius(d => d.r).pointAltitude(d => d.alt)
      (document.getElementById("globe"));

    /* Blue Marble is a daylight composite, so a low-angle sun is not realism
       here, it is just half the picture missing. Most of the light is made
       ambient and the directional light is left only to keep some relief in
       the bump map. */
    const lights = globe.lights();
    for (const l of lights){
      if (l.type === "AmbientLight") l.intensity = 3.1;
      if (l.type === "DirectionalLight"){ l.intensity = 0.5; l.position.set(1, 1, 1); }
    }
    globe.lights(lights);

    const c = globe.controls();
    c.enableDamping = true;
    c.dampingFactor = 0.12;
    c.autoRotate = false;

    /* Turning the globe by hand releases the camera; pinching to zoom does
       not, because wanting a closer look at the bird you are following is not
       the same as wanting to stop following it. OrbitControls does not say
       which gesture happened, so the two are told apart by what actually
       moved between pointer-down and pointer-up. */
    let grabbed = null;
    c.addEventListener("start", () => {
      const v = globe.pointOfView();
      grabbed = {lat: v.lat, lng: v.lng};
      grabbing = true;          /* hands off the camera until they let go */
    });
    c.addEventListener("end", () => {
      grabbing = false;
      if (!grabbed || !followId) { grabbed = null; return; }
      const v = globe.pointOfView();
      const dLng = Math.abs(((v.lng - grabbed.lng) + 540) % 360 - 180);
      /* On the eel view there is no individual to hand the camera to, so a
         drag simply stops the chapter camera from pulling it back; the next
         chapter, or Restart, takes it again. */
      if (Math.abs(v.lat - grabbed.lat) > 0.25 || dLng > 0.25) setFollow(null);
      else camReady = false;    /* a zoom: re-land on the bird, do not drift */
      grabbed = null;
    });

    /* Tapping any bird hands the camera to it -- the followed one, or any of
       the company. An exact hit on the dot works, but a dot is a couple of
       pixels and a fingertip is not, so a tap on the globe near one counts as
       well: the nearest bird within a few degrees takes the camera. The
       threshold follows the zoom, so it stays about the same distance on
       screen however close in you are. */
    globe.onPointClick(d => { if (d && d.id) setFollow(d.id); });
    globe.onGlobeClick(({lat, lng}) => {
      const near = nearestBird(lat, lng);
      if (near) setFollow(near);
    });

    wire();
    setSpecies(key, true);

    $("loading").hidden = true;
    last = performance.now();
    requestAnimationFrame(frame);
  } catch (err){
    $("loading").innerHTML =
      "no tracks to load &mdash; rebuild data/processed (see the README), "
      + "and serve this over http(s) rather than opening the file directly";
    console.error(err);
  }
})();
</script>
