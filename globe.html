<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Four journeys, on a turning globe</title>
<meta name="description" content="A stork's first migration, a godwit up the Pacific and an albatross round the Southern Ocean — tracked, on a globe that turns to keep the animal in the middle — and a schematic of the European eel's Sargasso Sea life cycle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04070d; --ink:#eef3fb; --ink-2:#a9b6cc; --ink-3:#6b7a93;
    --panel:rgba(9,14,24,.76); --rule:rgba(150,175,215,.22);
    --godwit:#ffb03a; --albatross:#46d8ff; --eel:#ffd166;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #globe{position:fixed;inset:0;z-index:0}
  #globe canvas{display:block;outline:none}

  .panel{
    background:var(--panel);border:1px solid var(--rule);border-radius:11px;
    backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  }

  /* ---------------------------------------------------------- bird picker */
  #birds{position:fixed;z-index:3;left:16px;top:calc(16px + env(safe-area-inset-top,0px));
         display:flex;flex-direction:column;gap:7px;max-width:min(400px,calc(100vw - 32px));
         max-height:calc(100vh - 84px - env(safe-area-inset-top,0px)
                              - env(safe-area-inset-bottom,0px))}
  #birdRow{display:flex;gap:6px;padding:5px;align-items:stretch}
  #birdRow button{
    flex:1 1 0;min-width:0;font:inherit;font-size:.76rem;font-weight:500;
    padding:7px 11px;border:1px solid transparent;border-radius:7px;cursor:pointer;
    background:transparent;color:var(--ink-3);transition:color .15s,border-color .15s;
    display:flex;flex-direction:column;gap:2px;text-align:left;line-height:1.25;
  }
  /* The silhouette sits above the name rather than beside it. With three
     views the row layout fitted; with four it does not at any width -- at
     1440px each button is 93px wide and the word "Hudsonian" needs 118, so
     the label overran the panel on desktop and phone alike. Stacked, the
     name gets the button's full width. */
  #birdRow button{flex-direction:column;align-items:center;gap:3px;text-align:center}
  #birdRow button .nm{min-width:0;line-height:1.2;overflow-wrap:break-word}
  #blurb .sci{font-style:italic;font-weight:400;opacity:.7;font-size:.7rem}
  /* The silhouette takes the button's own colour, so it lights up with the
     label when its view is the one on screen. */
  #birdRow button .sil{flex:0 0 auto;display:block;width:32px;height:23px;opacity:.65}
  #birdRow button[aria-pressed="true"] .sil{opacity:1}
  #birdRow button .sil svg{width:100%;height:100%;display:block;fill:currentColor}
  #birdRow button:hover{color:var(--ink-2)}
  #birdRow button[aria-pressed="true"]{color:var(--ink);border-color:currentColor}
  #birdRow button[data-key="godwit"][aria-pressed="true"]{color:var(--godwit)}
  #birdRow button[data-key="albatross"][aria-pressed="true"]{color:var(--albatross)}
  #birdRow button[data-key="eel"][aria-pressed="true"]{color:var(--eel)}
  /* The one view that is not a track says so on its own button, always, not
     only once it has been opened. */
  #birdRow button .sch{
    display:block;font-style:normal;font-size:.52rem;letter-spacing:.06em;
    text-transform:uppercase;opacity:.72;margin-top:1px;
  }

  #blurb{padding:11px 13px;font-size:.72rem;line-height:1.5;color:var(--ink-2)}
  #blurb strong{color:var(--ink);font-weight:600;display:block;margin-bottom:3px;font-size:.76rem}
  #blurb .src{display:block;margin-top:7px;color:var(--ink-3);font-size:.64rem;line-height:1.45}

  /* ------------------------------------------------------------ read-out */
  #readout{
    position:fixed;z-index:3;right:16px;top:calc(16px + env(safe-area-inset-top,0px));
    padding:11px 13px;min-width:186px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
  }
  #readout .when{font-size:1.02rem;letter-spacing:.01em;margin-bottom:8px;color:var(--ink)}
  #readout dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.7rem}
  #readout dt{color:var(--ink-3)}
  #readout dd{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}

  /* ------------------------------------------------------------ controls */
  #controls{
    position:fixed;z-index:3;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    display:flex;align-items:center;gap:9px;padding:8px 11px;
    width:min(660px,calc(100vw - 32px));
  }
  #controls button{
    font:inherit;font-size:.72rem;color:var(--ink-2);background:transparent;
    border:1px solid var(--rule);border-radius:7px;padding:6px 11px;cursor:pointer;
    transition:color .15s,border-color .15s;
    flex:0 0 auto;white-space:nowrap;
  }
  #controls button:hover{color:var(--ink)}
  #play{min-width:66px;font-weight:500}
  #speeds{display:flex;gap:4px}
  #speeds button{padding:6px 9px;border-color:transparent}
  #speeds button[aria-pressed="true"]{color:var(--ink);border-color:var(--rule)}
  #others[aria-pressed="false"],
  #refollow[aria-pressed="false"]{color:var(--ink-3);border-color:transparent}
  #scrub{
    flex:1 1 auto;min-width:60px;height:26px;-webkit-appearance:none;appearance:none;
    background:transparent;cursor:pointer;outline:none;
  }
  #scrub::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--rule)}
  #scrub::-moz-range-track{height:3px;border-radius:2px;background:var(--rule)}
  #scrub::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--ink);margin-top:-4.5px;border:0;
  }
  #scrub::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:0}
  #scrub:focus-visible{outline:1px solid var(--ink-3);outline-offset:3px}

  /* ------------------------------------------------------------ chrome */
  #notesbtn{
    position:fixed;z-index:3;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
    font:inherit;font-size:.68rem;color:var(--ink-3);background:var(--panel);
    border:1px solid var(--rule);border-radius:7px;padding:6px 11px;cursor:pointer;
    backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  }
  #notesbtn:hover{color:var(--ink-2)}
  #notes{
    position:fixed;z-index:5;right:16px;bottom:calc(54px + env(safe-area-inset-bottom,0px));
    width:min(430px,calc(100vw - 32px));max-height:min(66vh,560px);overflow-y:auto;
    padding:16px 18px;font-size:.74rem;line-height:1.62;color:var(--ink-2);display:none;
  }
  #notes[data-open="true"]{display:block}
  #notes h2{font-size:.86rem;color:var(--ink);margin-bottom:9px;font-weight:600}
  #notes h3{font-size:.74rem;color:var(--ink);margin:14px 0 5px;font-weight:600}
  #notes p{margin-bottom:8px}
  #notes code{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink)}
  #notes .sub{color:var(--ink-3);font-size:.7rem}
  #notes a{color:var(--ink-2)}

  /* -------------------------------------------------------------- eels

     The eel view is a schematic and has to look like one at a glance, so it
     gets its own furniture: a swarm drawn on a 2-D canvas over the globe, a
     chapter card, place labels pinned to the sphere, and a badge that never
     leaves the screen while the view is up. */
  #swarm{position:fixed;inset:0;z-index:1;pointer-events:none;display:none}
  body[data-mode="swarm"] #swarm{display:block}
  body[data-mode="swarm"] #others,
  body[data-mode="swarm"] #refollow{display:none}
  #density{display:none}
  body[data-mode="swarm"] #density{display:block}
  #density[aria-pressed="true"]{color:#ff5470;border-color:rgba(255,84,112,.5)}

  /* With the blurb gone from this view the badge carries the disclaimer on
     its own, so it is a shade louder than a caption. */
  #schematic{
    display:none;align-self:flex-start;
    font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.09em;
    text-transform:uppercase;color:var(--eel);
    background:rgba(50,34,4,.86);border:1px solid rgba(255,209,102,.5);
    border-radius:999px;padding:5px 13px;white-space:nowrap;
    backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  }
  body[data-mode="swarm"] #schematic{display:block}

  /* Shown only while the swarm is thinned to today's recruitment, because a
     number that large should not live only in a button's tooltip. */
  #dnote{
    display:none;position:fixed;z-index:4;
    left:16px;bottom:calc(var(--ctrl-h,44px) + var(--chap-h,54px) + 28px
                          + env(safe-area-inset-bottom,0px));
    width:min(330px,calc(100vw - 32px));
    padding:9px 12px;font-size:.66rem;line-height:1.5;
    color:var(--ink-2);border-color:rgba(255,84,112,.4);
  }
  body[data-mode="swarm"][data-density="now"] #dnote{display:block}
  #dnote b{color:#ff8fa3;font-weight:600}

  /* The descriptions live in the bottom-left corner and fold away.

     They began in the column under the picker, which put a four-paragraph
     card down the whole left third of the screen -- on top of the thing it
     was describing. Down here they cover the emptiest corner of the frame,
     and the header is a button: the chapter number, its title and its
     one-line lead are always visible, the body is one click away, and the
     choice sticks across chapters so nobody has to close it eight times. */
  #chapter{
    display:none;position:fixed;z-index:4;
    left:16px;bottom:calc(var(--ctrl-h,44px) + 20px + env(safe-area-inset-bottom,0px));
    width:min(330px,calc(100vw - 32px));
    font-size:.71rem;line-height:1.58;color:var(--ink-2);overflow:hidden;
  }
  body[data-mode="swarm"] #chapter{display:block}
  #chapter .hd{
    display:block;width:100%;text-align:left;background:transparent;border:0;
    font:inherit;color:inherit;padding:10px 12px;cursor:pointer;
  }
  #chapter .hd:hover .ttl{color:#fff}
  #chapter .ph{
    font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);
    display:flex;align-items:center;gap:6px;
  }
  #chapter .ph .car{margin-left:auto;font-size:.72rem;line-height:1;
                    transition:transform .2s;color:var(--ink-2)}
  body[data-chapter="open"] #chapter .car{transform:rotate(180deg)}
  #chapter .ttl{display:block;font-size:.84rem;color:var(--ink);font-weight:600;
                line-height:1.25;margin-top:3px;transition:color .15s}
  #chapter .lead{display:block;color:var(--eel);font-size:.68rem;margin-top:2px}
  #chapter .body{
    display:none;padding:0 12px 11px;max-height:32vh;overflow-y:auto;
    border-top:1px solid var(--rule);margin-top:2px;padding-top:9px;
  }
  body[data-chapter="open"] #chapter .body{display:block}
  #chapter p{margin-bottom:7px}
  #chapter p:last-child{margin-bottom:0}
  #chapter strong{color:var(--ink)}
  #chapter em{color:var(--ink-3);font-style:italic}
  /* The eel view's own furniture carries what the blurb used to say, so the
     blurb is one panel too many here. */
  body[data-mode="swarm"] #blurb{display:none}

  /* Place labels. They sit on the sphere and are hidden when the place turns
     away from the camera, which is the one thing that makes a label on a
     globe read as attached to it rather than floating over it. */
  #callouts{position:fixed;inset:0;z-index:2;pointer-events:none;display:none}
  body[data-mode="swarm"] #callouts{display:block}
  #callouts .co{
    position:absolute;transform:translate(9px,-50%);white-space:nowrap;
    font-family:"IBM Plex Mono",monospace;font-size:.62rem;line-height:1.35;
    color:var(--ink);text-shadow:0 1px 5px rgba(2,5,11,.95),0 0 12px rgba(2,5,11,.85);
    opacity:0;transition:opacity .5s;
  }
  #callouts .co[data-on="true"]{opacity:1}
  #callouts .co b{font-weight:500;display:block}
  #callouts .co span{color:var(--ink-3);font-size:.58rem}
  #callouts .co::before{
    content:"";position:absolute;left:-9px;top:50%;width:5px;height:5px;
    margin:-2.5px 0 0 -2.5px;border-radius:50%;
    background:#ffd166;box-shadow:0 0 7px rgba(255,209,102,.9);
  }

  /* The stage key doubles as the life-cycle clock: the active stage lights up
     as the swarm passes through it. */
  #stages{
    position:fixed;z-index:4;display:none;
    right:16px;top:calc(184px + env(safe-area-inset-top,0px));
    padding:9px 11px;font-family:"IBM Plex Mono",monospace;font-size:.62rem;
  }
  body[data-mode="swarm"] #stages{display:block}
  #stages div{display:flex;align-items:center;gap:7px;padding:2px 0;color:var(--ink-3);
              transition:color .3s}
  #stages div[data-on="true"]{color:var(--ink)}
  #stages i{width:7px;height:7px;border-radius:50%;background:currentColor;
            flex:0 0 auto;opacity:.45;transition:opacity .3s}
  #stages div[data-on="true"] i{opacity:1;box-shadow:0 0 8px currentColor}
  #stages b{font-weight:400;margin-left:auto;padding-left:12px;opacity:.75;
            font-variant-numeric:tabular-nums}

  #pagelinks{
    position:fixed;z-index:3;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
    display:flex;gap:6px;
  }
  #pagelinks a{
    font-size:.68rem;color:var(--ink-3);text-decoration:none;background:var(--panel);
    border:1px solid var(--rule);border-radius:7px;padding:6px 11px;white-space:nowrap;
    backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  }
  #pagelinks a:hover{color:var(--ink-2)}
  /* On a phone this row shares its line with the schematic badge, which is
     centred and cannot be allowed to collide with anything, so the back-link
     gives up two words rather than the second link giving up its place. */
  #pagelinks .sm{display:none}

  #loading{
    position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    background:var(--bg);font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--ink-3);
    text-align:center;padding:24px;
  }
  #loading[hidden]{display:none}

  /* On a phone the globe is the scarce thing: the blurb folds away, the
     read-out keeps only what changes, and the controls span the width. */
  @media (max-width:820px){
    #birds{left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));max-width:none;
           max-height:calc(100vh - 10px - var(--stack,150px))}
    #birdRow button{font-size:.68rem;padding:6px 4px;gap:2px}
    #birdRow button .sil{width:26px;height:19px}
    #blurb{display:none}
    /* --ctrl-h is the control bar's measured height: below 520px it wraps to
       two rows, and a fixed 64px offset put the read-out underneath it. */
    #readout{right:10px;top:auto;left:10px;
             bottom:calc(var(--ctrl-h,54px) + 18px + env(safe-area-inset-bottom,0px));
             min-width:0;
             display:flex;align-items:baseline;gap:12px;padding:8px 11px;flex-wrap:wrap}
    #readout .when{margin-bottom:0;font-size:.84rem}
    #readout dl{grid-template-columns:auto auto auto auto;gap:2px 8px;font-size:.64rem}
    #readout dd{text-align:left}
    #controls{left:10px;right:10px;transform:none;width:auto;
              bottom:calc(10px + env(safe-area-inset-bottom,0px))}
    #notesbtn{right:10px;bottom:auto;
              top:calc(var(--pick-h,67px) + 18px + env(safe-area-inset-top,0px))}
    #pagelinks{left:10px;bottom:auto;
               top:calc(var(--pick-h,67px) + 18px + env(safe-area-inset-top,0px))}
    #pagelinks a{font-size:.6rem;padding:5px 8px}
    #pagelinks .lg{display:none}
    #pagelinks .sm{display:inline}
    #notes{right:10px;left:10px;width:auto;top:auto;
           bottom:calc(var(--ctrl-h,54px) + 18px + env(safe-area-inset-bottom,0px));
           max-height:56vh}
  }
  @media (max-width:820px){
    /* The badge takes the middle of the row the back-link and notes button
       share, so it is never stacked on either. On a phone the blurb is hidden
       as it is on the bird views, and this badge carries the disclaimer on
       its own -- which is why it cannot be allowed to collide with anything. */
    #schematic{
      position:fixed;z-index:4;left:50%;transform:translateX(-50%);
      top:calc(var(--pick-h,67px) + 18px + env(safe-area-inset-top,0px));
      font-size:.5rem;padding:4px 9px;letter-spacing:.05em;
    }
    /* Below this the full badge reaches the links on its left; the first
       word is the load-bearing one, so the rest goes. The threshold is where
       the two actually meet -- it moved out from 420px when the links became
       a row of two rather than a single back-link. */
    @media (max-width:470px){ #schematic .long{display:none} }
    #stages{right:10px;top:auto;padding:7px 9px;font-size:.58rem;
            bottom:calc(var(--ctrl-h,54px) + var(--ro-h,116px)
                        + var(--chap-h,54px) + 34px
                        + env(safe-area-inset-bottom,0px))}
    #stages b{display:none}
    #chapter{left:10px;right:10px;width:auto;font-size:.68rem;
             bottom:calc(var(--ctrl-h,54px) + var(--ro-h,116px) + 26px
                         + env(safe-area-inset-bottom,0px))}
    #chapter .body{max-height:24vh}
    #chapter .ttl{font-size:.78rem}
    #callouts .co{font-size:.58rem}
    #callouts .co span{display:none}
  }
  @media (max-width:520px){
    #speeds button[data-v="0.5"]{display:none}
    #replay{display:none}
    #readout dl{grid-template-columns:auto auto}
    /* Below this the row of controls is wider than the phone and the last
       button -- Flock -- was pushed clean off the panel and could not be
       tapped at all. The row wraps instead, and the scrubber takes the second
       line where it has room to be dragged. */
    #controls{flex-wrap:wrap;row-gap:7px}
    #scrub{flex:1 1 100%;order:2;min-width:0}
    #play,#speeds,#others{order:1}
    #speeds{flex:1 1 auto;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){
    #birdRow button{transition:none}
  }
</style>

<div id="globe"></div>
<canvas id="swarm"></canvas>
<div id="callouts"></div>

<div id="birds">
  <div id="birdRow" class="panel"></div>
  <div id="schematic" title="Nothing on this view is a tracked animal">schematic<span class="long"> &middot; not tracked animals</span></div>
  <div id="blurb" class="panel"></div>
</div>

<div id="dnote" class="panel"></div>
<div id="chapter" class="panel"></div>

<div id="readout" class="panel">
  <div class="when" id="when">&mdash;</div>
  <dl>
    <dt id="l-dist">flown</dt><dd id="dist">0 km</dd>
    <dt id="l-speed">speed</dt><dd id="speed">0 km/h</dd>
    <dt id="l-lat">lat</dt><dd id="lat">&mdash;</dd>
    <dt id="l-lon">lon</dt><dd id="lon">&mdash;</dd>
    <dt id="l-nother">others</dt><dd id="nother">&mdash;</dd>
    <dt id="l-day">day</dt><dd id="day">&mdash;</dd>
    <dt id="l-follow">following</dt><dd id="follow">&mdash;</dd>
  </dl>
</div>

<div id="controls" class="panel">
  <button id="play" aria-pressed="true">Pause</button>
  <div id="speeds"></div>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek along the journey">
  <button id="others" aria-pressed="true" title="Show the rest of the deposit on the same clock">Flock</button>
  <button id="density" aria-pressed="false" title="Draw the swarm at today's glass eel recruitment instead of the 1960&ndash;79 baseline">1960s</button>
  <button id="refollow" aria-pressed="true" title="Hold the camera on this bird again (drag the globe to let go, tap any bird to follow it)">Follow</button>
  <button id="replay" title="Back to the start">Restart</button>
</div>

<div id="stages" class="panel"></div>

<div id="pagelinks">
  <a href="index.html"><span class="lg">&larr; Stork map</span><span class="sm">&larr; Map</span></a>
  <a href="daylight.html">Daylight</a>
</div>
<button id="notesbtn" aria-expanded="false">Data notes</button>
<div id="notes" class="panel"></div>

<div id="loading">loading tracks&hellip;</div>

<script src="vendor/globe.gl.min.js"></script>
<script>
"use strict";

/* ------------------------------------------------------------------ model

   Two real journeys, one per species, chosen by scripts/build_globe.py from
   two CC0 Movebank deposits. Every position here is a GPS fix with a
   timestamp; nothing is invented and nothing is smoothed. The only thing the
   page adds is interpolation between consecutive fixes, so the marker slides
   rather than jumping -- which is why the read-out reports the fix interval.  */

const SPECIES_COLOUR = {stork: "#ff8a3d", godwit: "#ffb03a", albatross: "#46d8ff"};

/* The stork deposit's whole point is which colony a bird came from, so those
   birds are coloured by tagging site instead of by species -- the same
   west-to-east warm-to-cool ramp the flat map uses. There is deliberately no
   key for it on this page: nine swatches would cost more room than the globe
   can spare, and the fan of colour reads as geography without being labelled. */
const POPS = {
  Spain:   "#ffc247", Germany: "#ff8a3d", Tunisia: "#ff5470",
  Poland:  "#e070ff", Greece:  "#8f7dff", Russia:  "#3fa9ff",
  Armenia: "#2ee0b8", Uzbekistan: "#9aa7bd", "South Africa": "#7ee08a",
};
const popColour = pop => POPS[pop] || "#c9d6ea";

/* A shape for each species beside its name. These are drawn silhouettes, not
   photographs -- no photo of these birds could be fetched from where this is
   built, and an invented one presented as a photograph would be a lie. Drawn
   from above in level flight, which is how the globe shows them, and the three
   are genuinely told apart this way: the albatross is nearly all wing, span
   about six times its body; the stork flies neck out and legs trailing past
   the tail, on broad wings with slotted tips; the godwit is a wader, swept
   wings and a long straight bill. */
const SILHOUETTE = {
  stork: `<svg viewBox="0 0 48 34" aria-hidden="true" focusable="false">
