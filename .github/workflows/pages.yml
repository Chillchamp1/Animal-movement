name: Deploy to GitHub Pages

# index.html carries no build step of its own, but it fetches its tracks at
# runtime and the data is deliberately not kept in the repository. The job
# therefore fetches the Movebank deposits and rebuilds data/processed before
# publishing, so the live page has something to load.
on:
  push:
    branches: [claude/animal-movement-map-jvg57p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a queued run waits rather than cancelling, so
# the published site always ends up matching the newest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the Movebank deposits
        run: |
          python -m pip install --quiet pandas numpy pillow rasterio
          # Skip the accelerometer files in both: 640 MB nothing here reads.
          python3 scripts/fetch_movebank.py --doi 10.5441/001/1.78152p3q \
            --match gps reference-data README --out data/raw/storks
          python3 scripts/fetch_movebank.py --doi 10.5441/001/1.hn1bd23k \
            --match gps reference-data README --out data/raw/storks-ages
          # The two the globe runs on. See scripts/build_globe.py for why these
          # species and not the two the globe was first asked for.
          python3 scripts/fetch_movebank.py --doi 10.5441/001/1.t81488n5 \
            --match gps reference-data README --out data/raw/godwit-hud
          python3 scripts/fetch_movebank.py --doi 10.5441/001/1.694p666h \
            --match Torres README --out data/raw/albatross

      - name: Build the tracks and the backdrop
        run: |
          python3 scripts/build_storks.py
          # The second deposit is fall migration only, and autumn 2013 is its
          # one season carrying both age classes: 37 juveniles, 37 adults.
          python3 scripts/build_storks.py --raw data/raw/storks-ages \
            --out-name storks-ages.json \
            --from-date 2013-08-01 --to-date 2013-11-01 --exclude \
            --source "Rotics et al. 2016, doi:10.5441/001/1.hn1bd23k (CC0)"
          # One journey per species for globe.html.
          python3 scripts/build_globe.py
          # The eel view. This one takes no deposit and downloads nothing: it
          # is a schematic, generated from a fixed seed so the same commit
          # always produces the same animation. See the script's header for
          # why the eel cannot be drawn from tracks.
          python3 scripts/build_eels.py
          # Reads 959 WorldCover tiles at their coarsest overview: about fifteen
          # minutes, and the reason a deploy is not instant.
          python3 scripts/build_landcover.py
          # Fetches its own elevation tiles; both must run before the cache goes.
          python3 scripts/build_basemap.py
          # The raw CSV and tile caches must not reach the Pages artifact.
          rm -rf data/raw

      # enablement turns Pages on and points its source at this workflow,
      # so the site needs no visit to the repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Without this marker Pages runs the tree through Jekyll, which drops
      # anything it reads as a template.
      - run: touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
