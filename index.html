<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A day in the Delta</title>
<meta name="description" content="Hourly GPS tracks of impala, tsessebe, wildebeest and zebra in the Okavango Delta, animated against lion and wild dog activity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<style>
  /* Like the rail maps, this page ignores the viewer's light/dark preference:
     it is a night map at every hour, so the animals stay the brightest thing
     on it. */
  :root{
    --bg-bot:#0a1018;
    --ink:#e9eff7; --ink-2:#a7b3c4; --ink-3:#78859a;
    --rule:rgba(39,51,63,0.7); --panel:rgba(13,20,30,0.82);
    --zebra:#5aa9ff; --wildebeest:#b98cff; --tsessebe:#35d69a; --impala:#ffd93d;
    --dog:#ff7a45; --lion:#ff8fd8;
    /* Landscape layer: two muted, desaturated washes, so the animals stay the
       brightest thing on the map even with a layer switched on. */
    --dry-bias:#b08d57; --rainy-bias:#4a8f9e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg-bot);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-weight:300;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden}
  /* The map owns every gesture on it: there is nothing to scroll past. */
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;
       touch-action:none;cursor:grab}
  #resetview{min-width:56px;font-family:"IBM Plex Mono",monospace;font-size:0.72rem}
  #resetview:disabled{opacity:0.45;cursor:default}

  /* ---- pickers --------------------------------------------------------- */
  #picks{position:fixed;z-index:6;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;max-width:calc(100vw - 40px)}
  .row{display:flex;gap:4px;flex-wrap:wrap}
  .row button{
    padding:4px 10px;font-size:0.72rem;border:1px solid transparent;
    color:var(--ink-3);background:transparent;border-radius:6px;cursor:pointer;
    font:inherit;font-size:0.72rem;
  }
  .row button[aria-pressed="true"]{color:var(--ink);border-color:var(--rule)}
  /* Impala were only collared in the dry season; the pill says so rather than
     sitting lit with nothing behind it. */
  .row button[data-unavailable="true"]{opacity:0.3;cursor:not-allowed}
  .row button[data-unavailable="true"]::after{content:" \2014";letter-spacing:0.1em}
  .row .lab{
    font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;
    color:var(--ink-3);align-self:center;padding-right:4px;min-width:52px;
  }

  /* ---- clock ----------------------------------------------------------- */
  header{
    position:absolute;z-index:3;left:50%;top:78px;
    text-align:center;pointer-events:none;white-space:nowrap;
    transform:translate(-50%,0);
    text-shadow:0 0 10px var(--bg-bot), 0 0 4px var(--bg-bot);
  }
  #clock{
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:300;
    font-size:clamp(2rem,4.6vw,3rem);line-height:1;letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;color:var(--ink);
  }
  #clock .mins{opacity:0.6}
  #day{margin-top:2px;font-size:0.68rem;letter-spacing:0.06em;color:var(--ink-3);
       font-family:"IBM Plex Mono",monospace;}
  /* Two lamps: which predator is in its active window right now. */
  #lamps{margin-top:7px;display:flex;gap:14px;justify-content:center;font-size:0.63rem;
         font-family:"IBM Plex Mono",monospace;letter-spacing:0.1em;text-transform:uppercase}
  #lamps span{color:var(--ink-3);opacity:0.42;transition:opacity 0.25s,color 0.25s}
  #lamps span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
                      background:currentColor;margin-right:5px;vertical-align:middle}
  #lamps span[data-on="true"]{opacity:1}
  #lampDog[data-on="true"]{color:var(--dog)}
  #lampLion[data-on="true"]{color:var(--lion)}

  /* ---- panels ---------------------------------------------------------- */
  .panel{
    background:var(--panel);border:1px solid var(--rule);border-radius:10px;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  }
  #legend{position:fixed;z-index:3;left:20px;bottom:20px;padding:13px 15px 11px;min-width:238px;max-width:340px}
  #notes h2{
    font-size:0.62rem;letter-spacing:0.17em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;margin-bottom:9px;
  }
  /* The legend folds away: on a wide screen it sits over the map, and at full
     extent there is no room to pan the delta out from under it. */
  #legendToggle{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;padding:0;border:0;background:none;
    font-size:0.62rem;letter-spacing:0.17em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;
  }
  #legendToggle:hover{color:var(--ink-2);background:none}
  #legendToggle .chev::before{content:"\2013"}          /* en dash */
  #legendToggle[aria-expanded="false"] .chev::before{content:"+"}
  #legendBody{margin-top:9px}
  #legendToggle[aria-expanded="false"] + #legendBody{display:none}
  #legend[data-collapsed="true"]{min-width:0}
  .lg{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:0.83rem}
  .sw{border-radius:50%;flex:0 0 auto;width:9px;height:9px;box-shadow:0 0 0 2px var(--panel)}
  .lg .nm{flex:1 1 auto;color:var(--ink)}
  .lg .ct{font-family:"IBM Plex Mono",monospace;font-size:0.76rem;color:var(--ink-2);
          font-variant-numeric:tabular-nums}
  #legend footer{margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);
                 font-size:0.66rem;line-height:1.45;color:var(--ink-3)}

  #controls{position:fixed;z-index:3;right:20px;bottom:20px;padding:11px 14px;
            display:flex;align-items:center;gap:12px}
  button{
    font:inherit;font-size:0.78rem;color:var(--ink);background:transparent;
    border:1px solid var(--rule);border-radius:6px;padding:5px 11px;cursor:pointer;
    transition:background 0.15s,border-color 0.15s;
  }
  button:hover{background:rgba(128,128,128,0.13)}
  button[aria-pressed="true"]{border-color:currentColor}
  #play{min-width:64px}
  .spd{display:flex;gap:5px}
  .spd button{padding:5px 8px;font-family:"IBM Plex Mono",monospace;font-size:0.72rem}
  /* The scrubber is a transparent range input over the diel profile, so
     pointer, touch and keyboard seeking all stay native. */
  #profile{position:relative;width:268px;height:44px}
  #profcv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #scrub{position:absolute;inset:0;margin:0;width:100%;height:100%;
         -webkit-appearance:none;appearance:none;background:transparent;outline:none;cursor:pointer}
  #scrub::-webkit-slider-runnable-track{background:transparent;height:100%}
  #scrub::-moz-range-track{background:transparent;height:100%}
  #scrub::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:44px;border-radius:1px;
                               background:var(--ink);cursor:pointer}
  #scrub::-moz-range-thumb{width:3px;height:44px;border:0;border-radius:1px;background:var(--ink);cursor:pointer}
  #scrub:focus-visible{outline:1px solid var(--ink-3);outline-offset:2px}

  #meta{position:absolute;z-index:3;left:14px;top:106px;max-width:252px;
        font-size:0.68rem;line-height:1.5;color:var(--ink-3);
        background:rgba(5,8,14,.62);padding:9px 12px;border-radius:8px}
  #meta strong{color:var(--ink-2);font-weight:500}
  #notesbtn{position:fixed;z-index:4;right:20px;top:20px}
  #notes{position:fixed;z-index:3;right:20px;top:60px;padding:14px 16px;max-width:352px;
         display:none;max-height:calc(100vh - 160px);overflow-y:auto}
  #notes[data-open="true"]{display:block}
  #notes p{font-size:0.72rem;line-height:1.55;color:var(--ink-2);margin-bottom:9px}
  #notes p.sub{color:var(--ink-3);font-size:0.68rem}
  #notes code{font-family:"IBM Plex Mono",monospace;font-size:0.68rem;color:var(--ink)}
  #notes h3{font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;
            color:var(--ink-3);font-weight:500;margin:13px 0 6px}

  /* Imagery attribution, required whenever a tile layer is on. */
  #attrib{
    position:fixed;z-index:4;right:20px;bottom:96px;
    font-size:0.6rem;letter-spacing:0.02em;color:var(--ink-3);
    background:rgba(5,8,14,.66);padding:3px 7px;border-radius:5px;
    pointer-events:none;
  }
  #attrib[hidden]{display:none}
  @media (max-width:820px){ #attrib{bottom:auto;top:14px;right:14px} }

  #loading{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
           background:var(--bg-bot);font-family:"IBM Plex Mono",monospace;font-size:0.8rem;
           color:var(--ink-3);letter-spacing:0.08em}
  #loading[hidden]{display:none}

  @media (max-width:820px){
    #legend{left:12px;right:12px;bottom:96px;max-width:none;min-width:0}
    #controls{left:12px;right:12px;bottom:20px;justify-content:space-between;gap:8px}
    #profile{width:auto;flex:1 1 auto}
    #meta{display:none}
    header{top:120px}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="map"></canvas>

  <div id="picks">
    <div class="row" id="spRow"><span class="lab">Species</span></div>
    <div class="row" id="seRow"><span class="lab">Season</span></div>
    <div class="row" id="prRow"><span class="lab">Layer</span></div>
    <div class="row" id="imRow"><span class="lab">Imagery</span></div>
  </div>

  <header>
    <div id="clock">00<span class="mins">:00</span></div>
    <div id="day">day 1</div>
    <div id="lamps">
      <span id="lampDog" data-on="false">wild dog</span>
      <span id="lampLion" data-on="false">lion</span>
    </div>
  </header>

  <div id="meta">
    <strong>Okavango Delta, Botswana</strong><br>
    Hourly GPS fixes reconstructed from Bennitt et al. (2024).
    Positions are real; calendar dates are not in the deposit, so days count
    from each collar's first fix.
  </div>

  <button id="notesbtn" aria-expanded="false">Data notes &amp; gaps</button>
  <div id="notes" class="panel"><h2>Data notes &amp; gaps</h2><div id="notesBody"></div></div>

  <div id="legend" class="panel">
    <button id="legendToggle" aria-expanded="true" aria-controls="legendBody">
      On screen<span class="chev" aria-hidden="true"></span>
    </button>
    <div id="legendBody">
      <div id="legendRows"></div>
      <footer id="legendFoot"></footer>
    </div>
  </div>

  <div id="controls" class="panel">
    <button id="play" aria-pressed="true">Pause</button>
    <div class="spd" id="spd"></div>
    <button id="resetview" title="Reset the view (0)" disabled>
      <span id="zoomlv">fit</span>
    </button>
    <div id="profile"><canvas id="profcv"></canvas><input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek"></div>
  </div>
</div>

<div id="attrib" hidden></div>
<div id="loading">loading tracks&hellip;</div>

<script>
"use strict";

/* ------------------------------------------------------------------ model */

const SPECIES = {
  zebra:      {label:"Zebra",      role:"zebra",      seasons:["dry","rainy"]},
  wildebeest: {label:"Wildebeest", role:"wildebeest", seasons:["dry","rainy"]},
  tsessebe:   {label:"Tsessebe",   role:"tsessebe",   seasons:["dry","rainy"]},
  impala:     {label:"Impala",     role:"impala",     seasons:["dry"]},
};
const SPECIES_ORDER = ["zebra","wildebeest","tsessebe","impala"];

/* Predator activity is a function of hour-of-day. These windows are the ones
   the deposit itself encodes, recovered while de-interleaving the tables. */
const DOG_HOURS  = new Set([4,5,6,7,8,17,18,19]);
const LION_HOURS = new Set([18,19,20,21,22,23,0,1,2,3,4,5,6,7]);
const dogActive  = h => DOG_HOURS.has(h);
const lionActive = h => LION_HOURS.has(h);

const pick = name => getComputedStyle(document.documentElement)
  .getPropertyValue("--" + name).trim();
const hexRGB = hex => {
  const h = hex.replace("#","");
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
};
const rgba = (c,a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

let sel = {species:new Set(["zebra"]), season:"dry", layer:"none", imagery:false};
let TRACKS = [];          /* flattened, currently displayed */
let RISK = null;          /* predator-risk.json */
let SEASONAL = null;      /* seasonal-shift.json */
let SPAN = 1;             /* total hours on the clock */
let BOUNDS = null;        /* {lon0,lat0,lon1,lat1} of the current selection */
const CACHE = new Map();

/* ------------------------------------------------------------------ load */

/* Served from a directory the page can fetch, or inlined ahead of this script
   by scripts/build_standalone.py for a single-file build. */
const INLINE = (typeof window !== "undefined" && window.__DELTA_DATA__) || null;

async function loadJSON(name){
  if (INLINE) return INLINE[name] ?? null;
  const res = await fetch(`data/processed/${name}.json`);
  if (!res.ok) throw new Error(`cannot load ${name}: ${res.status}`);
  return res.json();
}

async function loadSpeciesSeason(sp, season){
  const key = sp + "-" + season;
  if (CACHE.has(key)) return CACHE.get(key);
  const raw = await loadJSON(key);
  if (!raw) throw new Error(`no data for ${key}`);

  /* Build one continuous hourly timeline per individual. Inside a segment the
     step is one hour. Across a gap the deposit cannot say how many hours were
     lost, only the hour-of-day on either side, so the gap is taken as the
     smallest positive number of hours consistent with both -- which keeps every
     animal's diel phase exact and never invents a longer absence than the data
     requires. */
  const inds = raw.individuals.map(ind => {
    let n = 0;
    for (const s of ind.segments) n += s.coords.length;
    const times = new Int32Array(n);
    const lons  = new Float32Array(n);
    const lats  = new Float32Array(n);
    const uiDog = new Float32Array(n);
    const uiLion= new Float32Array(n);
    /* Marks the first fix of a segment. The collar could have been silent for
       days, and the hours on either side cannot tell us how many; nothing is
       ever drawn across one of these, however small the inferred gap. */
    const brk   = new Uint8Array(n);

    let i = 0, t = 0, prevHour = null;
    for (const seg of ind.segments){
      if (prevHour === null) t = seg.startHour;
      else {
        const gap = (seg.startHour - prevHour + 24) % 24;
        t += (gap === 0 ? 24 : gap);
        brk[i] = 1;
      }
      for (let j = 0; j < seg.coords.length; j++){
        const c = seg.coords[j];
        times[i] = t; lons[i] = c[0]; lats[i] = c[1];
        uiDog[i] = c[2]; uiLion[i] = c[3];
        i++; if (j < seg.coords.length - 1) t += 1;
      }
      prevHour = (seg.startHour + seg.coords.length - 1) % 24;
    }
    return {id:ind.id, species:sp, n, times, lons, lats, uiDog, uiLion, brk,
            t0:times[0], t1:times[n-1]};
  });

  const out = {meta:raw, individuals:inds};
  CACHE.set(key, out);
  return out;
}

/* A fix counts as high-exposure when the predator's utilisation there sits in
   the top decile of everything that animal experienced. */
function exposureThresholds(inds){
  const gather = f => {
    const all = [];
    for (const ind of inds) for (let i = 0; i < ind.n; i++) all.push(f(ind, i));
    all.sort((a,b)=>a-b);
    return all.length ? all[Math.floor(all.length * 0.9)] : Infinity;
  };
  return {
    dog:  gather((ind,i)=>ind.uiDog[i]),
    lion: gather((ind,i)=>ind.uiLion[i]),
  };
}

async function rebuild(){
  const wanted = [];
  for (const sp of SPECIES_ORDER){
    if (!sel.species.has(sp)) continue;
    if (!SPECIES[sp].seasons.includes(sel.season)) continue;
    wanted.push(sp);
  }
  const loaded = await Promise.all(wanted.map(sp => loadSpeciesSeason(sp, sel.season)));

  TRACKS = [];
  for (const set of loaded){
    const th = exposureThresholds(set.individuals);
    for (const ind of set.individuals) TRACKS.push(Object.assign({th}, ind));
  }

  /* Collars fail at different times: by the end of the longest record most of
     the others have long since stopped, which left one or two animals moving
     over everyone else's fixes. Each collar therefore repeats its own record,
     on a period rounded up to whole days so that hour-of-day - the only real
     clock this data has - stays exact for every animal at once. */
  for (const t of TRACKS) t.period = Math.max(24, Math.ceil((t.t1 + 1) / 24) * 24);

  SPAN = 1;
  let lo0 = Infinity, la0 = Infinity, lo1 = -Infinity, la1 = -Infinity;
  for (const t of TRACKS){
    if (t.period > SPAN) SPAN = t.period;
    for (let i = 0; i < t.n; i++){
      if (t.lons[i] < lo0) lo0 = t.lons[i];
      if (t.lons[i] > lo1) lo1 = t.lons[i];
      if (t.lats[i] < la0) la0 = t.lats[i];
      if (t.lats[i] > la1) la1 = t.lats[i];
    }
  }
  BOUNDS = TRACKS.length ? {lon0:lo0, lat0:la0, lon1:lo1, lat1:la1} : null;
  if (simH > SPAN) simH = 0;

  CAM = null;          /* a new selection reframes */
  resize();
  buildLegend();
  buildProfile();
  syncSpeciesPills();
  baseReady = false;
}

function syncSpeciesPills(){
  for (const b of document.querySelectorAll("#spRow button")){
    const ok = SPECIES[b.dataset.key].seasons.includes(sel.season);
    b.dataset.unavailable = String(!ok);
    b.setAttribute("aria-pressed", String(ok && sel.species.has(b.dataset.key)));
  }
}

/* ------------------------------------------------------------- projection */

let W=0, H=0, DPR=1, kLat=1;
const map = document.getElementById("map");
const ctx = map.getContext("2d", {alpha:false});
const base = document.createElement("canvas");
let baseReady = false;

/* HOME is the whole selection framed; CAM is where the viewer has moved to.
   Both are held as a centre plus a longitude span, so the aspect correction
   is applied in one place. */
let HOME = null, CAM = null, BOX = null;
const MAX_ZOOM = 400;   /* a 100 m-wide view of a 40 km range */

/* Equirectangular, with the longitude axis squeezed by cos(lat) so the delta
   keeps its shape at this latitude. */
function boxOf(cam){
  const spanLat = cam.spanLon * kLat / (W / H);
  return {lon0: cam.lonC - cam.spanLon/2, lon1: cam.lonC + cam.spanLon/2,
          lat0: cam.latC - spanLat/2,     lat1: cam.latC + spanLat/2};
}
const px = lon => (lon - BOX.lon0) / (BOX.lon1 - BOX.lon0) * W;
const py = lat => (1 - (lat - BOX.lat0) / (BOX.lat1 - BOX.lat0)) * H;
const lonAt = sx => BOX.lon0 + (sx / W) * (BOX.lon1 - BOX.lon0);
const latAt = sy => BOX.lat1 - (sy / H) * (BOX.lat1 - BOX.lat0);
const zoomLevel = () => HOME ? HOME.spanLon / CAM.spanLon : 1;

function fitHome(keepCam){
  if (!BOUNDS) return;
  const midLat = (BOUNDS.lat0 + BOUNDS.lat1) / 2;
  kLat = Math.cos(midLat * Math.PI / 180);
  const dataLon = (BOUNDS.lon1 - BOUNDS.lon0) || 0.01;
  const dataLat = (BOUNDS.lat1 - BOUNDS.lat0) || 0.01;
  const pad = 1.08;
  /* Whichever axis is tighter against the canvas decides the span. */
  const spanLon = Math.max(dataLon * pad,
                           (dataLat * pad) * (W / H) / kLat);
  HOME = {lonC:(BOUNDS.lon0 + BOUNDS.lon1)/2, latC:midLat, spanLon};
  if (!CAM || !keepCam) CAM = Object.assign({}, HOME);
  clampCam();
  BOX = boxOf(CAM);
  baseReady = false;
}

/* Slack beyond the data's own frame, in fractions of the current view. The
   panels sit over the map, so at full extent there has to be room to nudge the
   delta out from under the legend -- with no slack the camera is pinned and a
   drag does nothing. */
const PAN_SLACK = 0.45;

function clampCam(){
  if (!HOME) return;
  CAM.spanLon = Math.min(HOME.spanLon,
                         Math.max(HOME.spanLon / MAX_ZOOM, CAM.spanLon));
  const spanLat = CAM.spanLon * kLat / (W / H);
  const homeLat = HOME.spanLon * kLat / (W / H);
  const halfLon = Math.max(0, (HOME.spanLon - CAM.spanLon) / 2)
                + CAM.spanLon * PAN_SLACK;
  const halfLat = Math.max(0, (homeLat - spanLat) / 2)
                + spanLat * PAN_SLACK;
  CAM.lonC = Math.min(HOME.lonC + halfLon, Math.max(HOME.lonC - halfLon, CAM.lonC));
  CAM.latC = Math.min(HOME.latC + halfLat, Math.max(HOME.latC - halfLat, CAM.latC));
  BOX = boxOf(CAM);
}

/* Redrawing the fix layer costs real milliseconds at full extent, and at full
   extent the camera is clamped so a drag moves nothing. Invalidate only when
   the camera actually changed. */
function commitCam(before){
  const moved = CAM.lonC !== before.lonC || CAM.latC !== before.latC
             || CAM.spanLon !== before.spanLon;
  if (moved) baseReady = false;
  return moved;
}

function zoomAround(sx, sy, factor){
  if (!CAM) return;
  const before = Object.assign({}, CAM);
  const lon = lonAt(sx), lat = latAt(sy);
  CAM.spanLon = CAM.spanLon / factor;
  clampCam();
  /* Put the point that was under the pointer back under the pointer. */
  const spanLat = CAM.spanLon * kLat / (W / H);
  CAM.lonC = lon - (sx / W - 0.5) * CAM.spanLon;
  CAM.latC = lat + (sy / H - 0.5) * spanLat;
  clampCam();
  commitCam(before);
  updateZoomUI();
}

function panBy(dx, dy){
  if (!CAM) return;
  const before = Object.assign({}, CAM);
  CAM.lonC -= (dx / W) * (BOX.lon1 - BOX.lon0);
  CAM.latC += (dy / H) * (BOX.lat1 - BOX.lat0);
  clampCam();
  commitCam(before);
}

function resetView(){
  if (!HOME) return;
  CAM = Object.assign({}, HOME);
  clampCam();
  baseReady = false;
  updateZoomUI();
}

function updateZoomUI(){
  const el = document.getElementById("zoomlv");
  if (el) el.textContent = zoomLevel() < 1.05 ? "fit" : zoomLevel().toFixed(1) + "×";
  const rb = document.getElementById("resetview");
  if (rb) rb.disabled = zoomLevel() < 1.05;
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  map.width = Math.round(W*DPR); map.height = Math.round(H*DPR);
  map.style.width = W+"px"; map.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  base.width = map.width; base.height = map.height;
  fitHome(true);
}

/* ------------------------------------------------------------- base layer */

/* Only the animals move on this map. The base carries the chosen landscape
   layer and nothing else -- no cloud of past fixes, so a dot on screen is an
   animal at that hour rather than a smear of everywhere it ever stood. */
function renderBase(){
  const b = base.getContext("2d");
  b.setTransform(DPR,0,0,DPR,0,0);
  b.fillStyle = pick("bg-bot");
  b.fillRect(0,0,W,H);
  if (!BOUNDS){ baseReady = true; return; }

  if (sel.imagery) drawTiles(b);
  if (sel.layer === "dog" || sel.layer === "lion") drawRisk(b);
  else if (sel.layer === "seasonal") drawSeasonal(b);

  drawScale(b);
  baseReady = true;
}

/* ---------------------------------------------------------- satellite tiles

   The only real picture of this landscape available anywhere is imagery, and
   it has to come from a tile server at view time -- nothing is bundled. Tiles
   are Web Mercator while this map is equirectangular, so rather than reproject
   the whole page each tile is drawn into the rectangle its own corners project
   to. Within one tile the difference is far below a pixel.

   A host that forbids outbound requests (the standalone build runs under one)
   simply gets no tiles: the loads fail, the dark ground stays, and the page
   says so rather than looking broken. */
const TILES = {
  url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  attribution: "Imagery © Esri, Maxar, Earthstar Geographics",
  maxZ: 18,
  cap: 500,                       /* tiles held before the oldest are dropped */
};
const tileCache = new Map();
let tileFails = 0, tileLoads = 0;

const lonToX = (lon, n) => (lon + 180) / 360 * n;
const latToY = (lat, n) => {
  const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * n;
};
const xToLon = (x, n) => x / n * 360 - 180;
const yToLat = (y, n) => Math.atan(Math.sinh(Math.PI * (1 - 2*y/n))) * 180 / Math.PI;

function drawTiles(b){
  /* Choose the zoom whose tiles land nearest 256 screen pixels. */
  const worldPx = W * 360 / (BOX.lon1 - BOX.lon0);
  const z = Math.max(0, Math.min(TILES.maxZ, Math.round(Math.log2(worldPx / 256))));
  const n = 2 ** z;
  const x0 = Math.floor(lonToX(BOX.lon0, n)), x1 = Math.ceil(lonToX(BOX.lon1, n));
  const y0 = Math.floor(latToY(BOX.lat1, n)), y1 = Math.ceil(latToY(BOX.lat0, n));

  for (let ty = Math.max(0, y0); ty < Math.min(n, y1); ty++){
    for (let tx = Math.max(0, x0); tx < Math.min(n, x1); tx++){
      const key = `${z}/${tx}/${ty}`;
      let img = tileCache.get(key);
      if (img === undefined){
        img = new Image();
        /* No crossOrigin: the canvas is never read back, and requesting CORS
           would fail the load outright on servers that do not send it. */
        img.onload  = () => { tileLoads++; baseReady = false; };
        img.onerror = () => { tileFails++; tileCache.set(key, null); updateAttrib(); };
        img.src = TILES.url.replace("{z}", z).replace("{x}", tx).replace("{y}", ty);
        tileCache.set(key, img);
        if (tileCache.size > TILES.cap){
          tileCache.delete(tileCache.keys().next().value);
        }
      }
      if (!img || !img.complete || !img.naturalWidth) continue;
      const dx = px(xToLon(tx, n)), dy = py(yToLat(ty, n));
      b.drawImage(img, dx, dy,
                  px(xToLon(tx+1, n)) - dx, py(yToLat(ty+1, n)) - dy);
    }
  }
}

function updateAttrib(){
  const el = document.getElementById("attrib");
  if (!el) return;
  if (!sel.imagery){ el.hidden = true; return; }
  el.hidden = false;
  el.textContent = (tileLoads === 0 && tileFails > 0)
    ? "satellite imagery unavailable on this host"
    : TILES.attribution;
}

/* Dry-versus-rainy occupancy for the animals collared in both seasons. In the
   Okavango the flood arrives in the dry season, so this traces the flood-driven
   structure of the range -- as animal behaviour, not as mapped water. */
const seasonalCv = document.createElement("canvas");
function drawSeasonal(b){
  if (!SEASONAL) return;
  const {nx, ny, cells} = SEASONAL;
  if (seasonalCv.width !== nx || seasonalCv.height !== ny){
    seasonalCv.width = nx; seasonalCv.height = ny;
  }
  const sc = seasonalCv.getContext("2d");
  const img = sc.createImageData(nx, ny);
  const dryCol = hexRGB(pick("dry-bias")), wetCol = hexRGB(pick("rainy-bias"));
  for (let iy = 0; iy < ny; iy++){
    for (let ix = 0; ix < nx; ix++){
      const v = cells[iy*nx + ix];
      const o = ((ny-1-iy)*nx + ix) * 4;
      if (!v){ img.data[o+3] = 0; continue; }
      const col = v > 0 ? dryCol : wetCol;
      img.data[o] = col[0]; img.data[o+1] = col[1]; img.data[o+2] = col[2];
      img.data[o+3] = Math.round(Math.min(1, Math.abs(v)/100) * 165);
    }
  }
  sc.putImageData(img, 0, 0);
  const R = SEASONAL.bounds;
  b.save();
  b.imageSmoothingEnabled = true;
  b.globalAlpha = 0.9;
  b.drawImage(seasonalCv, px(R.lon0), py(R.lat1),
              px(R.lon1) - px(R.lon0), py(R.lat0) - py(R.lat1));
  b.restore();
}

let riskCv = document.createElement("canvas");
function drawRisk(b){
  const state = riskState();
  const surf = RISK.surfaces[sel.layer + "-" + state];
  if (!surf) return;
  const {nx, ny} = RISK;
  if (riskCv.width !== nx || riskCv.height !== ny){ riskCv.width = nx; riskCv.height = ny; }
  const rc = riskCv.getContext("2d");
  const img = rc.createImageData(nx, ny);
  const col = hexRGB(pick(sel.layer));
  for (let iy = 0; iy < ny; iy++){
    for (let ix = 0; ix < nx; ix++){
      const v = surf.cells[iy*nx + ix];
      /* rows run south to north in the grid, top to bottom on screen */
      const o = ((ny-1-iy)*nx + ix) * 4;
      img.data[o] = col[0]; img.data[o+1] = col[1]; img.data[o+2] = col[2];
      img.data[o+3] = Math.round(Math.pow(v/255, 0.75) * 150);
    }
  }
  rc.putImageData(img, 0, 0);

  const R = RISK.bounds;
  const x0 = px(R.lon0), x1 = px(R.lon1), y0 = py(R.lat1), y1 = py(R.lat0);
  b.save();
  b.imageSmoothingEnabled = true;
  b.globalAlpha = 0.85;
  b.drawImage(riskCv, x0, y0, x1-x0, y1-y0);
  b.restore();
}

function drawScale(b){
  if (!BOX) return;
  /* A round-numbered bar, re-chosen as the view zooms so it always spans a
     usable fraction of the canvas. */
  const pxPerKm = H / ((BOX.lat1 - BOX.lat0) * 110.574);
  let km = 10;
  for (const cand of [50, 20, 10, 5, 2, 1, 0.5, 0.2, 0.1]){
    km = cand;
    if (cand * pxPerKm <= W * 0.28) break;
  }
  const len = pxPerKm * km;
  if (!isFinite(len) || len < 20) return;
  const label = km >= 1 ? `${km} km` : `${km*1000} m`;
  const x = W - len - 26, y = H - 30;
  b.strokeStyle = pick("ink-3"); b.lineWidth = 1;
  b.beginPath(); b.moveTo(x, y); b.lineTo(x+len, y);
  b.moveTo(x, y-3); b.lineTo(x, y+3); b.moveTo(x+len, y-3); b.lineTo(x+len, y+3);
  b.stroke();
  b.fillStyle = pick("ink-3");
  b.font = '300 10px "IBM Plex Mono",monospace';
  b.textAlign = "center";
  b.fillText(label, x + len/2, y - 7);
  b.textAlign = "left";
}

/* --------------------------------------------------------------- playback */

let simH = 0;                  /* hours since the clock's zero */
let hoursPerSecond = 6;
let playing = true;
let lastFrame = performance.now();

const hourOfDay = () => ((Math.floor(simH) % 24) + 24) % 24;
const riskState = () => {
  const h = hourOfDay();
  return (sel.layer === "dog" ? dogActive(h) : lionActive(h)) ? "high" : "low";
};

/* Where this collar is in its own repeating record. The period is a whole
   number of days, so the hour-of-day this returns always equals the clock's. */
const localH = (t, h) => ((h % t.period) + t.period) % t.period;

/* Position at a fractional hour, or null inside a gap / outside the track. */
function posAt(t, h){
  if (h < t.t0 || h > t.t1) return null;
  const times = t.times;
  let lo = 0, hi = t.n - 1;
  while (lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if (times[mid] <= h) lo = mid; else hi = mid - 1;
  }
  if (lo === t.n - 1) return [px(t.lons[lo]), py(t.lats[lo]), lo];
  const ta = times[lo], tb = times[lo+1];
  if (tb - ta > 1 || t.brk[lo+1]) return null;   /* inside a gap: draw nothing */
  const f = (h - ta) / (tb - ta);
  return [px(t.lons[lo] + (t.lons[lo+1]-t.lons[lo])*f),
          py(t.lats[lo] + (t.lats[lo+1]-t.lats[lo])*f), lo];
}

const DOT_R = 2.1;
const TRAIL_STEPS = 8;
const TRAIL_HOURS = 10;

function draw(){
  if (!baseReady) renderBase();
  ctx.drawImage(base, 0, 0, W, H);
  if (!BOUNDS) return;

  const h = hourOfDay();
  const dogOn = dogActive(h), lionOn = lionActive(h);

  const z = Math.min(3, Math.sqrt(zoomLevel()));   /* marks grow, but sublinearly */
  for (const t of TRACKS){
    const head = posAt(t, localH(t, simH));
    if (!head) continue;
    const col = hexRGB(pick(SPECIES[t.species].role));

    /* comet trail, sampled backwards along the track */
    let cx = head[0], cy = head[1];
    for (let k = 1; k <= TRAIL_STEPS; k++){
      const back = posAt(t, localH(t, simH - (TRAIL_HOURS/TRAIL_STEPS)*k));
      if (!back) break;
      const a = (1 - k/TRAIL_STEPS) * 0.55;
      if (a <= 0.02) break;
      ctx.beginPath();
      ctx.moveTo(cx, cy); ctx.lineTo(back[0], back[1]);
      ctx.strokeStyle = rgba(col, a);
      ctx.lineWidth = Math.max(1/DPR, 2.4 * z * (1 - k/(TRAIL_STEPS+3)));
      ctx.lineCap = "round";
      ctx.stroke();
      cx = back[0]; cy = back[1];
    }

    /* halo + dot */
    ctx.beginPath(); ctx.arc(head[0], head[1], 4.0*z, 0, 6.2832);
    ctx.fillStyle = rgba(col, 0.15); ctx.fill();
    ctx.beginPath(); ctx.arc(head[0], head[1], DOT_R*z, 0, 6.2832);
    ctx.fillStyle = rgba(col, 0.98); ctx.fill();

    /* Exposure ring: this animal is standing in the top decile of a
       predator's range while that predator is in its active window. */
    const i = head[2];
    const exposed = (dogOn && t.uiDog[i] >= t.th.dog) ? "dog"
                  : (lionOn && t.uiLion[i] >= t.th.lion) ? "lion" : null;
    if (exposed){
      const phase = (simH % 1);
      const r = (DOT_R + 2 + phase * 9) * z;
      ctx.beginPath(); ctx.arc(head[0], head[1], r, 0, 6.2832);
      ctx.strokeStyle = rgba(hexRGB(pick(exposed)), (1 - phase) * 0.55);
      ctx.lineWidth = Math.max(1/DPR, 1.2);
      ctx.stroke();
    }
  }
}

/* ------------------------------------------------------------------- chrome */

function buildLegend(){
  const rows = document.getElementById("legendRows");
  rows.innerHTML = "";
  const counts = new Map();
  for (const t of TRACKS){
    const c = counts.get(t.species) || {inds:0, fixes:0};
    c.inds += 1; c.fixes += t.n;
    counts.set(t.species, c);
  }
  for (const sp of SPECIES_ORDER){
    if (!counts.has(sp)) continue;
    const c = counts.get(sp);
    const el = document.createElement("div");
    el.className = "lg";
    el.innerHTML = `<span class="sw" style="background:${pick(SPECIES[sp].role)}"></span>`
      + `<span class="nm">${SPECIES[sp].label}</span>`
      + `<span class="ct">${c.inds} collars \u00b7 ${c.fixes.toLocaleString()} fixes</span>`;
    rows.appendChild(el);
  }
  /* When a landscape layer is on, say what its colours mean. */
  const key = {
    dog:  [["dog",  "Where wild dogs range, now"]],
    lion: [["lion", "Where lions range, now"]],
    seasonal: [["dry-bias",   "Used more in the dry season"],
               ["rainy-bias", "Used more in the rainy season"]],
  }[sel.layer];
  for (const [token, label] of key || []){
    const el = document.createElement("div");
    el.className = "lg";
    el.innerHTML = `<span class="sw" style="background:${pick(token)};opacity:0.75"></span>`
      + `<span class="nm" style="color:var(--ink-2)">${label}</span>`;
    rows.appendChild(el);
  }

  const days = Math.ceil(SPAN/24);
  document.getElementById("legendFoot").textContent = TRACKS.length
    ? `${sel.season === "dry" ? "Dry" : "Rainy"} season \u00b7 longest record ${days} days \u00b7 `
      + `each collar repeats its own record, aligned by time of day \u00b7 `
      + `rings mark an animal in the top decile of a predator's range while that predator is active.`
    : "No collars for this combination.";
}

/* The profile is the real thing the paper is about: how far these animals move
   in each hour of the day. */
const prof = document.getElementById("profcv");
const profBase = document.createElement("canvas");
let profW = 0, profH = 0;

function buildProfile(){
  const r = prof.parentElement.getBoundingClientRect();
  profW = Math.max(120, Math.round(r.width)); profH = Math.round(r.height);
  for (const cv of [prof, profBase]){
    cv.width = Math.round(profW*DPR); cv.height = Math.round(profH*DPR);
  }
  prof.style.width = profW+"px"; prof.style.height = profH+"px";

  const sums = new Float64Array(24), n = new Float64Array(24);
  for (const t of TRACKS){
    for (let i = 1; i < t.n; i++){
      if (t.times[i] - t.times[i-1] !== 1 || t.brk[i]) continue;
      const dLon = (t.lons[i]-t.lons[i-1]) * kLat * 111.32;
      const dLat = (t.lats[i]-t.lats[i-1]) * 110.574;
      const hh = ((t.times[i-1] % 24) + 24) % 24;
      sums[hh] += Math.hypot(dLon, dLat) * 1000; n[hh] += 1;
    }
  }
  const c = profBase.getContext("2d");
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,profW,profH);
  let peak = 1;
  for (let i=0;i<24;i++) if (n[i] && sums[i]/n[i] > peak) peak = sums[i]/n[i];

  const bw = profW/24;
  for (let i=0;i<24;i++){
    const v = n[i] ? sums[i]/n[i] : 0;
    const hgt = (v/peak) * (profH - 12);
    const dog = dogActive(i), lion = lionActive(i);
    c.fillStyle = dog ? rgba(hexRGB(pick("dog")), 0.55)
                : lion ? rgba(hexRGB(pick("lion")), 0.30)
                : rgba(hexRGB(pick("ink-3")), 0.34);
    c.fillRect(i*bw + 0.5, profH - 8 - hgt, bw - 1, hgt);
  }
  c.fillStyle = pick("ink-3");
  c.font = '300 8px "IBM Plex Mono",monospace';
  c.textAlign = "left";  c.fillText("00", 1, profH - 1);
  c.textAlign = "center";c.fillText("12", profW/2, profH - 1);
  c.textAlign = "right"; c.fillText("24", profW - 1, profH - 1);
  c.textAlign = "left";
  drawProfile();
}

function drawProfile(){
  if (!profW) return;
  const c = prof.getContext("2d");
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,profW,profH);
  c.drawImage(profBase, 0, 0, profW, profH);
  const x = (hourOfDay() + (simH % 1)) / 24 * profW;
  c.strokeStyle = pick("ink");
  c.lineWidth = 1;
  c.beginPath(); c.moveTo(x, 0); c.lineTo(x, profH - 9); c.stroke();
}

function updateClock(){
  const h = hourOfDay();
  const m = Math.floor((simH % 1) * 60);
  document.getElementById("clock").innerHTML =
    String(h).padStart(2,"0") + '<span class="mins">:' + String(m).padStart(2,"0") + '</span>';
  document.getElementById("day").textContent = "day " + (Math.floor(simH/24) + 1)
    + " of " + Math.max(1, Math.ceil(SPAN/24));
  document.getElementById("lampDog").dataset.on = dogActive(h);
  document.getElementById("lampLion").dataset.on = lionActive(h);
}

/* ------------------------------------------------------------------ loop */

function frame(now){
  const dt = Math.min(0.25, (now - lastFrame)/1000);
  lastFrame = now;
  if (playing && TRACKS.length){
    simH += dt * hoursPerSecond;
    if (simH >= SPAN) simH = 0;
    const s = document.getElementById("scrub");
    if (document.activeElement !== s) s.value = Math.round(simH/SPAN*1000);
  }
  draw();
  updateClock();
  drawProfile();
  requestAnimationFrame(frame);
}

/* --------------------------------------------------------------- controls */

function pillRow(rowId, items, isOn, onPick){
  const row = document.getElementById(rowId);
  for (const it of items){
    const b = document.createElement("button");
    b.textContent = it.label;
    b.dataset.key = it.key;
    b.setAttribute("aria-pressed", String(isOn(it.key)));
    b.addEventListener("click", async () => {
      await onPick(it.key);
      for (const btn of row.querySelectorAll("button"))
        btn.setAttribute("aria-pressed", String(isOn(btn.dataset.key)));
    });
    row.appendChild(b);
  }
}

function wireControls(){
  pillRow("spRow",
    SPECIES_ORDER.map(k => ({key:k, label:SPECIES[k].label})),
    k => sel.species.has(k) && SPECIES[k].seasons.includes(sel.season),
    async k => {
      if (!SPECIES[k].seasons.includes(sel.season)) return;
      if (sel.species.has(k)){ if (sel.species.size > 1) sel.species.delete(k); }
      else sel.species.add(k);
      await rebuild();
    });

  pillRow("seRow",
    [{key:"dry",label:"Dry"},{key:"rainy",label:"Rainy"}],
    k => sel.season === k,
    async k => { sel.season = k; simH = 0; await rebuild(); });

  pillRow("prRow",
    [{key:"none",label:"None"},{key:"dog",label:"Wild dog range"},
     {key:"lion",label:"Lion range"},{key:"seasonal",label:"Flood shift"}],
    k => sel.layer === k,
    async k => { sel.layer = k; baseReady = false; buildLegend(); });

  pillRow("imRow",
    [{key:"off",label:"Off"},{key:"sat",label:"Satellite"}],
    k => sel.imagery === (k === "sat"),
    async k => { sel.imagery = (k === "sat"); baseReady = false; updateAttrib(); });

  const play = document.getElementById("play");
  play.addEventListener("click", () => {
    playing = !playing;
    play.textContent = playing ? "Pause" : "Play";
    play.setAttribute("aria-pressed", String(playing));
  });

  const spd = document.getElementById("spd");
  for (const v of [3, 6, 12, 24]){
    const b = document.createElement("button");
    b.textContent = (v/6) + "\u00d7";
    b.setAttribute("aria-pressed", String(v === hoursPerSecond));
    b.addEventListener("click", () => {
      hoursPerSecond = v;
      for (const x of spd.querySelectorAll("button"))
        x.setAttribute("aria-pressed", String(x === b));
    });
    spd.appendChild(b);
  }

  const scrub = document.getElementById("scrub");
  scrub.addEventListener("input", () => { simH = scrub.value/1000 * SPAN; });

  const nb = document.getElementById("notesbtn"), notes = document.getElementById("notes");
  nb.addEventListener("click", () => {
    const open = notes.dataset.open !== "true";
    notes.dataset.open = String(open);
    nb.setAttribute("aria-expanded", String(open));
  });

  document.getElementById("resetview").addEventListener("click", resetView);

  const lt = document.getElementById("legendToggle");
  lt.addEventListener("click", () => {
    const open = lt.getAttribute("aria-expanded") !== "true";
    lt.setAttribute("aria-expanded", String(open));
    document.getElementById("legend").dataset.collapsed = String(!open);
  });

  addEventListener("resize", () => { resize(); buildProfile(); });
  addEventListener("keydown", e => {
    if (e.key === " "){ e.preventDefault(); play.click(); }
    else if (e.key === "0"){ resetView(); }
    else if (e.key === "+" || e.key === "="){ zoomAround(W/2, H/2, 1.4); }
    else if (e.key === "-"){ zoomAround(W/2, H/2, 1/1.4); }
  });

  wireMapGestures();
}

/* Wheel, drag and two-finger pinch, on one pointer-event path so a trackpad,
   a mouse and a touchscreen all behave the same. */
function wireMapGestures(){
  const pts = new Map();
  let pinch = null, panning = false, last = null;

  map.addEventListener("wheel", e => {
    e.preventDefault();
    const r = map.getBoundingClientRect();
    /* Trackpads report small deltas continuously, mice one large notch. */
    const step = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.002));
    zoomAround(e.clientX - r.left, e.clientY - r.top,
               Math.min(2.4, Math.max(1/2.4, step)));
  }, {passive:false});

  map.addEventListener("pointerdown", e => {
    map.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 2){
      const [a, b] = [...pts.values()];
      pinch = {d: Math.hypot(a.x-b.x, a.y-b.y),
               mx:(a.x+b.x)/2, my:(a.y+b.y)/2};
      panning = false;
    } else if (pts.size === 1){
      panning = true; last = {x:e.clientX, y:e.clientY};
      map.style.cursor = "grabbing";
    }
  });

  map.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if (pts.size === 2 && pinch){
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      const r = map.getBoundingClientRect();
      panBy(mx - pinch.mx, my - pinch.my);
      if (pinch.d > 0) zoomAround(mx - r.left, my - r.top, d / pinch.d);
      pinch = {d, mx, my};
    } else if (panning && last){
      panBy(e.clientX - last.x, e.clientY - last.y);
      last = {x:e.clientX, y:e.clientY};
    }
  });

  const release = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0){ panning = false; last = null; map.style.cursor = ""; }
    else if (pts.size === 1){ panning = true; last = [...pts.values()][0]; }
    updateZoomUI();
  };
  map.addEventListener("pointerup", release);
  map.addEventListener("pointercancel", release);
  map.addEventListener("dblclick", e => {
    const r = map.getBoundingClientRect();
    zoomAround(e.clientX - r.left, e.clientY - r.top, 2);
  });
}

function buildNotes(){
  document.getElementById("notesBody").innerHTML = `
    <p>Every position on this map is a real GPS fix. The animation between
    fixes is straight-line interpolation across one hour.</p>

    <h3>How the tracks were recovered</h3>
    <p>The Dryad deposit ships analysis tables, not raw collar downloads. The
    coordinates live in the resource-selection tables, sorted by predator
    activity state; the chronological order lives in a second set of tables that
    carry hour-of-day but no coordinates. Because predator activity is a
    function of hour-of-day, that sort is invertible, and walking the hour
    sequence recovers the original track.</p>
    <p class="sub">Every reconstruction is scored against the authors' own
    step-length column: all seven species-seasons reproduce it at 98.8&ndash;100%
    within 40 m, median error 5&ndash;7 m. Individuals where the two tables
    disagree about a fix are left out rather than shown unverified.</p>

    <h3>The landscape layers</h3>
    <p><strong>Satellite</strong> is the only real picture of this landscape
    available: Esri World Imagery, fetched as tiles when you switch it on.
    Nothing is bundled with the page, so it needs a working connection &mdash;
    on a host that forbids outbound requests the tiles simply do not arrive, the
    dark ground stays, and the attribution line says so. Tiles are Web Mercator
    while this map is equirectangular, so each is drawn into the rectangle its
    own corners project to; within one tile the difference is far below a pixel.
    The imagery is a mosaic of different dates and does not correspond to
    2014&ndash;2016, and in a delta that floods annually the water you see is not
    the water these animals walked around.</p>
    <p><strong>No vegetation or water map.</strong> The deposit gives vegetation
    only as aggregate proportions per animal &mdash; floodplain, grassland,
    mixed, mopane &mdash; never mapped, and the 25 m habitat raster behind the
    original analysis was not deposited. Public vector data does not fill the
    gap: at 1:10m scale the entire Okavango is a single river centreline, which
    says nothing across 70 km. So there is no basemap here, and none of these
    layers is one.</p>
    <p><strong>Flood shift</strong> is the closest honest substitute: dry-versus-rainy
    occupancy for the ten animals collared in <em>both</em> seasons (four
    tsessebe, four zebra, two wildebeest; 68,926 fixes). Restricting it to
    animals present in both seasons is what makes it a seasonal comparison
    rather than a comparison of who happened to be wearing a collar. In the
    Okavango the flood arrives during the dry season, so the contrast traces the
    flood-driven structure of the range &mdash; but it is a map of where animals
    went, not of where water is.</p>
    <p class="sub"><strong>Wild dog range</strong> and <strong>Lion range</strong>
    are the predator utilisation surfaces, switching between the predator's
    active and inactive state as the clock crosses its hunting window.</p>

    <h3>What is missing</h3>
    <p><strong>No calendar dates.</strong> The deposit records hour-of-day but
    never a date, so the clock is real and the day counter is only elapsed time
    from each collar's first fix. Animals are aligned by time of day, not by
    date &mdash; two dots side by side were not necessarily there in the same
    week.</p>
    <p><strong>Each collar repeats its own record.</strong> The collars ran for
    very different lengths, from 35 days to 200, and played once through they
    drop away one by one until a couple of animals are moving over everyone
    else's fixes. Each therefore loops, on a period rounded up to whole days so
    that every animal's hour-of-day still matches the clock exactly. The cost is
    that elapsed days are no longer comparable between animals once the shorter
    records come round again.</p>
    <p><strong>The predators are in the data, but not as positions.</strong> Ten
    were collared alongside the herbivores &mdash; six lions (Buzz, Chloe, F3,
    F8, Hector, Pride) and four wild dogs (Adiga, Bali, Bongwe, Xerxes), each
    with habitat selection measured in both seasons. What the deposit carries of
    them is their <em>utilisation surface</em>, evaluated at every prey location,
    together with their activity windows; the range layers and the lamps under
    the clock are both built from it. What it does not carry is a single
    predator coordinate or timestamp, so they cannot be drawn moving. A ring
    means an animal sits in the top decile of a predator's range while that
    predator is active &mdash; real exposure, not an observed encounter.</p>
    <p><strong>Positions are quantised.</strong> Coordinates are snapped to the
    25 m habitat raster used in the original analysis, so fine-scale detail is
    not real detail.</p>
    <p><strong>Gaps are drawn as absence.</strong> Where the collar missed
    hours the animal is simply not drawn. Gap length is taken as the shortest
    span consistent with the hours on either side, so long absences are
    understated.</p>

    <h3>Source</h3>
    <p class="sub">Bennitt, E. et al. (2024). <em>Proactive cursorial and ambush
    predation risk avoidance in four African herbivore species.</em> Ecology and
    Evolution. Data: <code>doi:10.5061/dryad.w0vt4b8zr</code>. Collared in the
    Okavango Delta, Botswana, 2014&ndash;2016.</p>`;
}

/* ------------------------------------------------------------------- boot */

(async function boot(){
  try {
    buildNotes();
    wireControls();
    RISK = await loadJSON("predator-risk").catch(() => null);
    SEASONAL = await loadJSON("seasonal-shift").catch(() => null);
    await rebuild();
    document.getElementById("loading").hidden = true;
    lastFrame = performance.now();
    requestAnimationFrame(frame);
  } catch (err){
    document.getElementById("loading").textContent =
      "could not load tracks \u2014 this page needs http(s), not file://";
    console.error(err);
  }
})();
</script>
</body>
</html>
