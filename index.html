<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Where the storks went</title>
<meta name="description" content="Seventy-two white storks from nine populations, tracked hourly from the Baltic to the Cape, on one calendar clock — and the two narrow places they cross the Mediterranean.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<style>
  /* Like the rail maps, this page ignores the viewer's light/dark preference:
     it is a night map at every hour, so the animals stay the brightest thing
     on it. */
  :root{
    --bg-bot:#0a1018;
    --ink:#e9eff7; --ink-2:#a7b3c4; --ink-3:#78859a;
    --rule:rgba(39,51,63,0.7); --panel:rgba(13,20,30,0.82);
    /* Nine tagging sites, running west to east as warm to cool. The gradient
       is the point: when the tracks fan out around the Mediterranean, their
       colour already says which end of Europe each bird came from. */
    --p-spain:#ffc247; --p-germany:#ff8a3d; --p-tunisia:#ff5470;
    --p-poland:#e070ff; --p-greece:#8f7dff; --p-russia:#3fa9ff;
    --p-armenia:#2ee0b8;
    /* The second deposit is one site, so its birds are told apart by age, not
       by where they hatched. Orange against blue is the pair that survives
       colour vision deficiency, and it sits clear of the origin gradient. */
    --age-juv:#ff6a3d; --age-adult:#4dd2ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg-bot);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-weight:300;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden}
  /* The map owns every gesture on it: there is nothing to scroll past. */
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;
       touch-action:none;cursor:grab}
  #resetview{min-width:56px;font-family:"IBM Plex Mono",monospace;font-size:0.72rem}
  #resetview:disabled{opacity:0.45;cursor:default}

  /* ---- pickers --------------------------------------------------------- */
  #picks{position:fixed;z-index:6;left:14px;top:14px;display:flex;flex-direction:column;gap:6px;max-width:calc(100vw - 40px)}
  .row{display:flex;gap:4px;flex-wrap:wrap}
  .row button{
    padding:4px 10px;font-size:0.72rem;border:1px solid transparent;
    color:var(--ink-3);background:transparent;border-radius:6px;cursor:pointer;
    font:inherit;font-size:0.72rem;
  }
  .row button[aria-pressed="true"]{color:var(--ink);border-color:var(--rule)}
  /* One row set per view. The two deposits are different studies, so the
     filters that make sense for one are meaningless for the other. */
  body[data-view="ages"] #spRow,
  body[data-view="ages"] #seRow,
  body:not([data-view="ages"]) #agRow{display:none}
  /* A population with no birds says so rather than sitting lit with nothing
     behind it. */
  .row button[data-unavailable="true"]{opacity:0.3;cursor:not-allowed}
  .row button[data-unavailable="true"]::after{content:" \2014";letter-spacing:0.1em}
  .row .lab{
    font-size:0.6rem;letter-spacing:0.16em;text-transform:uppercase;
    color:var(--ink-3);align-self:center;padding-right:4px;min-width:52px;
  }

  /* ---- clock ----------------------------------------------------------- */
  /* Down the left margin rather than across the middle: the flyways run up the
     centre of this map and a date sitting on them is a date in the way. */
  /* The header sits under the pick panel, which is one row taller in the view
     that still has an origin filter to show. */
  body{--picks-h:180px}
  body[data-view="ages"]{--picks-h:150px}
  header{
    position:absolute;z-index:3;left:14px;top:var(--picks-h);
    text-align:left;pointer-events:none;white-space:nowrap;
    text-shadow:0 0 16px var(--bg-bot), 0 0 8px var(--bg-bot), 0 0 3px var(--bg-bot);
  }
  #clock{
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:300;
    font-size:clamp(1.5rem,3.2vw,2.1rem);line-height:1;letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;color:var(--ink);
  }
  #clock .mins{opacity:0.6}
  #day{margin-top:2px;font-size:0.68rem;letter-spacing:0.06em;color:var(--ink-3);
       font-family:"IBM Plex Mono",monospace;}

  /* ---- panels ---------------------------------------------------------- */
  .panel{
    background:var(--panel);border:1px solid var(--rule);border-radius:10px;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  }
  #legend{position:fixed;z-index:3;left:20px;bottom:20px;padding:9px 12px 8px;min-width:196px;max-width:300px}
  #notes h2{
    font-size:0.62rem;letter-spacing:0.17em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;margin-bottom:9px;
  }
  /* The legend folds away: on a wide screen it sits over the map, and at full
     extent there is no room to pan the map out from under it. */
  #legendToggle{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;padding:0;border:0;background:none;
    font-size:0.56rem;letter-spacing:0.16em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;
  }
  #legendToggle:hover{color:var(--ink-2);background:none}
  #legendToggle .chev::before{content:"\2013"}          /* en dash */
  #legendToggle[aria-expanded="false"] .chev::before{content:"+"}
  #legendBody{margin-top:6px}
  #legendToggle[aria-expanded="false"] + #legendBody{display:none}
  #legend[data-collapsed="true"]{min-width:0}
  .lg{display:flex;align-items:center;gap:7px;padding:1px 0;font-size:0.74rem;line-height:1.35}
  .sw{border-radius:50%;flex:0 0 auto;width:7px;height:7px;box-shadow:0 0 0 2px var(--panel)}
  .lg .nm{flex:1 1 auto;color:var(--ink)}
  .lg .ct{font-family:"IBM Plex Mono",monospace;font-size:0.68rem;color:var(--ink-3);
          font-variant-numeric:tabular-nums}
  #legend footer{margin-top:6px;padding-top:6px;border-top:1px solid var(--rule);
                 font-size:0.6rem;line-height:1.4;color:var(--ink-3)}

  #controls{position:fixed;z-index:3;right:20px;bottom:20px;padding:11px 14px;
            display:flex;align-items:center;gap:12px}
  button{
    font:inherit;font-size:0.78rem;color:var(--ink);background:transparent;
    border:1px solid var(--rule);border-radius:6px;padding:5px 11px;cursor:pointer;
    transition:background 0.15s,border-color 0.15s;
  }
  button:hover{background:rgba(128,128,128,0.13)}
  button[aria-pressed="true"]{border-color:currentColor}
  #play{min-width:64px}
  .spd{display:flex;gap:5px}
  .spd button{padding:5px 8px;font-family:"IBM Plex Mono",monospace;font-size:0.72rem}
  /* The scrubber is a transparent range input over the diel profile, so
     pointer, touch and keyboard seeking all stay native. */
  #profile{position:relative;width:268px;height:44px}
  #profcv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #scrub{position:absolute;inset:0;margin:0;width:100%;height:100%;
         -webkit-appearance:none;appearance:none;background:transparent;outline:none;cursor:pointer}
  #scrub::-webkit-slider-runnable-track{background:transparent;height:100%}
  #scrub::-moz-range-track{background:transparent;height:100%}
  #scrub::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:44px;border-radius:1px;
                               background:var(--ink);cursor:pointer}
  #scrub::-moz-range-thumb{width:3px;height:44px;border:0;border-radius:1px;background:var(--ink);cursor:pointer}
  #scrub:focus-visible{outline:1px solid var(--ink-3);outline-offset:2px}

  #meta{position:absolute;z-index:3;left:14px;top:212px;max-width:252px;
        font-size:0.68rem;line-height:1.5;color:var(--ink-3);
        background:rgba(5,8,14,.62);padding:9px 12px;border-radius:8px}
  #meta strong{color:var(--ink-2);font-weight:500}
  #notesbtn{position:fixed;z-index:4;right:20px;top:20px}
  /* Two more pages, not two more layers: the globe follows one bird at a
     time and turns under it, which a flat map cannot do, and the daylight
     page draws the calendar all of them are running on. */
  #pagelinks{position:fixed;z-index:4;right:150px;top:20px;display:flex;gap:6px}
  #pagelinks a{
    font-size:0.68rem;color:var(--ink-3);text-decoration:none;
    border:1px solid var(--rule);border-radius:6px;padding:5px 11px;
    background:rgba(5,8,14,.62);white-space:nowrap;
  }
  #pagelinks a:hover{color:var(--ink)}
  body[data-bare="true"] #pagelinks{display:none}
  #notes{position:fixed;z-index:3;right:20px;top:60px;padding:14px 16px;max-width:352px;
         display:none;max-height:calc(100vh - 160px);overflow-y:auto}
  #notes[data-open="true"]{display:block}
  #notes p{font-size:0.72rem;line-height:1.55;color:var(--ink-2);margin-bottom:9px}
  #notes p.sub{color:var(--ink-3);font-size:0.68rem}
  #notes code{font-family:"IBM Plex Mono",monospace;font-size:0.68rem;color:var(--ink)}
  #notes h3{font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;
            color:var(--ink-3);font-weight:500;margin:13px 0 6px}

  /* Imagery attribution, required whenever a tile layer is on. */
  #attrib{
    position:fixed;z-index:4;right:20px;bottom:96px;
    font-size:0.6rem;letter-spacing:0.02em;color:var(--ink-3);
    background:rgba(5,8,14,.66);padding:3px 7px;border-radius:5px;
    pointer-events:none;
  }
  #attrib[hidden]{display:none}

  /* Everything a viewer can click is noise in a recording, so the video export
     turns it off and keeps the date, the key and the attribution. */
  body[data-bare="true"] #picks,
  body[data-bare="true"] #controls,
  body[data-bare="true"] #notesbtn,
  body[data-bare="true"] #notes,
  body[data-bare="true"] #meta{display:none}
  body[data-bare="true"] header{top:20px}
  body[data-bare="true"] #legend{bottom:20px;left:20px}
  body[data-bare="true"] #clock{font-size:clamp(1.6rem,4.4vw,2.4rem)}

  #loading{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
           background:var(--bg-bot);font-family:"IBM Plex Mono",monospace;font-size:0.8rem;
           color:var(--ink-3);letter-spacing:0.08em}
  #loading[hidden]{display:none}

  /* --- narrow screens ---------------------------------------------------
     Seven origins and five crossings will not fit across a phone, and wrapping
     them costs four more rows of height that the map needs. Each row scrolls
     sideways instead, with its label pinned at the left edge so you can still
     tell which row you are dragging. */
  @media (max-width:820px){
    #picks{
      left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));
      gap:2px;padding:5px 6px;max-width:none;
      background:var(--panel);border:1px solid var(--rule);border-radius:9px;
      backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    }
    .row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
    .row::-webkit-scrollbar{display:none}
    .row button{flex:0 0 auto;padding:5px 9px;font-size:0.68rem}
    .row .lab{
      position:sticky;left:0;z-index:1;min-width:0;padding:0 6px 0 0;
      background:linear-gradient(90deg,var(--panel) 74%,transparent);
      font-size:0.52rem;letter-spacing:0.12em;
    }
    body{--picks-h:152px}
    body[data-view="ages"]{--picks-h:128px}
    header{top:calc(var(--picks-h) + env(safe-area-inset-top,0px))}
    #clock{font-size:clamp(1.4rem,7vw,2rem)}
    #day{font-size:0.6rem}
    #meta{display:none}
    #notesbtn{top:calc(8px + env(safe-area-inset-top,0px));right:auto;left:8px;display:none}
    #pagelinks{top:auto;right:8px;
               bottom:calc(80px + env(safe-area-inset-bottom,0px))}
    #pagelinks a{font-size:0.6rem;padding:4px 8px}
    #notes{left:8px;right:8px;top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));
           max-width:none;max-height:52vh}
    /* Collapsed by default here: the map is the scarce thing on a phone. */
    /* The legend and the attribution share the strip above the controls, so
       they are given the two halves of it rather than the same corner. */
    #legend{left:8px;right:auto;bottom:calc(78px + env(safe-area-inset-bottom,0px));
            max-width:58vw;min-width:0;padding:7px 10px 6px}
    #controls{left:8px;right:8px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
              justify-content:space-between;gap:7px;padding:8px 10px}
    #profile{width:auto;flex:1 1 auto;height:38px}
    #scrub::-webkit-slider-thumb{height:38px}
    #scrub::-moz-range-thumb{height:38px}
    #play{min-width:56px;font-size:0.72rem;padding:6px 9px}
    /* Above the controls, not under the clock: the header is the one thing on a
       phone that has nowhere else to go. */
    #attrib{top:auto;bottom:calc(80px + env(safe-area-inset-bottom,0px));
            left:auto;right:8px;max-width:38vw;font-size:0.5rem;text-align:right}
  }
  /* Under this the speed buttons are the first thing worth losing. */
  @media (max-width:520px){
    .spd{display:none}
    #resetview{min-width:44px}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="map"></canvas>

  <div id="picks">
    <div class="row" id="vwRow"><span class="lab">View</span></div>
    <div class="row" id="spRow"><span class="lab">Origin</span></div>
    <div class="row" id="seRow"><span class="lab">Crossing</span></div>
    <div class="row" id="agRow"><span class="lab">Age</span></div>
    <div class="row" id="prRow"><span class="lab">Layer</span></div>
    <div class="row" id="imRow"><span class="lab">Ground</span></div>
  </div>

  <header>
    <div id="clock">1 Aug 2013</div>
    <div id="day">day 1</div>
  </header>

  <div id="meta"></div>

  <div id="pagelinks">
    <a href="daylight.html">Daylight &rarr;</a>
    <a href="globe.html">Globe &rarr;</a>
  </div>
  <button id="notesbtn" aria-expanded="false">Data notes &amp; gaps</button>
  <div id="notes" class="panel"><h2>Data notes &amp; gaps</h2><div id="notesBody"></div></div>

  <div id="legend" class="panel">
    <button id="legendToggle" aria-expanded="true" aria-controls="legendBody">
      On screen<span class="chev" aria-hidden="true"></span>
    </button>
    <div id="legendBody">
      <div id="legendRows"></div>
      <footer id="legendFoot"></footer>
    </div>
  </div>

  <div id="controls" class="panel">
    <button id="play" aria-pressed="true">Pause</button>
    <div class="spd" id="spd"></div>
    <button id="resetview" title="Reset the view (0)" disabled>
      <span id="zoomlv">fit</span>
    </button>
    <div id="profile"><canvas id="profcv"></canvas><input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek"></div>
  </div>
</div>

<div id="attrib" hidden></div>
<div id="loading">loading tracks&hellip;</div>

<script>
"use strict";

/* ------------------------------------------------------------------ model */

/* Nine tagging sites, ordered west to east and coloured as a gradient, so the
   fan of tracks reads as the geography that produced it rather than as nine
   arbitrary hues. */
const POPS = {
  Spain:         {label:"Spain",        role:"p-spain"},
  Germany:       {label:"Germany",      role:"p-germany"},
  Tunisia:       {label:"Tunisia",      role:"p-tunisia"},
  Poland:        {label:"Poland",       role:"p-poland"},
  Greece:        {label:"Greece",       role:"p-greece"},
  Russia:        {label:"Russia",       role:"p-russia"},
  Armenia:       {label:"Armenia",      role:"p-armenia"},
};
const POP_ORDER = ["Spain","Germany","Tunisia","Poland","Greece","Russia","Armenia"];

/* Where a bird first crossed 36 N, which is the choice that defines its
   journey: storks soar, thermals do not form over open water, so the
   Mediterranean is crossed at its narrow ends or not at all. */
const ROUTES = {
  all:     {label:"All"},
  west:    {label:"Gibraltar"},
  central: {label:"Central"},
  east:    {label:"Levant"},
  stayed:  {label:"Stayed north"},
};

/* The second view is one tagging site in Sachsen-Anhalt, so origin says
   nothing and age says everything: 37 birds on their first autumn flying the
   same weeks and the same route as 37 that had done it before. */
const AGES = {
  juv:   {label:"First autumn", role:"age-juv"},
  adult: {label:"Adult",        role:"age-adult"},
};
const AGE_ORDER = ["juv", "adult"];

/* Two deposits, two views, never one pooled sample -- different sites,
   different sampling, different questions. Switching swaps the whole payload,
   and with it the clock, since each deposit covers its own stretch of time. */
const VIEWS = {
  origins: {label:"Origins", file:"storks"},
  ages:    {label:"Ages",    file:"storks-ages"},
};

const pick = name => getComputedStyle(document.documentElement)
  .getPropertyValue("--" + name).trim();
const hexRGB = hex => {
  const h = hex.replace("#","");
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
};
const rgba = (c,a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* Served from a directory the page can fetch, or inlined ahead of this script
   by scripts/build_standalone.py for a single-file build. That distinction is
   also the answer to whether satellite imagery can work at all: the standalone
   carries its data inline precisely because it runs with no network. */
const INLINE = (typeof window !== "undefined" && window.__STORK_DATA__) || null;

let sel = {view:"origins", pops:new Set(POP_ORDER), ages:new Set(AGE_ORDER),
           route:"all", layer:"trails",
           /* Satellite where it can be fetched, the baked backdrop where it
              cannot. Imagery is the only real picture of this ground, so it is
              worth defaulting to wherever it will actually arrive. */
           imagery: INLINE ? "basemap" : "sat"};
/* An explicit click on the imagery row is respected even if it fails; only the
   default falls back on its own. */
let imageryPinned = false;
let DATA = null;          /* the active view's payload */
const LOADED = new Map(); /* view name -> payload, fetched once */
let TRACKS = [];          /* flattened, currently displayed */
let BASEMAP = null;       /* basemap.json, land and sea as a data URI */
let SPAN = 1;             /* hourly slots on the clock */
let BOUNDS = null;

/* ------------------------------------------------------------------ load */

async function loadJSON(name){
  if (INLINE) return INLINE[name] ?? null;
  const res = await fetch(`data/processed/${name}.json`);
  if (!res.ok) throw new Error(`cannot load ${name}: ${res.status}`);
  return res.json();
}

/* Nothing here is reconstructed: every fix arrived with a coordinate pair and
   a timestamp. A slot is elapsed hours from the first fix in the deposit.
   A segment may skip hours -- these are solar tags and they sleep at night --
   but scripts/build_storks.py only leaves a gap inside a segment when the bird
   demonstrably went nowhere across it. Anything faster ends the segment, and
   nothing is drawn across those. */
async function loadStorks(file){
  const raw = await loadJSON(file);
  if (!raw) throw new Error(`no stork data in ${file}`);
  const S = raw.scale, ox = raw.origin.lon, oy = raw.origin.lat;

  const individuals = raw.individuals.map(ind => {
    let n = 0;
    for (const seg of ind.segments) n += seg.x.length;
    const slots = new Int32Array(n);
    const lons  = new Float32Array(n);
    const lats  = new Float32Array(n);
    const brk   = new Uint8Array(n);

    let i = 0;
    for (const seg of ind.segments){
      let x = 0, y = 0, t = seg.t;
      brk[i] = 1;
      for (let j = 0; j < seg.x.length; j++){
        x += seg.x[j]; y += seg.y[j];
        if (j) t += seg.ds[j-1];
        slots[i] = t;
        lons[i]  = ox + x / S;
        lats[i]  = oy + y / S;
        i++;
      }
    }
    return {id:ind.id, pop:ind.pop, route:ind.route, age:ind.age ?? null,
            died:ind.died ?? null,
            n, slots, lons, lats, brk, t0:slots[0], t1:slots[n-1]};
  });

  return {meta:raw, epoch:Date.parse(raw.epoch), individuals};
}

/* Which colour a bird is drawn in. In the origins view that is where it
   hatched; in the ages view, whether this was its first autumn. One lookup,
   so the trails, the dots and the legend can never disagree. */
function colourOf(t, fallback){
  const e = sel.view === "ages" ? AGES[t.age] : POPS[t.pop];
  return e ? e.role : fallback;
}

/* The payload for a view is fetched the first time it is asked for, not at
   boot: most visits never leave the view they land on, and the second deposit
   is most of a megabyte. */
async function setView(name){
  if (sel.view === name && LOADED.has(name)) return;
  const loading = document.getElementById("loading");
  if (!LOADED.has(name)){
    loading.textContent = "loading tracks\u2026";
    loading.hidden = false;
    try {
      LOADED.set(name, await loadStorks(VIEWS[name].file));
    } catch (err){
      loading.textContent = `${VIEWS[name].label} view unavailable \u2014 rebuild data/processed (see README)`;
      console.error(err);
      return;
    }
  }
  sel.view = name;
  DATA = LOADED.get(name);
  document.body.dataset.view = name;
  simT = 0;
  /* Every other rebuild holds the camera still on purpose -- switching a
     population off should not move the ground. A view switch is the one case
     that must not: it is a different deposit over a different frame, and the
     old camera would sit off-centre inside the new one. Dropping it makes
     fitHome take its reset branch. */
  CAM = null;
  loading.hidden = true;
  rebuild();
  syncPills();
}

function rebuild(){
  TRACKS = DATA.individuals.filter(t => sel.view === "ages"
    ? sel.ages.has(t.age)
    : sel.pops.has(t.pop) && (sel.route === "all" || t.route === sel.route));
  SPAN = DATA.meta.slots;
  if (simT >= SPAN) simT = 0;

  /* Frame every bird in the deposit, not the current filter, so switching a
     population off does not move the map out from under the viewer. Switching
     view does refit, and should: the second deposit is one colony over three
     months, and held at the first deposit's continental frame it collapses to
     a ribbon -- when the whole point of it is how the two colours separate. */
  const b = DATA.meta.bounds;
  BOUNDS = {lon0:b.lon0, lat0:b.lat0, lon1:b.lon1, lat1:b.lat1};

  resize();
  updateBlurb();
  buildLegend();
  buildProfile();
  syncPopPills();
  baseReady = false;
}

function syncPopPills(){
  if (sel.view === "ages") return;   /* that row is hidden; leave it alone */
  const present = new Set(DATA ? DATA.individuals.map(t => t.pop) : []);
  for (const b of document.querySelectorAll("#spRow button")){
    const ok = present.has(b.dataset.key);
    b.dataset.unavailable = String(!ok);
    b.setAttribute("aria-pressed", String(ok && sel.pops.has(b.dataset.key)));
  }
}

/* ------------------------------------------------------------- projection */

let W=0, H=0, DPR=1;
const map = document.getElementById("map");
const ctx = map.getContext("2d", {alpha:false});
const base = document.createElement("canvas");
let baseReady = false;

/* Web Mercator. The map that came before this one spanned 90 km and could get
   away with equirectangular and a single cos(lat) squeeze; these birds run from
   the Baltic to the Cape, 91 degrees of latitude, where one squeeze factor is
   wrong at both ends. Mercator is conformal, so shapes hold everywhere, and it
   is the projection the satellite and elevation tiles are already cut in.

   Longitude maps straight through; latitude goes through the Mercator y, and
   both are held in the same world units so a square on screen is a square on
   the ground. Area inflates towards the poles, which is unavoidable in
   Mercator and is the one thing this projection asks you to forgive. */
const DEG = Math.PI / 180;
const merY = lat => Math.log(Math.tan(Math.PI/4 + Math.max(-85, Math.min(85, lat)) * DEG/2));
const latOfY = y => (Math.atan(Math.exp(y)) * 2 - Math.PI/2) / DEG;

/* HOME is the whole selection framed; CAM is where the viewer has moved to.
   Both are a centre plus a longitude span, so the aspect correction lives in
   one place. */
let HOME = null, CAM = null, BOX = null;
const MAX_ZOOM = 2000;  /* a ~4 km-wide view of a continental frame */

function boxOf(cam){
  const spanX = cam.spanLon * DEG;
  const spanY = spanX / (W / H);
  const yC = merY(cam.latC);
  const y0 = yC - spanY/2, y1 = yC + spanY/2;
  return {lon0: cam.lonC - cam.spanLon/2, lon1: cam.lonC + cam.spanLon/2,
          y0, y1, lat0: latOfY(y0), lat1: latOfY(y1)};
}
const px = lon => (lon - BOX.lon0) / (BOX.lon1 - BOX.lon0) * W;
const py = lat => (1 - (merY(lat) - BOX.y0) / (BOX.y1 - BOX.y0)) * H;
const lonAt = sx => BOX.lon0 + (sx / W) * (BOX.lon1 - BOX.lon0);
const latAt = sy => latOfY(BOX.y1 - (sy / H) * (BOX.y1 - BOX.y0));
const zoomLevel = () => HOME ? HOME.spanLon / CAM.spanLon : 1;

function fitHome(keepCam){
  if (!BOUNDS) return;
  const dataLon = (BOUNDS.lon1 - BOUNDS.lon0) || 0.01;
  const y0 = merY(BOUNDS.lat0), y1 = merY(BOUNDS.lat1);
  const dataY = (y1 - y0) || 0.0002;
  const pad = 1.08;
  /* Whichever axis is tighter against the canvas decides the span. */
  const spanLon = Math.max(dataLon * pad, (dataY * pad) * (W / H) / DEG);
  HOME = {lonC:(BOUNDS.lon0 + BOUNDS.lon1)/2, latC:latOfY((y0 + y1)/2), spanLon};
  if (!CAM || !keepCam) CAM = Object.assign({}, HOME);
  clampCam();
  BOX = boxOf(CAM);
  baseReady = false;
}

/* Slack beyond the data's own frame, in fractions of the current view. The
   panels sit over the map, so at full extent there has to be room to nudge the
   ground out from under the legend -- with no slack the camera is pinned and a
   drag does nothing. */
const PAN_SLACK = 0.45;

function clampCam(){
  if (!HOME) return;
  CAM.spanLon = Math.min(HOME.spanLon,
                         Math.max(HOME.spanLon / MAX_ZOOM, CAM.spanLon));
  const spanY = CAM.spanLon * DEG / (W / H);
  const homeY = HOME.spanLon * DEG / (W / H);
  const halfLon = Math.max(0, (HOME.spanLon - CAM.spanLon) / 2)
                + CAM.spanLon * PAN_SLACK;
  const halfY = Math.max(0, (homeY - spanY) / 2) + spanY * PAN_SLACK;
  CAM.lonC = Math.min(HOME.lonC + halfLon, Math.max(HOME.lonC - halfLon, CAM.lonC));
  /* Clamping in Mercator y rather than in degrees, so the limit means the same
     distance north and south of a frame that is not centred on the equator. */
  const yC = merY(CAM.latC), homeYC = merY(HOME.latC);
  CAM.latC = latOfY(Math.min(homeYC + halfY, Math.max(homeYC - halfY, yC)));
  BOX = boxOf(CAM);
}

/* Redrawing the fix layer costs real milliseconds at full extent, and at full
   extent the camera is clamped so a drag moves nothing. Invalidate only when
   the camera actually changed. */
function commitCam(before){
  const moved = CAM.lonC !== before.lonC || CAM.latC !== before.latC
             || CAM.spanLon !== before.spanLon;
  if (moved) baseReady = false;
  return moved;
}

function zoomAround(sx, sy, factor){
  if (!CAM) return;
  const before = Object.assign({}, CAM);
  const lon = lonAt(sx), lat = latAt(sy);
  CAM.spanLon = CAM.spanLon / factor;
  clampCam();
  /* Put the point that was under the pointer back under the pointer. */
  const spanY = CAM.spanLon * DEG / (W / H);
  CAM.lonC = lon - (sx / W - 0.5) * CAM.spanLon;
  CAM.latC = latOfY(merY(lat) + (sy / H - 0.5) * spanY);
  clampCam();
  commitCam(before);
  updateZoomUI();
}

function panBy(dx, dy){
  if (!CAM) return;
  const before = Object.assign({}, CAM);
  CAM.lonC -= (dx / W) * (BOX.lon1 - BOX.lon0);
  CAM.latC = latOfY(merY(CAM.latC) + (dy / H) * (BOX.y1 - BOX.y0));
  clampCam();
  commitCam(before);
}

function resetView(){
  if (!HOME) return;
  CAM = Object.assign({}, HOME);
  clampCam();
  baseReady = false;
  updateZoomUI();
}

function updateZoomUI(){
  const el = document.getElementById("zoomlv");
  if (el) el.textContent = zoomLevel() < 1.05 ? "fit" : zoomLevel().toFixed(1) + "×";
  const rb = document.getElementById("resetview");
  if (rb) rb.disabled = zoomLevel() < 1.05;
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  map.width = Math.round(W*DPR); map.height = Math.round(H*DPR);
  map.style.width = W+"px"; map.style.height = H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  base.width = map.width; base.height = map.height;
  fitHome(true);
}

/* ------------------------------------------------------------- base layer */

/* Only the animals move on this map. The base carries the chosen landscape
   layer and nothing else -- no cloud of past fixes, so a dot on screen is an
   animal at that hour rather than a smear of everywhere it ever stood. */
function renderBase(){
  const b = base.getContext("2d");
  b.setTransform(DPR,0,0,DPR,0,0);
  b.fillStyle = pick("bg-bot");
  b.fillRect(0,0,W,H);
  if (!BOUNDS){ baseReady = true; return; }

  if (sel.imagery === "basemap") drawBasemap(b);
  else if (sel.imagery === "sat") drawTiles(b);

  baseReady = true;
}

/* ---------------------------------------------------------- satellite tiles

   The only real picture of this landscape available anywhere is imagery, and
   it has to come from a tile server at view time -- nothing is bundled. Tiles
   are Web Mercator and so is this map, so each one is drawn into the rectangle
   its own corners project to and lands exactly.

   A host that forbids outbound requests (the standalone build runs under one)
   simply gets no tiles: the loads fail, the dark ground stays, and the page
   says so rather than looking broken. */
const TILES = {
  url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  attribution: "Imagery © Esri, Maxar, Earthstar Geographics",
  maxZ: 18,
  cap: 500,                       /* tiles held before the oldest are dropped */
};
const tileCache = new Map();
let tileFails = 0, tileLoads = 0;

const lonToX = (lon, n) => (lon + 180) / 360 * n;
const latToY = (lat, n) => {
  const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * n;
};
const xToLon = (x, n) => x / n * 360 - 180;
const yToLat = (y, n) => Math.atan(Math.sinh(Math.PI * (1 - 2*y/n))) * 180 / Math.PI;

function drawTiles(b){
  /* Choose the zoom whose tiles land nearest 256 screen pixels. */
  const worldPx = W * 360 / (BOX.lon1 - BOX.lon0);
  const z = Math.max(0, Math.min(TILES.maxZ, Math.round(Math.log2(worldPx / 256))));
  const n = 2 ** z;
  const x0 = Math.floor(lonToX(BOX.lon0, n)), x1 = Math.ceil(lonToX(BOX.lon1, n));
  const y0 = Math.floor(latToY(BOX.lat1, n)), y1 = Math.ceil(latToY(BOX.lat0, n));

  for (let ty = Math.max(0, y0); ty < Math.min(n, y1); ty++){
    for (let tx = Math.max(0, x0); tx < Math.min(n, x1); tx++){
      const key = `${z}/${tx}/${ty}`;
      let img = tileCache.get(key);
      if (img === undefined){
        img = new Image();
        /* No crossOrigin: the canvas is never read back, and requesting CORS
           would fail the load outright on servers that do not send it. */
        img.onload  = () => { tileLoads++; baseReady = false; };
        img.onerror = () => { tileFails++; tileCache.set(key, null); tileTrouble(); };
        img.src = TILES.url.replace("{z}", z).replace("{x}", tx).replace("{y}", ty);
        tileCache.set(key, img);
        if (tileCache.size > TILES.cap){
          tileCache.delete(tileCache.keys().next().value);
        }
      }
      if (!img || !img.complete || !img.naturalWidth) continue;
      const dx = px(xToLon(tx, n)), dy = py(yToLat(ty, n));
      b.drawImage(img, dx, dy,
                  px(xToLon(tx+1, n)) - dx, py(yToLat(ty+1, n)) - dy);
    }
  }
}

/* Now that satellite is the default, a host that blocks the tile server would
   hand the visitor a black map. The backdrop is already inside the page, so
   dropping back to it costs nothing and is plainly better than nothing -- but
   only when satellite was the default. Somebody who asked for it out loud gets
   the empty ground and the reason, not a silent override. */
let satBlocked = false;
function tileTrouble(){
  if (sel.imagery !== "sat" || tileLoads > 0){ updateAttrib(); return; }
  /* One failure is a bad tile; several with nothing through is the host. */
  if (tileFails < 4){ updateAttrib(); return; }
  satBlocked = true;
  if (imageryPinned){ updateAttrib(); return; }
  sel.imagery = "basemap";
  baseReady = false;
  syncPills();
  updateAttrib();
}

function updateAttrib(){
  const el = document.getElementById("attrib");
  if (!el) return;
  if (sel.imagery === "off"){ el.hidden = true; return; }
  el.hidden = false;
  if (sel.imagery === "basemap"){
    /* Carried inside the page, so it has no failure state of its own -- but it
       should say why it is on screen if satellite was meant to be. */
    const why = satBlocked && !imageryPinned
      ? "satellite unavailable here \u2014 " : "";
    el.textContent = why + (BASEMAP ? BASEMAP.attribution : "basemap unavailable");
    return;
  }
  el.textContent = (tileLoads === 0 && tileFails > 0)
    ? "satellite imagery unavailable on this host"
    : TILES.attribution;
}

/* Land and sea, computed once by scripts/build_basemap.py and carried in the
   page as a quantised PNG. It is already in Web Mercator, the same projection
   this map draws in, so placing it is one drawImage into its own rectangle --
   no per-tile projection, and no requests at view time. Without it there is no
   coastline, and a map of birds that will not cross open water needs one. */
let basemapImg = null;

function drawBasemap(b){
  if (!basemapImg || !BASEMAP) return;
  const R = BASEMAP.bounds;
  b.save();
  b.imageSmoothingEnabled = true;
  b.drawImage(basemapImg, px(R.lon0), py(R.lat1),
              px(R.lon1) - px(R.lon0), py(R.lat0) - py(R.lat1));
  b.restore();
}

/* --------------------------------------------------------------- playback */

let simT = 0;                  /* hourly slots since the deposit's first fix */
let slotsPerSecond = 96;       /* four days a second: a full run in ~2.5 min */
let playing = true;
let lastFrame = performance.now();

const MS_PER_SLOT = 3600 * 1000;
const clockDate = () => new Date((DATA ? DATA.epoch : 0) + simT * MS_PER_SLOT);

/* Position at a fractional slot, or null inside a gap / outside the track.
   Slots inside a segment are consecutive, so a step of more than one is a
   silence and nothing is drawn across it. */
function posAt(t, at){
  if (at < t.t0 || at > t.t1) return null;
  const slots = t.slots;
  let lo = 0, hi = t.n - 1;
  while (lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if (slots[mid] <= at) lo = mid; else hi = mid - 1;
  }
  if (lo === t.n - 1) return [px(t.lons[lo]), py(t.lats[lo]), lo];
  /* Only a segment boundary breaks the line. A skipped hour inside a segment is
     a sleeping bird, and the builder has already established it did not move. */
  if (t.brk[lo+1]) return null;
  const ta = slots[lo], tb = slots[lo+1];
  const f = (at - ta) / (tb - ta);
  return [px(t.lons[lo] + (t.lons[lo+1]-t.lons[lo])*f),
          py(t.lats[lo] + (t.lats[lo+1]-t.lats[lo])*f), lo];
}

/* Ground covered in the hour ending at index i, in km. On migration a stork
   soars at 40-60 km/h; sitting on a rubbish tip it covers almost nothing. */
function stepKm(t, i){
  if (i < 1 || t.brk[i]) return 0;
  const hours = t.slots[i] - t.slots[i-1];
  if (hours < 1) return 0;
  const dLon = (t.lons[i]-t.lons[i-1]) * Math.cos(t.lats[i] * DEG) * 111.32;
  const dLat = (t.lats[i]-t.lats[i-1]) * 110.574;
  return Math.hypot(dLon, dLat) / hours;      /* km per hour, not per step */
}

const DOT_R = 4.0;
/* How long after a death the outgoing rings keep going, in hours. */
const DEATH_RINGS_H = 60;
const TRAIL_STEPS = 10;
const TRAIL_SLOTS = 48;        /* two days of trail, so a migrating bird draws a line */

/* The birds draw their own routes. Nothing is on the map before a stork has
   flown it: the trail is painted onto its own canvas as the clock advances, so
   each frame only adds the hour just flown. Panning, zooming or changing the
   selection reprojects everything, and scrubbing backwards has to unpaint --
   both are handled by clearing and repainting up to the current hour, which is
   the only expensive case and happens only on those events. */
let trailCv = null, tctx = null, trailUpTo = 0, trailKey = "";
const TRAIL_W = 1.6;

function trailStamp(){
  return [CAM.lonC, CAM.latC, CAM.spanLon, W, H, sel.view, sel.route,
          [...sel.pops].sort().join(","),
          [...sel.ages].sort().join(",")].join("|");
}

/* Last fix at or before `at`, whether or not the map may draw to it. */
function lastIndexAt(t, at){
  if (at < t.t0 || at > t.t1) return -1;
  let lo = 0, hi = t.n - 1;
  while (lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if (t.slots[mid] <= at) lo = mid; else hi = mid - 1;
  }
  return lo;
}

/* First index whose slot is strictly after `after`. */
function indexAfter(t, after){
  let lo = 0, hi = t.n;
  while (lo < hi){
    const mid = (lo + hi) >> 1;
    if (t.slots[mid] <= after) lo = mid + 1; else hi = mid;
  }
  return lo;
}

function paintTrail(from, to){
  tctx.lineCap = "round";
  tctx.lineJoin = "round";
  tctx.lineWidth = TRAIL_W;
  for (const t of TRACKS){
    if (t.t1 <= from || t.t0 > to) continue;
    const col = hexRGB(pick(colourOf(t, "ink-3")));
    tctx.strokeStyle = rgba(col, 0.55);
    tctx.beginPath();
    let pen = false;
    for (let i = Math.max(1, indexAfter(t, from)); i < t.n && t.slots[i] <= to; i++){
      if (t.brk[i]){ pen = false; continue; }
      if (!pen){ tctx.moveTo(px(t.lons[i-1]), py(t.lats[i-1])); pen = true; }
      tctx.lineTo(px(t.lons[i]), py(t.lats[i]));
    }
    tctx.stroke();
  }
}

function updateTrail(){
  if (!trailCv) trailCv = document.createElement("canvas");
  const stamp = trailStamp();
  const resized = trailCv.width !== map.width || trailCv.height !== map.height;
  if (resized || stamp !== trailKey){
    if (resized){ trailCv.width = map.width; trailCv.height = map.height; }
    trailKey = stamp;
    tctx = trailCv.getContext("2d");
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    tctx.clearRect(0, 0, W, H);
    paintTrail(-1, simT);
  } else if (simT < trailUpTo){
    tctx.clearRect(0, 0, W, H);
    paintTrail(-1, simT);
  } else if (simT > trailUpTo){
    paintTrail(trailUpTo, simT);
  }
  trailUpTo = simT;
}

function draw(){
  if (!baseReady) renderBase();
  ctx.drawImage(base, 0, 0, W, H);
  if (!BOUNDS) return;

  if (sel.layer === "trails"){
    updateTrail();
    ctx.drawImage(trailCv, 0, 0, W, H);
  }

  const z = Math.min(3, Math.sqrt(zoomLevel()));

  for (const t of TRACKS){
    /* A tag that stopped because the bird died leaves a mark where it stopped.
       Twenty-three of these birds did not live to migrate twice, and a track
       that simply vanishes would read as a coverage gap instead. */
    if (t.died !== null && simT > t.died){
      const gx = px(t.lons[t.n-1]), gy = py(t.lats[t.n-1]);
      const r = 3.4 * z;                    /* the mark stays; the bird does not */
      const col = hexRGB(pick(colourOf(t, "ink-2")));

      /* For a couple of days after the tag stops, rings go out from the spot,
         so a death registers as an event rather than a dot quietly becoming a
         cross while you were looking somewhere else. */
      const since = simT - t.died;
      if (since < DEATH_RINGS_H){
        for (let k = 0; k < 3; k++){
          const phase = (since / DEATH_RINGS_H) + k * 0.28;
          if (phase <= 0 || phase >= 1) continue;
          ctx.beginPath();
          ctx.arc(gx, gy, r + phase * 26 * z, 0, 6.2832);
          ctx.strokeStyle = rgba(col, (1 - phase) * 0.5);
          ctx.lineWidth = Math.max(1/DPR, 1.4 * (1 - phase));
          ctx.stroke();
        }
      }

      ctx.strokeStyle = rgba(hexRGB(pick("ink-2")), 0.62);
      ctx.lineWidth = Math.max(1/DPR, 1.2);
      ctx.beginPath();
      ctx.moveTo(gx-r, gy-r); ctx.lineTo(gx+r, gy+r);
      ctx.moveTo(gx+r, gy-r); ctx.lineTo(gx-r, gy+r);
      ctx.stroke();
      continue;
    }

    const col = hexRGB(pick(colourOf(t, "ink-3")));
    const head = posAt(t, simT);
    if (!head){
      /* A gap too long to draw across. The bird is still alive and still
         somewhere; an empty patch of map would say the opposite. So it waits,
         hollow, at the last place its tag reported -- Pelopidas goes quiet for
         twenty-eight days in the middle of Africa and comes back. */
      const i = lastIndexAt(t, simT);
      if (i < 0) continue;
      ctx.beginPath();
      ctx.arc(px(t.lons[i]), py(t.lats[i]), DOT_R * 0.9 * z, 0, 6.2832);
      ctx.strokeStyle = rgba(col, 0.4);
      ctx.lineWidth = Math.max(1/DPR, 1.3);
      ctx.stroke();
      continue;
    }
    const kmh = stepKm(t, head[2]);

    /* The trail brightens when the bird is travelling, so a migration reads as
       a streak and a winter on the ground reads as a point. */
    const heat = Math.min(1, kmh / 45);
    let cx = head[0], cy = head[1];
    for (let k = 1; k <= TRAIL_STEPS; k++){
      const back = posAt(t, simT - (TRAIL_SLOTS/TRAIL_STEPS)*k);
      if (!back) break;
      const a = (1 - k/TRAIL_STEPS) * (0.45 + heat * 0.5);
      if (a <= 0.02) break;
      ctx.beginPath();
      ctx.moveTo(cx, cy); ctx.lineTo(back[0], back[1]);
      ctx.strokeStyle = rgba(col, a);
      ctx.lineWidth = Math.max(1.2/DPR, (2.1 + heat * 1.6) * z * (1 - k/(TRAIL_STEPS+3)));
      ctx.lineCap = "round";
      ctx.stroke();
      cx = back[0]; cy = back[1];
    }

    /* A dark collar under each bird, so a bright dot never sits on lit ground
       without an edge to separate it. */
    ctx.beginPath(); ctx.arc(head[0], head[1], (DOT_R + 2.5 + heat*2) * z, 0, 6.2832);
    ctx.fillStyle = rgba(col, 0.16); ctx.fill();
    ctx.beginPath(); ctx.arc(head[0], head[1], (DOT_R + 1.4) * z, 0, 6.2832);
    ctx.fillStyle = "rgba(6,10,16,0.72)"; ctx.fill();
    ctx.beginPath(); ctx.arc(head[0], head[1], DOT_R * z, 0, 6.2832);
    ctx.fillStyle = rgba(col, 1); ctx.fill();
  }
}

/* ------------------------------------------------------------------- chrome */

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SLOTS_PER_DAY = 24;

/* Each view is a different study, and saying so is part of the map. */
const BLURB = {
  origins: `<strong>White storks, Aug 2013 &ndash; Jul 2014</strong><br>
    Fifty-nine juveniles from seven populations, ringed at the nest and tracked
    hourly. Storks soar, and thermals do not form over open water &mdash; so
    watch where they cross the Mediterranean, and where they refuse to.`,
  ages: `<strong>First autumn or fiftieth, Aug &ndash; Oct 2013</strong><br>
    Seventy-four storks from one site in Sachsen-Anhalt, thirty-seven of them
    flying south for the first time and thirty-seven that had done it before,
    over the same weeks and the same eastern route. Watch which group hesitates.`,
};

function updateBlurb(){
  document.getElementById("meta").innerHTML = BLURB[sel.view] || "";
}

function buildLegend(){
  const rows = document.getElementById("legendRows");
  rows.innerHTML = "";
  /* Whatever the map is coloured by is what the legend counts, so the two can
     never tell different stories. */
  const ages = sel.view === "ages";
  const keyOf = t => ages ? t.age : t.pop;
  const order = ages ? AGE_ORDER : POP_ORDER;
  const table = ages ? AGES : POPS;

  const counts = new Map();
  for (const t of TRACKS){
    const k = keyOf(t);
    const c = counts.get(k) || {birds:0, fixes:0};
    c.birds += 1; c.fixes += t.n;
    counts.set(k, c);
  }
  for (const key of order){
    if (!counts.has(key)) continue;
    const c = counts.get(key);
    const el = document.createElement("div");
    el.className = "lg";
    el.innerHTML = `<span class="sw" style="background:${pick(table[key].role)}"></span>`
      + `<span class="nm">${table[key].label}</span>`
      + `<span class="ct">${c.birds}</span>`;
    rows.appendChild(el);
  }

  const died = TRACKS.filter(t => t.died !== null).length;
  document.getElementById("legendFoot").innerHTML = TRACKS.length
    ? `${TRACKS.length} birds &middot; ${died} &times; a tag stopped on a death`
    : "No birds for this combination.";
}

/* The strip under the scrubber is the whole deposit: kilometres covered per
   bird per day, averaged over everyone on screen. Migration is not something
   you have to look for in it -- it is the two spikes. */
const prof = document.getElementById("profcv");
const profBase = document.createElement("canvas");
let profW = 0, profH = 0;

function buildProfile(){
  const r = prof.parentElement.getBoundingClientRect();
  /* The controls are hidden in the video export, which leaves this canvas with
     no size at all; a zero-height canvas is not a drawable image. */
  if (r.width < 2 || r.height < 2){ profW = 0; return; }
  profW = Math.max(120, Math.round(r.width)); profH = Math.round(r.height);
  for (const cv of [prof, profBase]){
    cv.width = Math.round(profW*DPR); cv.height = Math.round(profH*DPR);
  }
  prof.style.width = profW+"px"; prof.style.height = profH+"px";

  const days = Math.max(1, Math.ceil(SPAN / SLOTS_PER_DAY));
  const sums = new Float64Array(days), n = new Float64Array(days);
  for (const t of TRACKS){
    for (let i = 1; i < t.n; i++){
      const hours = t.slots[i] - t.slots[i-1];
      if (t.brk[i] || hours < 1) continue;
      const d = Math.floor(t.slots[i-1] / SLOTS_PER_DAY);
      if (d >= 0 && d < days){ sums[d] += stepKm(t, i) * hours; n[d] += hours; }
    }
  }

  const c = profBase.getContext("2d");
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,profW,profH);
  let peak = 1;
  for (let i=0;i<days;i++) if (n[i] && sums[i]/n[i]*24 > peak) peak = sums[i]/n[i]*24;

  const bw = profW/days;
  const epoch = DATA ? DATA.epoch : 0;
  for (let i=0;i<days;i++){
    const v = n[i] ? sums[i]/n[i]*24 : 0;      /* km per bird per day */
    const hgt = (v/peak) * (profH - 12);
    const month = new Date(epoch + i*SLOTS_PER_DAY*MS_PER_SLOT).getUTCMonth();
    c.fillStyle = rgba(hexRGB(pick("ink-3")), month % 2 ? 0.5 : 0.32);
    c.fillRect(i*bw, profH - 8 - hgt, Math.max(0.7, bw - 0.3), hgt);
  }
  /* A tick at each new year, and month initials where they fit. */
  c.font = '300 8px "IBM Plex Mono",monospace';
  let last = -1;
  for (let i=0;i<days;i++){
    const d = new Date(epoch + i*SLOTS_PER_DAY*MS_PER_SLOT);
    if (d.getUTCDate() !== 1 || d.getUTCMonth() === last) continue;
    last = d.getUTCMonth();
    const x = i*bw;
    const newYear = d.getUTCMonth() === 0;
    c.fillStyle = rgba(hexRGB(pick(newYear ? "ink-2" : "rule")), 1);
    c.fillRect(x, 2, newYear ? 1 : 0.6, profH - 12);
    if (bw * 3 > 14){
      c.fillStyle = pick("ink-3");
      c.textAlign = "left";
      c.fillText(newYear ? String(d.getUTCFullYear()) : MONTHS[d.getUTCMonth()][0], x + 2, profH - 1);
    }
  }
  c.textAlign = "left";
  drawProfile();
}

function drawProfile(){
  if (!profW) return;
  const c = prof.getContext("2d");
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,profW,profH);
  c.drawImage(profBase, 0, 0, profW, profH);
  const x = (simT / Math.max(1, SPAN)) * profW;
  c.strokeStyle = pick("ink");
  c.lineWidth = 1;
  c.beginPath(); c.moveTo(x, 0); c.lineTo(x, profH - 9); c.stroke();
}

function updateClock(){
  const d = clockDate();
  /* The clock runs on hourly fixes, but an hour reading means little on a map
     spanning a continent, and a date is what places a migration. */
  document.getElementById("clock").textContent =
    `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  document.getElementById("day").textContent =
    `day ${Math.floor(simT/SLOTS_PER_DAY) + 1} of ${Math.max(1, Math.ceil(SPAN/SLOTS_PER_DAY))}`;

}

/* ------------------------------------------------------------------ loop */

function frame(now){
  const dt = Math.min(0.25, (now - lastFrame)/1000);
  lastFrame = now;
  if (playing && TRACKS.length){
    simT += dt * slotsPerSecond;
    if (simT >= SPAN) simT = 0;
    const sc = document.getElementById("scrub");
    if (document.activeElement !== sc) sc.value = Math.round(simT/SPAN*1000);
  }
  draw();
  updateClock();
  drawProfile();
  requestAnimationFrame(frame);
}

/* --------------------------------------------------------------- controls */

/* Every row registers how to read its own state back, so a change made
   anywhere -- a click, or the render hook driving the page for the video --
   leaves all of them showing what is actually selected. */
const pillSyncs = [];
function syncPills(){ for (const f of pillSyncs) f(); }

function pillRow(rowId, items, isOn, onPick){
  const row = document.getElementById(rowId);
  const sync = () => {
    for (const btn of row.querySelectorAll("button"))
      btn.setAttribute("aria-pressed", String(isOn(btn.dataset.key)));
  };
  for (const it of items){
    const b = document.createElement("button");
    b.textContent = it.label;
    b.dataset.key = it.key;
    b.setAttribute("aria-pressed", String(isOn(it.key)));
    b.addEventListener("click", async () => { await onPick(it.key); syncPills(); });
    row.appendChild(b);
  }
  pillSyncs.push(sync);
}

function wireControls(){
  pillRow("vwRow",
    Object.keys(VIEWS).map(k => ({key:k, label:VIEWS[k].label})),
    k => sel.view === k,
    async k => { await setView(k); });

  pillRow("agRow",
    AGE_ORDER.map(k => ({key:k, label:AGES[k].label})),
    k => sel.ages.has(k),
    async k => {
      if (sel.ages.has(k)){ if (sel.ages.size > 1) sel.ages.delete(k); }
      else sel.ages.add(k);
      rebuild();
    });

  pillRow("spRow",
    POP_ORDER.map(k => ({key:k, label:POPS[k].label})),
    k => sel.pops.has(k),
    async k => {
      if (sel.pops.has(k)){ if (sel.pops.size > 1) sel.pops.delete(k); }
      else sel.pops.add(k);
      rebuild();
    });

  pillRow("seRow",
    Object.keys(ROUTES).map(k => ({key:k, label:ROUTES[k].label})),
    k => sel.route === k,
    async k => { sel.route = k; rebuild(); });

  pillRow("prRow",
    [{key:"none",label:"None"},{key:"trails",label:"Trails"}],
    k => sel.layer === k,
    async k => { sel.layer = k; baseReady = false; buildLegend(); });

  pillRow("imRow",
    [{key:"off",label:"Off"},{key:"basemap",label:"Land & sea"},{key:"sat",label:"Satellite"}],
    k => sel.imagery === k,
    async k => {
      sel.imagery = k; imageryPinned = true;
      baseReady = false; updateAttrib();
    });

  const play = document.getElementById("play");
  play.addEventListener("click", () => {
    playing = !playing;
    play.textContent = playing ? "Pause" : "Play";
    play.setAttribute("aria-pressed", String(playing));
  });

  const spd = document.getElementById("spd");
  for (const v of [24, 48, 96, 192]){
    const b = document.createElement("button");
    b.textContent = (v/24) + "\u00d7";
    b.setAttribute("aria-pressed", String(v === slotsPerSecond));
    b.addEventListener("click", () => {
      slotsPerSecond = v;
      for (const x of spd.querySelectorAll("button"))
        x.setAttribute("aria-pressed", String(x === b));
    });
    spd.appendChild(b);
  }

  const scrub = document.getElementById("scrub");
  scrub.addEventListener("input", () => { simT = scrub.value/1000 * SPAN; });

  const nb = document.getElementById("notesbtn"), notes = document.getElementById("notes");
  nb.addEventListener("click", () => {
    const open = notes.dataset.open !== "true";
    notes.dataset.open = String(open);
    nb.setAttribute("aria-expanded", String(open));
  });

  document.getElementById("resetview").addEventListener("click", resetView);

  /* On a phone the map is the scarce thing, so the legend starts folded. */
  if (window.matchMedia("(max-width:820px)").matches){
    document.getElementById("legendToggle").setAttribute("aria-expanded", "false");
    document.getElementById("legend").dataset.collapsed = "true";
  }
  const lt = document.getElementById("legendToggle");
  lt.addEventListener("click", () => {
    const open = lt.getAttribute("aria-expanded") !== "true";
    lt.setAttribute("aria-expanded", String(open));
    document.getElementById("legend").dataset.collapsed = String(!open);
  });

  addEventListener("resize", () => { resize(); buildProfile(); });
  addEventListener("keydown", e => {
    if (e.key === " "){ e.preventDefault(); play.click(); }
    else if (e.key === "0"){ resetView(); }
    else if (e.key === "+" || e.key === "="){ zoomAround(W/2, H/2, 1.4); }
    else if (e.key === "-"){ zoomAround(W/2, H/2, 1/1.4); }
  });

  wireMapGestures();
}

/* Wheel, drag and two-finger pinch, on one pointer-event path so a trackpad,
   a mouse and a touchscreen all behave the same. */
function wireMapGestures(){
  const pts = new Map();
  let pinch = null, panning = false, last = null;

  map.addEventListener("wheel", e => {
    e.preventDefault();
    const r = map.getBoundingClientRect();
    /* Trackpads report small deltas continuously, mice one large notch. */
    const step = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.002));
    zoomAround(e.clientX - r.left, e.clientY - r.top,
               Math.min(2.4, Math.max(1/2.4, step)));
  }, {passive:false});

  map.addEventListener("pointerdown", e => {
    map.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 2){
      const [a, b] = [...pts.values()];
      pinch = {d: Math.hypot(a.x-b.x, a.y-b.y),
               mx:(a.x+b.x)/2, my:(a.y+b.y)/2};
      panning = false;
    } else if (pts.size === 1){
      panning = true; last = {x:e.clientX, y:e.clientY};
      map.style.cursor = "grabbing";
    }
  });

  map.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if (pts.size === 2 && pinch){
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      const r = map.getBoundingClientRect();
      panBy(mx - pinch.mx, my - pinch.my);
      if (pinch.d > 0) zoomAround(mx - r.left, my - r.top, d / pinch.d);
      pinch = {d, mx, my};
    } else if (panning && last){
      panBy(e.clientX - last.x, e.clientY - last.y);
      last = {x:e.clientX, y:e.clientY};
    }
  });

  const release = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0){ panning = false; last = null; map.style.cursor = ""; }
    else if (pts.size === 1){ panning = true; last = [...pts.values()][0]; }
    updateZoomUI();
  };
  map.addEventListener("pointerup", release);
  map.addEventListener("pointercancel", release);
  map.addEventListener("dblclick", e => {
    const r = map.getBoundingClientRect();
    zoomAround(e.clientX - r.left, e.clientY - r.top, 2);
  });
}

function buildNotes(){
  document.getElementById("notesBody").innerHTML = `
    <p>Every position on this map is a real GPS fix with a real timestamp.
    Nothing was reconstructed. The tags recorded every five minutes; this is
    thinned to hourly, and the animation between fixes is straight-line
    interpolation across one hour.</p>

    <h3>Who these birds are</h3>
    <p>Fifty-nine juvenile white storks (<em>Ciconia ciconia</em>) ringed at the
    nest across seven sites &mdash; Spain, Germany, Tunisia, Poland, Greece,
    Russia and Armenia &mdash; and followed from August 2013 to July 2014.
    127,606 hourly fixes, from 55&deg;N in the Baltic to 27&deg;S in southern
    Africa, and from Senegal east to Kazakhstan.</p>

    <h3>The two views are two studies</h3>
    <p><strong>Origins</strong> and <strong>Ages</strong> come from different
    deposits, and the map never pools them &mdash; different sites, different
    sampling, different questions. Switching swaps the whole dataset, and the
    clock with it.</p>
    <p><strong>Origins</strong> is Flack et al. 2016
    (<code>doi:10.5441/001/1.78152p3q</code>): breadth, nine
    tagging sites, and every bird a juvenile. It can show you where a
    generation goes, but it has nobody to compare them against.</p>
    <p><strong>Ages</strong> is Rotics et al. 2016
    (<code>doi:10.5441/001/1.hn1bd23k</code>): one site in
    Sachsen-Anhalt, and the comparison the first deposit lacks. In autumn 2013
    it carries 37 birds on their first migration and 37 adults, flying the same
    eastern route in the same weeks &mdash; 71,695 hourly fixes over 92 days.
    Those 122 birds are not folded into the other view: they are a single
    colony, they outnumber the whole first deposit two to one, and dropping
    them into the origin palette would turn a seven-population map into a
    German one.</p>
    <p class="sub">The Ages deposit is fall migration only, so it stops on 31
    October &mdash; which is why the <strong>Crossing</strong> filter is not
    offered there. A bird that has not passed 36&deg;N by the end of October
    has not decided against migrating; the window simply ended first.</p>

    <h3>What was left out, and why</h3>
    <p>The deposit holds 72 birds and runs from November 2012, but two parts of
    it were not worth drawing.</p>
    <p><strong>The first six months are one bird.</strong> Every tag but one
    goes on in June or July 2013, when that year's chicks were ringed at the
    nest. Before that there is a single South African stork and nothing else
    &mdash; 226 days, 38% of the original timeline, one dot. The map starts on
    1 August 2013, which drops that bird along with the empty stretch, and also
    the two months the new birds spent standing around the nest before autumn
    migration began.</p>
    <p><strong>The Uzbek birds do not migrate.</strong> Six storks of the
    Ferghana Valley, ranging a median of 148 km and never going south of
    40&deg;N in up to 365 days each. That is a real thing about
    <em>Ciconia ciconia asiatica</em> and not a gap in the data &mdash; but on
    a map about movement they were six dots that never moved, so they are left
    out rather than left sitting.</p>

    <h3>Why the Mediterranean is crossed at its ends</h3>
    <p>Storks are soaring birds. They climb in thermals and glide between them,
    which costs a fraction of what flapping costs &mdash; and thermals form
    over warm land, not over water. So the sea is crossed where it is narrow:
    at Gibraltar in the west, or round the eastern end through the Levant. The
    <strong>Crossing</strong> filter is derived from the data rather than
    assumed: for each bird, the longitude at which it first got south of
    36&deg;N. Of the 72, 14 crossed at Gibraltar, 11 through the central
    Mediterranean, 24 by the Levant, and 23 never went south of 36&deg;N at
    all.</p>
    <p class="sub">That last group is not a failure of the data. Some are
    Spanish birds that no longer migrate &mdash; they winter on rubbish tips
    within a few hundred kilometres of the nest &mdash; and some are birds that
    died before their first autumn.</p>

    <h3>The crosses</h3>
    <p>Twenty-two of the 59 tags in <strong>Origins</strong>, and 21 of the 74
    in <strong>Ages</strong>, stopped because the bird died, which both deposits
    record. Rings go out from the spot as it happens and a cross stays
    there afterwards, because a track that simply vanished would read as a gap
    in coverage instead of what it was. A juvenile's first migration is the
    most dangerous journey of its life.</p>

    <h3>The strip under the scrubber</h3>
    <p>Kilometres covered per bird per day, averaged over everyone on screen,
    one bar per day across the whole deposit. Migration is not something you
    have to look for in it: it is the spikes. Between them the birds are on
    wintering or breeding grounds, covering a tenth as much.</p>

    <h3>The ground</h3>
    <p><strong>Satellite</strong> is the default here, because imagery is the
    only real picture of this ground. <strong>Land &amp; sea</strong> is built
    from two measured sources and baked into the page, so it is the backdrop
    that works with no connection at all &mdash; and the only one in the
    self-contained build, which starts on it for that reason.</p>
    <p class="sub">Height and depth come from the Terrain Tiles set on AWS Open
    Data &mdash; SRTM and GMTED on land, ETOPO1 and other surveys at sea. One
    raster gives the hillshade and every coastline, which a map about birds
    that will not cross open water needs. Height sets the colour and slope sets
    the light, because height is what a soaring bird lives on: thermals form
    over warm broken ground, so the Atlas, the Iberian meseta, the Anatolian
    plateau and the Ethiopian highlands are the corridors.</p>
    <p class="sub">Standing water and vegetation come from ESA WorldCover 2021,
    10 m global land cover, read at its coarsest overview and reduced to about
    5 km. Lakes, the Nile, the Niger and the Sudd are drawn as water; the green
    is a wash keyed to how much of each cell is tree cover, shrub, grass or
    crop. It is deliberately faint. What it is there for is the edge: the
    Sahara is bare and the Sahel below it is not, and that line is where the
    desert crossing ends.</p>
    <p class="sub">Satellite is Esri World Imagery, fetched as tiles at view
    time, so it needs a host that permits outbound requests. Where they are
    blocked the page does not sit on an empty map: it drops back to the baked
    backdrop it already carries and the attribution line says why. Ask for
    satellite yourself and that stands &mdash; the fallback only overrides the
    default, never a choice.</p>
    <p><strong>Trails</strong> are drawn by the birds themselves. Nothing is on
    the map before a stork has flown it, so the routes appear as they are made
    rather than sitting there waiting to be filled in. Scrubbing backwards
    unpaints them.</p>

    <h3>What is missing</h3>
    <p><strong>Gaps.</strong> These are solar tags: they report through the day
    and fall silent overnight &mdash; at 21:00 UTC not one of them reports
    &mdash; and coverage thins badly on the long crossings. What decides whether
    a gap may be drawn across is how far wrong a straight line could be, and
    that is a question about the gap's length rather than the bird's speed. Up
    to a day the line is a fair approximation: a stork covers a few hundred
    kilometres at most, a short step at this scale. Longer gaps are bridged only
    where the bird plainly did not move, which is the case on wintering grounds,
    where a tag can go quiet for a week between reports from the same field.</p>
    <p class="sub">Where a gap is too long even for that, the bird does not
    vanish: it waits as a hollow ring at the last place its tag reported, and
    its trail stops there until it comes back. Pelopidas goes quiet for
    twenty-eight days in the middle of Africa. An empty patch of map would say
    the bird was gone, which is a stronger claim than the data makes.</p>
    <p><strong>These are 59 birds, not the population.</strong> Roughly half a
    million white storks migrate along these flyways. Empty sky is where no tag
    was.</p>
    <p><strong>The map is Web Mercator</strong>, so area inflates towards the
    poles: the Baltic is drawn larger than the Sahel for the same ground. Judge
    distance along the tracks rather than across the frame.</p>
    <p><strong>Positions are rounded</strong> to 10<sup>-5</sup> degrees, about
    a metre, well under the tags' own error.</p>

    <h3>Source</h3>
    <p class="sub">Backdrop: Terrain Tiles on AWS Open Data (Mapzen/Nextzen
    terrarium), and ESA WorldCover 2021 v200, CC BY 4.0.</p>
    <p class="sub">Flack, A., Fiedler, W., Blas, J., et al. (2016).
    <em>Costs of migratory decisions: a comparison across eight white stork
    populations.</em> Science Advances 2:e1500931. Data:
    <code>doi:10.5441/001/1.78152p3q</code>, Movebank Data Repository, CC0.</p>
    <p class="sub">Rotics, S., Kaatz, M., Resheff, Y. S., et al. (2016).
    <em>The challenges of the first migration: movement and behavior of
    juvenile versus adult white storks.</em> Journal of Animal Ecology
    85:938&ndash;947. Data: <code>doi:10.5441/001/1.hn1bd23k</code>, Movebank
    Data Repository, CC0.</p>`;
}

/* A seam for scripts/render_video.py: stop the clock, put it where it is asked
   to be, and draw exactly one frame. Nothing else in the page uses it. */
window.__render = {
  bare(on){
    document.body.dataset.bare = String(!!on);
    resize(); buildProfile();
  },
  async view(name){
    if (VIEWS[name]) await setView(name);
    return sel.view;
  },
  seek(t){
    playing = false;
    simT = Math.max(0, Math.min(SPAN - 1, t));
    draw(); updateClock(); drawProfile();
  },
  span(){ return SPAN; },
};

/* ------------------------------------------------------------------- boot */

(async function boot(){
  try {
    buildNotes();
    wireControls();
    BASEMAP = await loadJSON("basemap").catch(() => null);
    if (BASEMAP){
      const img = new Image();
      img.onload = () => { basemapImg = img; baseReady = false; };
      img.src = BASEMAP.png;
    }
    updateAttrib();
    document.body.dataset.view = sel.view;
    LOADED.set(sel.view, await loadStorks(VIEWS[sel.view].file));
    DATA = LOADED.get(sel.view);
    rebuild();
    document.getElementById("loading").hidden = true;
    lastFrame = performance.now();
    requestAnimationFrame(frame);
  } catch (err){
    /* Two ways this fails: opened over file://, or the processed tracks are
       not there. The data is not kept in the repository -- see the README for
       the four commands that rebuild it. */
    document.getElementById("loading").textContent =
      "no tracks to load \u2014 rebuild data/processed (see README), and serve over http(s)";
    console.error(err);
  }
})();
</script>
